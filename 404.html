<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Không tìm thấy trang</title>
<script>
  // Gõ sai chữ hoa/thường (Mayin, MayIn, may-in, MAYIN, poppy...) thì tự chuyển về đúng trang.
  (function () {
    var p = location.pathname.toLowerCase().replace(/[^a-z0-9\/]/g, '');
    var dung = { '/mayin': '/mayin/', '/mayinthanhhuy': '/mayin/', '/poppy': '/poppy/' };
    var goc = '/' + (p.split('/')[1] || '');
    if (dung[goc] && location.pathname !== dung[goc]) location.replace(dung[goc] + location.search);
  })();
</script>
<style>
  body { margin: 0; background: #F9F4E9; color: #0B1B40; font: 17px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 60px 16px; }
  a { color: #17326A; font-weight: 600; }
</style>
</head>
<body>
  <p>Không tìm thấy trang này.</p>
  <p><a href="/mayin/">Mở Máy In Thanh Huy</a></p>
</body>
</html>
