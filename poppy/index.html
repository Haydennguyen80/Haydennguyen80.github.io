<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Poppy</title>
<meta name="theme-color" content="#14505A">
<link href="fonts/fonts.css" rel="stylesheet">
<script src="lib/three.min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="lib/jsQR.min.js"></script>
<style>
:root{
  --c1:#1E6F78; --c1d:#14505A; --c1l:#2A9AA0;
  --c2:#FFB547; --c2l:#FFF1D0; --c3:#C9772E;
  --cream:#F9F4E9; --ink:#0F0D0B;
  --sky1:#DCEBF7; --sky2:#F9F4E9; --floor:#E9D7B5; --floor-d:#D8C094;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:Nunito,"Segoe UI",Arial,sans-serif;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,.lora{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800}
#app{display:flex;flex-direction:column;height:100%}
#topbar{background:var(--c1d);color:var(--c2l);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
#topbar .name{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .name small{display:block;font-family:Nunito;font-weight:400;font-size:12px;color:#c9d3ea}
.badge{background:var(--c2);color:var(--c1d);border-radius:999px;padding:4px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.tb-btn{background:transparent;border:1px solid var(--c2);color:var(--c2l);border-radius:10px;padding:6px 10px;font-size:13px}
#stageWrap{position:relative;flex:1;min-height:0;overflow:hidden}
#stage3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#toolbar{background:var(--c1d);display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#toolbar button{min-width:0;overflow:hidden;background:var(--c1);border:1px solid var(--c1l);color:#fff;border-radius:14px;padding:8px 2px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
#toolbar button .ic{font-size:22px;line-height:1}
#toolbar button.on{background:var(--c2);color:var(--c1d);border-color:var(--c2)}
@media (max-width:520px){#toolbar{gap:3px;padding:6px 5px;padding-bottom:max(6px,env(safe-area-inset-bottom))}#toolbar button{font-size:10.5px;padding:6px 0;border-radius:10px;line-height:1.15}}
#ring{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.ringBtn{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--c2);background:var(--c1d);color:var(--c2l);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 4px 12px rgba(0,0,0,.25);transform:scale(.2);opacity:0;transition:transform .18s ease,opacity .18s ease}
.ringBtn .ic{font-size:22px;line-height:1.1}
.ringBtn.show{transform:scale(1);opacity:1}
.ringBtn:disabled{opacity:.45}
.tapDot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--c2);border:3px solid #fff;box-shadow:0 0 0 2px var(--c1)}
#marker{position:absolute;transform:translate(-50%,-100%);background:var(--c2);color:var(--c1d);font-weight:800;font-size:14px;padding:4px 10px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#marker.show{opacity:1}
#marker:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--c2);border-bottom:0}
.heart{position:absolute;color:#E5533D;font-size:22px;pointer-events:none;animation:heart 1.2s ease-out forwards}
@keyframes heart{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-60px) scale(1.2);opacity:0}}
#bubble{position:absolute;pointer-events:none;background:#fff;border:2px solid var(--c1);color:var(--c1d);border-radius:16px;padding:6px 12px;font-weight:600;font-size:15px;transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .2s}
#bubble:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--c1);border-bottom:0}
#bubble.show{opacity:1}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,80,90,.85);color:var(--c2l);padding:6px 12px;border-radius:999px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#hint.show{opacity:1}
#stopPlay{position:absolute;right:12px;top:12px;display:none;background:var(--c2);color:var(--c1d);border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#stopPlay.show{display:block}
#stopPlay span{font-weight:600;opacity:.8;margin-left:4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--c1d);color:var(--c2l);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(20,80,90,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.overlay.show{display:flex}
@media(min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px}
@media(min-width:700px){.sheet{border-radius:20px}}
.sheet h2{margin:0 0 4px;color:var(--c1d);font-size:22px}
.sheet .sub{color:#5a6276;font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--c1);color:var(--c2l);border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600}
.btn.gold{background:var(--c2);color:var(--c1d)}
.btn.ghost{background:transparent;color:var(--c1);border:2px solid var(--c1)}
.btn:disabled{opacity:.4}
input[type=text]{width:100%;font-size:18px;padding:12px;border-radius:12px;border:2px solid #c8cfdf;background:#fff;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--c1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:2px solid #e2dccd;border-radius:14px;padding:8px;text-align:center;cursor:pointer}
.card.sel{border-color:var(--c2);box-shadow:0 0 0 3px rgba(255,181,71,.35)}
.card svg{width:100%;height:96px;display:block}
.card b{display:block;color:var(--c1d)}
.card span{font-size:12px;color:#5a6276}
.opt-label{font-weight:600;color:var(--c1d);margin:14px 0 6px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#5a6276;cursor:pointer;background:none;border:0;padding:0}
.sw i{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #c8cfdf;display:block}
.sw.sel i{box-shadow:0 0 0 3px var(--c2)}
.chip{background:#fff;border:2px solid #c8cfdf;border-radius:999px;padding:8px 14px;font-size:14px}
.chip.sel{border-color:var(--c2);background:#fbf3e2;font-weight:600}
#preview{width:100%;height:190px;background:linear-gradient(var(--sky1),var(--sky2));border-radius:14px;display:block}
#prev3d{width:100%;height:230px;background:linear-gradient(var(--sky1),var(--sky2));border-radius:14px;overflow:hidden;touch-action:pan-y}
#prev3d canvas{width:100%!important;height:100%!important;display:block}
.sw.small i{width:30px;height:30px}
.lock{background:#fff4d6;border:2px solid #f0c95c;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14px;line-height:1.4}
.stat{margin:8px 0}
.stat .lbl{display:flex;justify-content:space-between;font-size:14px}
.bar{height:12px;background:#e6e0d2;border-radius:999px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--c1l);border-radius:999px}
.bar.gold i{background:var(--c2)}
.dogcard{background:var(--c1d);color:var(--c2l);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.dogcard h3{margin:0;font-size:22px;color:var(--c2l)}
.dogcard .meta{font-size:13px;color:#c9d3ea}
.dogcard svg.portrait{width:100%;height:140px;background:linear-gradient(#2A9AA0,#1E6F78);border-radius:12px;margin:8px 0}
.dogcard .stat .lbl{color:#fff}
.dogcard .bar{background:#24365f}
.qrbox{background:#fff;border-radius:12px;padding:10px;display:flex;justify-content:center;margin-top:10px}
.qrbox img,.qrbox canvas{width:180px;height:180px;image-rendering:pixelated}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profiles .card{display:flex;align-items:center;gap:10px;text-align:left}
.profiles .card svg{width:90px;height:64px;flex:none}
video#cam{width:100%;border-radius:12px;background:#000}
textarea{width:100%;min-height:70px;font-size:12px;border-radius:10px;border:2px solid #c8cfdf;padding:8px;font-family:monospace}
.small{font-size:12px;color:#5a6276}
#statsPanel{position:absolute;left:10px;top:10px;width:236px;max-width:calc(100% - 20px);background:rgba(255,250,241,.95);border:2px solid var(--c1);border-radius:14px;padding:8px 10px 6px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:12.5px;color:var(--ink);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:5}
#statsPanel.show{opacity:1;transform:none;pointer-events:auto}
#foodMenu{position:absolute;width:260px;background:rgba(255,250,241,.97);border:2px solid var(--c1);border-radius:14px;padding:8px 10px;box-shadow:0 8px 22px rgba(0,0,0,.22);display:none;z-index:6;font-size:13px}
#foodMenu.show{display:block}
#foodMenu .t{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--c1d);margin-bottom:6px}
#foodMenu .x{border:0;background:none;font-size:16px;color:var(--c1d)}
#foodMenu .fr{display:flex;gap:6px;margin:5px 0}
#foodMenu .fr button{flex:1;border:2px solid #c8cfdf;background:#fff;border-radius:10px;padding:8px 2px;font-weight:700;font-size:13px}
#foodMenu .food.sel{border-color:var(--c2);background:#fbf3e2}
#foodMenu .amt{background:var(--c1)!important;color:#fff;border-color:var(--c1)!important}
#foodMenu .amt.sug{background:var(--c2)!important;color:var(--c1d);border-color:var(--c2)!important}
#bedMenu{position:absolute;width:260px;background:rgba(255,250,241,.97);border:2px solid var(--c1);border-radius:14px;padding:8px 10px;box-shadow:0 8px 22px rgba(0,0,0,.22);display:none;z-index:6;font-size:13px}
#bedMenu.show{display:block}
#bedMenu .t{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--c1d);margin-bottom:6px}
#bedMenu .x{border:0;background:none;font-size:16px;color:var(--c1d)}
#bedMenu .fr{display:flex;gap:6px;margin:5px 0}
#bedMenu .fr button{flex:1;border:2px solid #c8cfdf;background:#fff;border-radius:10px;padding:8px 2px;font-weight:700;font-size:13px}
#bedMenu .food.sel{border-color:var(--c2);background:#fbf3e2}
#bedMenu .amt{background:var(--c1)!important;color:#fff;border-color:var(--c1)!important}
#bedMenu .amt.sug{background:var(--c2)!important;color:var(--c1d);border-color:var(--c2)!important}
#bedTag{position:absolute;transform:translate(-50%,-100%);background:#14505A;color:#FFF1D0;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;pointer-events:none;display:none;white-space:nowrap;z-index:4}
#bedTag.show{display:block}
.volRow{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.volRow input{width:100%;accent-color:#1E6F78}
.volRow b{text-align:right;color:var(--c1d)}
#btnFollow{position:absolute;right:12px;bottom:14px;display:none;background:#fff;color:var(--c1d);border:2px solid var(--c1);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:5}
#btnFollow.show{display:block}
#noBtn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;background:#D23F2A;color:#fff;border:3px solid #fff;border-radius:999px;padding:12px 26px;font-weight:900;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:6;animation:pulseNo 1s ease-in-out infinite}
#noBtn.show{display:block}
@keyframes pulseNo{50%{transform:translateX(-50%) scale(1.08)}}
.closet h3{margin:12px 0 6px;color:var(--c1d)}
.closet .items{display:flex;gap:10px;flex-wrap:wrap}
.closet .item{width:96px;background:#fff;border:2px solid #e2dccd;border-radius:14px;padding:10px 4px;text-align:center;font-weight:700;font-size:14px}
.closet .item .ic{font-size:30px;display:block}
.closet .empty{color:#8a8f9c;font-style:italic;padding:8px 2px}
#statsPanel .t{font-weight:800;color:var(--c1d);margin-bottom:4px;display:flex;justify-content:space-between}
#statsPanel .r{display:grid;grid-template-columns:92px 1fr 62px;align-items:center;gap:6px;margin:3px 0}
#statsPanel .r .b{height:10px;background:#e6e0d2;border-radius:999px;overflow:hidden}
#statsPanel .r .b i{display:block;height:100%;border-radius:999px;transition:width .4s}
#statsPanel .r .v{text-align:right;font-weight:700;white-space:nowrap}
#statsPanel .r.sick .n{color:#B3261E;font-weight:800}
#alertChip{display:none;border:0;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;color:#fff;white-space:nowrap}
#alertChip.show{display:inline-block}
#alertChip.sick{animation:blinkA 1s steps(2) infinite}
@keyframes blinkA{50%{opacity:.55}}
#ovRoom{background:rgba(20,80,90,.12)}
#outBar{display:none;background:var(--c1d);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#outBar.show{display:grid}
#workBar{display:none;background:#5B4A8B;color:#fff;align-items:center;gap:10px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));font-size:14px;line-height:1.35}
#workBar.show{display:flex}
#btnFriends.hot{background:#E5533D;color:#fff;animation:blinkA 1.2s steps(2) infinite}
#workBar #workTxt{flex:1;min-width:0}
#workBar .small{color:#E6DEFF}
#workBar button{flex:none;background:#fff;color:#5B4A8B;border:0;border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px}
label.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:15px;line-height:1.35;cursor:pointer}
label.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#1E6F78}
#ovGate{z-index:60}
#outBar button{min-width:0;background:#2E8B57;border:1px solid #5DB36A;color:#fff;border-radius:14px;padding:8px 2px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
#outBar button .ic{font-size:22px;line-height:1}
#questBox{position:absolute;left:10px;top:10px;max-width:250px;background:rgba(255,250,241,.96);border:2px solid #E5533D;border-radius:14px;padding:8px 10px;font-size:13px;line-height:1.5;display:none;z-index:5;pointer-events:none}
#questBox.show{display:block}
#outStat{position:absolute;right:10px;top:10px;background:rgba(20,80,90,.8);color:#FFF1D0;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;pointer-events:none}
#outStat:empty{display:none}
#fade{position:absolute;inset:0;background:#0b1a1c;opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}
#fade.show{opacity:1}
.item small{font-weight:600;color:#5a6276}
#btnMap{position:absolute;right:10px;top:44px;background:#2E8B57;color:#fff;border:2px solid #fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:5}
#outStat{z-index:5}
.svcList{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.svc{background:#fff;border:2px solid #e2dccd;border-radius:14px;padding:8px 10px}
.svcT{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.svcT .ic{font-size:28px;line-height:1}
.svc .btn{padding:7px 10px;font-size:13px}
#ovRoom .sheet{max-height:58vh}
@media(min-width:700px){#ovRoom{align-items:flex-end}#ovRoom .sheet{border-radius:20px 20px 0 0}}
.roomGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.roomCard{background:#fff;border:2px solid #e2dccd;border-radius:12px;padding:4px;text-align:center;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--c1d);line-height:1.2}
.roomCard svg{width:100%;height:auto;display:block;margin-bottom:3px}
.roomCard.sel{border-color:var(--c2);box-shadow:0 0 0 3px rgba(255,181,71,.35)}
.palDots{display:flex;justify-content:center;gap:2px;margin:4px 0 3px}
.palDots i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}
@media(max-width:420px){.roomCard{font-size:10px}.palDots i{width:11px;height:11px}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="name" id="tbName">Poppy<small id="tbOwner"></small></div>
    <button id="alertChip"></button>
    <span class="badge" id="tbClock" title="Giờ trong game (1 giờ thật = 1 ngày)">🕐 --:--</span>
    <span class="badge" id="tbCoins">🪙 100</span>
    <span class="badge" id="tbLevel">Cấp 1</span>
    <button class="tb-btn" id="btnFriends" style="display:none" title="Bạn bè">👥</button>
    <button class="tb-btn" id="btnBedroom">🛏️ P. ngủ</button>
    <button class="tb-btn" id="btnRoom">🏠 Phòng</button>
    <button class="tb-btn" id="btnProfiles">Đổi hồ sơ</button>
  </div>
  <div id="stageWrap">
    <canvas id="stage3d"></canvas>
    <div id="ring"></div>
    <div id="statsPanel"></div>
    <div id="foodMenu"></div>
    <div id="bedMenu"></div>
    <div id="bedTag"></div>
    <button id="btnFollow">🎯 Về chó</button>
    <button id="btnMap">🗺️ Bản đồ</button>
    <div id="questBox"></div>
    <div id="outStat"></div>
    <div id="fade"></div>
    <button id="noBtn">🚫 Không!</button>
    <div id="bubble"></div>
    <div id="hint"></div>
    <div id="marker"></div>
    <button id="stopPlay">⏹ Dừng chơi <span id="stopPlayTime">0:00</span></button>
  </div>
  <div id="outBar">
    <button id="oHome"><span class="ic">🏠</span>Về nhà</button>
    <button id="oCall"><span class="ic">📣</span>Gọi chó</button>
    <button id="oTreat"><span class="ic">🍪</span>Thưởng</button>
    <button id="oStop" style="display:none"><span class="ic">🛑</span>Dừng bơi</button>
    <button id="oFree" style="display:none"><span class="ic">🦮</span>Thả chó</button>
    <button id="oTicket" style="display:none"><span class="ic">🎟️</span>Vé học</button>
    <button id="oCoins"><span class="ic">🪙</span>xu</button>
  </div>
  <div id="workBar"><div id="workTxt"></div><button id="workHome">🏠 Về sớm</button></div>
  <div id="toolbar">
    <button id="tCall"><span class="ic">📣</span><span id="tCallLbl">Gọi tên</span></button>
    <button id="tGym"><span class="ic">🏃</span>Tập</button>
    <button id="tCloset"><span class="ic">🧺</span>Tủ đồ</button>
    <button id="tInfo"><span class="ic">📊</span>Thông tin</button>
    <button id="tCard"><span class="ic">🪪</span>Thẻ chó</button>
  </div>
</div>
<div id="toast"></div>

<!-- Tạo chó / hồ sơ -->
<div class="overlay" id="ovCreate"><div class="sheet" id="createSheet"></div></div>
<div class="overlay" id="ovGate"><div class="sheet" id="gateSheet"></div></div>
<div class="overlay" id="ovProfiles"><div class="sheet" id="profilesSheet"></div></div>
<div class="overlay" id="ovInfo"><div class="sheet" id="infoSheet"></div></div>
<div class="overlay" id="ovCloset"><div class="sheet" id="closetSheet"></div></div>

function shade(hex, f){ // f<0 tối hơn, f>0 sáng hơn
  const n = parseInt(hex.slice(1),16);
  let r=n>>16, g=(n>>8)&255, b=n&255;
  if (f<0){ r*=1+f; g*=1+f; b*=1+f; } else { r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; }
  return "#"+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,"0")).join("");
}

/* =========================================================
   VẼ CHÓ
   pose: cy (độ cao tâm thân), tilt (rad, âm = ngóc đầu lên),
   fF/bF (chân trước/sau: lệch ngang của bàn chân so với vai/hông),
   fLift/bLift, head (rad), ear (0..1 cụp), tail (rad), wag, eye (0..1),
   happy (0..1 mắt cười), tongue (0..1), mouth (0..1), chew
   ========================================================= */
function ik(hx,hy,fx,fy,L1,L2,bend){
  let dx=fx-hx, dy=fy-hy, d=Math.hypot(dx,dy)||0.001;
  const maxD=L1+L2-0.01, minD=Math.abs(L1-L2)+0.5;
  const a=Math.atan2(dy,dx);
  if (d>maxD){ fx=hx+Math.cos(a)*maxD; fy=hy+Math.sin(a)*maxD; d=maxD; }
  if (d<minD){ d=minD; fx=hx+Math.cos(a)*d; fy=hy+Math.sin(a)*d; }
  const A=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  const ang=a-bend*A;
  return {kx:hx+Math.cos(ang)*L1, ky:hy+Math.sin(ang)*L1, fx, fy};
}

function standPose(){
  return {cy:0, tilt:0, fF:0, bF:0, fLift:0, bLift:0, fLiftFar:0, bLiftFar:0, fFFar:0, bFFar:0,
          head:0, yaw:0, cock:0, wiggle:0, bodyShake:0, ear:0, tail:0, wag:0.25, wagSpd:6, eye:1, happy:0, tongue:0, mouth:0, chew:0, sleep:0, fStretch:1, shake:0, belly:0};
}

function poseFor(type, B){
  const p = standPose();
  const L = B.legL, H = B.bodyH;
  const standCy = L + H*0.25;
  p.cy = standCy;
  switch(type){
    case "sit": {
      // hông sát đất, thân ngóc lên theo góc riêng của từng giống, chân trước duỗi dài ra để chạm đất
      const rearHip = Math.max(L*0.3, 4);
      p.tilt = -B.sitTilt;
      const hx = -B.bodyL*0.5 + B.legW*0.9, hy = H*0.25;
      p.cy = rearHip + hx*Math.sin(p.tilt) + hy*Math.cos(p.tilt);
      const sx = B.bodyL*0.5 - B.legW*0.9;
      const shoulderH = p.cy - (sx*Math.sin(p.tilt) + hy*Math.cos(p.tilt));
      p.fStretch = clamp(shoulderH/(L*1.08), 1, 2.6);
      p.bF = L*0.55; p.bFFar = L*0.55; p.fF = 2; p.fFFar = 2;
      p.head = 0.05 + B.sitTilt*0.25; p.tail = 0.6; p.wag = 0.15;
      break;
    }
    case "beg": { // đứng hai chân sau
      p.tilt = -1.05;
      const half = B.bodyL*0.42;
      p.cy = L*0.9 + H*0.2 + Math.sin(1.05)*half;
      p.bF = L*0.35; p.bFFar = L*0.15; p.fStretch = 1;
      p.fF = 6; p.fFFar = 2; p.fLift = 999; p.fLiftFar = 999; // 999 = co chân trước lên ngực
      p.head = 0.15; p.tail = 0.3; p.wag = 0.5; p.wagSpd = 14; p.happy = 1; p.tongue = 1;
      break;
    }
    case "lie": {
      p.cy = H*0.5;
      p.fF = L*0.95; p.fFFar = L*0.85; p.bF = L*0.7; p.bFFar = L*0.6;
      p.head = 0.05; p.tail = 1.1; p.wag = 0.1;
      break;
    }
    case "sleep": {
      p.cy = H*0.46;
      p.fF = L*1.0; p.fFFar = L*0.9; p.bF = L*0.7; p.bFFar = L*0.6;
      p.head = 0.5; p.ear = 0.6; p.tail = 1.3; p.wag = 0; p.eye = 0; p.sleep = 1;
      break;
    }
    case "sad": {
      p.cy = H*0.5;
      p.fF = L*0.95; p.fFFar = L*0.85; p.bF = L*0.7; p.bFFar = L*0.6;
      p.head = 0.35; p.ear = 1; p.tail = 1.5; p.wag = 0.03; p.wagSpd = 2; p.eye = 0.55;
      break;
    }
    case "eat": {
      p.tilt = 0.12; p.head = 0.9; p.fF = 3; p.mouth = 0.3; p.chew = 1; p.wag = 0.35; p.wagSpd = 10;
      break;
    }
    case "belly": { // nằm ngửa phơi bụng: chân trước co lên ngực, chân sau co lỏng
      p.cy = H*0.55;
      p.fF = -L*0.25; p.fFFar = -L*0.1; p.fLift = L*0.55; p.fLiftFar = L*0.45;   // chân trước co gập về phía bụng, không che mặt
      p.bF = L*0.3; p.bFFar = L*0.15; p.bLift = L*0.45; p.bLiftFar = L*0.3;
      p.head = -0.6; p.tail = 0.3; p.wag = 0.8; p.wagSpd = 12; p.happy = 1; p.tongue = 1; p.eye = 0.45; p.belly = 1;
      break;
    }
    case "chew": { // nằm gặm xương
      p.cy = H*0.5;
      p.fF = L*0.95; p.fFFar = L*0.85; p.bF = L*0.7; p.bFFar = L*0.6;
      p.head = 0.25; p.chew = 1; p.mouth = 0.4; p.wag = 0.3; p.wagSpd = 8; p.happy = 0.5;
      break;
    }
    case "happy": {
      p.happy = 1; p.tongue = 1; p.wag = 0.6; p.wagSpd = 16; p.head = -0.1;
      break;
    }
    case "play": { // chồm xuống mời chơi
      p.tilt = 0.35; p.fF = L*0.8; p.fFFar = L*0.7; p.happy = 1; p.tongue = 1; p.wag = 0.7; p.wagSpd = 18; p.head = -0.25;
      break;
    }
    case "scratch": {
      p.tilt = -0.3; p.cy = standCy*0.8; p.bF = L*0.2; p.bLift = L*0.9; p.bFFar = L*0.5; p.head = 0.3; p.eye = 0.4; p.wag = 0.1;
      break;
    }
    case "look": {
      p.head = -0.35; p.ear = 0; p.wag = 0.05; p.wagSpd = 3;
      break;
    }
    case "hungry": {
      p.head = 0.25; p.ear = 0.6; p.wag = 0.08; p.wagSpd = 3; p.eye = 0.75;
      break;
    }
  }
  return p;
}

// vẽ một con chó, trả về chuỗi SVG (hệ toạ độ: mặt đất y=0, chó quay sang phải)
function dogSVG(look, pose, t, opts={}){
  const B = BREEDS[look.breed];
  const C = lookColors(look);   // màu theo vùng (hình 2D nhỏ: thân, ngực, chân, đầu, mõm)
  const main = C.body, second = C.chest, points = null;
  const dark = shade(main, -0.28), outline = shade(main, -0.55);
  const eyeC = "#120C0A";   // mẫu A: mắt cúc áo đen
  const L1 = B.legL*0.55, L2 = B.legL*0.55;
  const hL = B.bodyL*0.5, hH = B.bodyH*0.5;
  const ct = Math.cos(pose.tilt), st = Math.sin(pose.tilt);
  const cx = 0, cyW = -pose.cy;
  const W = (x,y) => [cx + x*ct - y*st, cyW + x*st + y*ct];
  const breath = Math.sin(t*2.2)*(pose.sleep>0.5?1.2:0.6);
  let s = "";

  // hông/vai
  const sh = W(hL - B.legW*0.9, hH*0.5);
  const hp = W(-hL + B.legW*0.9, hH*0.5);
  const legColor = C.legs;
  const leg = (hx,hy,fx,lift,bend,color,far) => {
    let fy = -lift;
    const st = (bend<0) ? (pose.fStretch||1) : 1;
    let L1x=L1*st, L2x=L2*st;
    if (lift===999){ // co chân trước lên ngực
      const k = ik(hx,hy,hx+B.legL*0.6,hy+B.legL*0.15,L1x,L2x,-1);
      return limb(hx,hy,k.kx,k.ky,k.fx,k.fy,color,far);
    }
    const k = ik(hx,hy,hx+fx,fy,L1x,L2x,bend);
    return limb(hx,hy,k.kx,k.ky,k.fx,k.fy,color,far);
  };
  const limb = (hx,hy,kx,ky,fx,fy,color,far) => {
    const c = far ? shade(color,-0.18) : color;
    const w = B.legW;
    return `<path d="M${hx.toFixed(1)},${hy.toFixed(1)} L${kx.toFixed(1)},${ky.toFixed(1)} L${fx.toFixed(1)},${fy.toFixed(1)}" stroke="${shade(c,-0.35)}" stroke-width="${w+2.4}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+
           `<path d="M${hx.toFixed(1)},${hy.toFixed(1)} L${kx.toFixed(1)},${ky.toFixed(1)} L${fx.toFixed(1)},${fy.toFixed(1)}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+
           `<ellipse cx="${(fx+w*0.25).toFixed(1)}" cy="${(fy-w*0.15).toFixed(1)}" rx="${(w*0.72).toFixed(1)}" ry="${(w*0.48).toFixed(1)}" fill="${c}" stroke="${shade(c,-0.35)}" stroke-width="1.2"/>`;
  };

  // chân phía xa
  s += leg(sh[0]-3, sh[1], pose.fFFar, pose.fLiftFar, -1, legColor, true);
  s += leg(hp[0]+3, hp[1], pose.bFFar, pose.bLiftFar, 1, legColor, true);

  // đuôi
  const tb = W(-hL*0.92, -hH*0.45);
  const wagA = Math.sin(t*pose.wagSpd)*pose.wag;
  const tailRot = (pose.tilt + pose.tail*0.6 + wagA) * 180/Math.PI;
  const tailSVG = tailShape(look.tail, B, main, second, outline);
  const tailFront = (look.tail==="curl");
  const tailG = `<g transform="translate(${tb[0].toFixed(1)},${tb[1].toFixed(1)}) rotate(${tailRot.toFixed(1)})">${tailSVG}</g>`;
  if (!tailFront) s += tailG;

  // tai phía xa (vẽ sau đầu nên tính trước)
  // thân
  const bodyRot = pose.tilt*180/Math.PI;
  let body = "";
  const bw = hL, bh = hH + breath*0.3;
  body += `<ellipse cx="0" cy="0" rx="${bw.toFixed(1)}" ry="${bh.toFixed(1)}" fill="${main}" stroke="${outline}" stroke-width="2"/>`;
  if (B.belly){
    body += `<ellipse cx="${(bw*0.15).toFixed(1)}" cy="${(bh*0.45).toFixed(1)}" rx="${(bw*0.72).toFixed(1)}" ry="${(bh*0.5).toFixed(1)}" fill="${second}"/>`;
    body += `<ellipse cx="${(bw*0.82).toFixed(1)}" cy="${(bh*0.05).toFixed(1)}" rx="${(bw*0.22).toFixed(1)}" ry="${(bh*0.75).toFixed(1)}" fill="${second}"/>`;
  }
  if (points){
    body += `<ellipse cx="${(bw*0.75).toFixed(1)}" cy="${(bh*0.55).toFixed(1)}" rx="${(bw*0.18).toFixed(1)}" ry="${(bh*0.32).toFixed(1)}" fill="${points}"/>`;
  }
  if (B.fur==="fluffy"){
    for (let i=0;i<9;i++){
      const a = Math.PI*(1.05 + i*0.11);
      body += `<circle cx="${(Math.cos(a)*bw*0.92).toFixed(1)}" cy="${(Math.sin(a)*bh*0.92).toFixed(1)}" r="${(bh*0.32).toFixed(1)}" fill="${main}"/>`;
    }
    // bờm ngực
    body += `<circle cx="${(bw*0.72).toFixed(1)}" cy="${(-bh*0.05).toFixed(1)}" r="${(bh*0.78).toFixed(1)}" fill="${shade(main,0.1)}" stroke="${outline}" stroke-width="1.5"/>`;
    for (let i=0;i<6;i++){
      const a = -0.9 + i*0.45;
      body += `<circle cx="${(bw*0.72+Math.cos(a)*bh*0.7).toFixed(1)}" cy="${(-bh*0.05+Math.sin(a)*bh*0.7).toFixed(1)}" r="${(bh*0.26).toFixed(1)}" fill="${shade(main,0.1)}"/>`;
    }
  } else if (B.fur==="curly"){
    const curl = shade(main, main==="#262222"?0.12:-0.07);
    for (let i=0;i<14;i++){
      const a = i/14*Math.PI*2;
      body += `<circle cx="${(Math.cos(a)*bw*0.86).toFixed(1)}" cy="${(Math.sin(a)*bh*0.82).toFixed(1)}" r="${(bh*0.3).toFixed(1)}" fill="${main}" stroke="${curl}" stroke-width="1.5"/>`;
    }
    for (let i=0;i<5;i++) body += `<circle cx="${(-bw*0.5+i*bw*0.25).toFixed(1)}" cy="${(-bh*0.1+(i%2)*bh*0.3).toFixed(1)}" r="${(bh*0.22).toFixed(1)}" fill="none" stroke="${curl}" stroke-width="1.4"/>`;
  }
  s += `<g transform="translate(${cx},${cyW.toFixed(1)}) rotate(${bodyRot.toFixed(1)})">${body}</g>`;
  if (tailFront) s += tailG;

  // chân phía gần
  s += leg(hp[0], hp[1], pose.bF, pose.bLift, 1, legColor, false);
  s += leg(sh[0], sh[1], pose.fF, pose.fLift, -1, legColor, false);

  // đầu
  const neck = W(hL*0.78, -hH*0.55);
  const headAng = (pose.head + pose.tilt*0.35) * 180/Math.PI;
  const R = B.headR;
  const bob = pose.chew > 0.3 ? Math.sin(t*14)*0.8 : 0;
  let head = "";
  const hx = R*0.45, hy = -R*0.75 + bob;
  const earDroop = pose.ear;
  const ears = earShape(look.ear, B, R, main, second, outline, earDroop, t);
  head += `<g transform="translate(${(hx-R*0.15).toFixed(1)},${hy.toFixed(1)})">${ears.far}</g>`;
  if (B.fur==="curly") head += `<circle cx="${(hx-R*0.2).toFixed(1)}" cy="${(hy-R*0.75).toFixed(1)}" r="${(R*0.62).toFixed(1)}" fill="${main}" stroke="${shade(main,-0.12)}" stroke-width="1.5"/>`;
  head += `<circle cx="${hx}" cy="${hy.toFixed(1)}" r="${R}" fill="${C.head}" stroke="${outline}" stroke-width="2"/>`;
  if (B.fur==="fluffy"){
    for (let i=0;i<6;i++){ const a=Math.PI*(0.55+i*0.17); head += `<circle cx="${(hx+Math.cos(a)*R*0.95).toFixed(1)}" cy="${(hy+Math.sin(a)*R*0.95).toFixed(1)}" r="${(R*0.28).toFixed(1)}" fill="${main}"/>`; }
  }
  // má/mõm
  const snoutC = C.muzzle;
  const mouthOpen = pose.mouth + (pose.chew > 0.3 ? (Math.sin(t*14)*0.5+0.5)*0.5 : 0) + pose.tongue*0.3;
  const snX = hx + R*0.62, snY = hy + R*0.3;
  head += `<ellipse cx="${(snX+B.snout*0.35).toFixed(1)}" cy="${(snY+mouthOpen*2).toFixed(1)}" rx="${(B.snout*0.75+3).toFixed(1)}" ry="${(B.snoutH*0.45).toFixed(1)}" fill="${shade(snoutC,-0.1)}" stroke="${outline}" stroke-width="1.5"/>`;
  head += `<ellipse cx="${(snX+B.snout*0.4).toFixed(1)}" cy="${snY.toFixed(1)}" rx="${(B.snout*0.8+4).toFixed(1)}" ry="${(B.snoutH*0.55).toFixed(1)}" fill="${snoutC}" stroke="${outline}" stroke-width="1.5"/>`;
  if (pose.tongue>0.5){
    head += `<path d="M${(snX+B.snout*0.3).toFixed(1)},${(snY+B.snoutH*0.4).toFixed(1)} q3,${(9+Math.sin(t*10)*1.5).toFixed(1)} 8,0" fill="#E86A7A" stroke="#B0475A" stroke-width="1.2"/>`;
  }
  // mũi
  head += `<ellipse cx="${(snX+B.snout*1.15+3).toFixed(1)}" cy="${(snY-B.snoutH*0.25).toFixed(1)}" rx="3.6" ry="3" fill="#1A1412"/>`;
  // mắt
  const ex = hx + R*0.3, ey = hy - R*0.15;
  const blink = (Math.sin(t*0.9+look.coat)>0.985) ? 0.1 : 1;
  const open = pose.eye*blink;
  if (pose.happy>0.5 && pose.eye>0.5){
    head += `<path d="M${ex-4},${ey+1} q4,-6 8,0" stroke="#1A1412" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  } else if (open<0.2){
    head += `<path d="M${ex-4},${ey} q4,3.5 8,0" stroke="#1A1412" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  } else {
    head += `<ellipse cx="${ex}" cy="${ey}" rx="3.8" ry="${(4.4*Math.max(open,0.25)).toFixed(1)}" fill="${eyeC}" stroke="#1A1412" stroke-width="1.2"/>`;
    head += `<circle cx="${ex+1.2}" cy="${ey-1.3*open}" r="1.2" fill="#fff"/>`;
    if (open<0.8) head += `<path d="M${ex-5},${(ey-4.4*open+1).toFixed(1)} h10" stroke="${outline}" stroke-width="2" stroke-linecap="round"/>`;
  }
  head += `<g transform="translate(${(hx-R*0.15).toFixed(1)},${hy.toFixed(1)})">${ears.near}</g>`;
  if (pose.sleep > 0.5){
    const z = (t*0.6)%1;
    head += `<text x="${(hx+R*0.4+z*10).toFixed(1)}" y="${(hy-R*1.2-z*18).toFixed(1)}" font-size="${(10+z*6).toFixed(1)}" fill="#2A9AA0" opacity="${(1-z).toFixed(2)}" font-family="Baloo 2,sans-serif" font-weight="700">z</text>`;
  }
  s += `<g transform="translate(${neck[0].toFixed(1)},${neck[1].toFixed(1)}) rotate(${headAng.toFixed(1)})">${head}</g>`;

  // tính vị trí đỉnh đầu cho bong bóng (toạ độ cục bộ)
  opts.headTop = [neck[0] + hx, neck[1] - R*2.1];
  { const a = headAng*Math.PI/180, mx = snX + B.snout*0.9, my = snY + B.snoutH*0.6;
    opts.mouth = [neck[0] + mx*Math.cos(a) - my*Math.sin(a), neck[1] + mx*Math.sin(a) + my*Math.cos(a)]; }
  return s;
}

function earShape(type, B, R, main, second, outline, droop, t){
  const inner = shade(main, 0.25);
  const ear = (tilt, far) => {
    const c = far ? shade(main,-0.15) : main;
    const ox = far ? R*0.25 : 0;
    switch(type){
      case "prick": case "bigPrick": {
        const h = (type==="bigPrick"? R*1.05 : R*0.75);
        const w = (type==="bigPrick"? R*0.62 : R*0.5);
        const rot = -18 + droop*70 + tilt;
        return `<g transform="translate(${(-R*0.15+ox).toFixed(1)},${(-R*0.6).toFixed(1)}) rotate(${rot.toFixed(1)})">
          <path d="M${-w/2},0 L0,${-h} L${w/2},0 Z" fill="${c}" stroke="${outline}" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M${-w/4},-2 L0,${-h*0.7} L${w/4},-2 Z" fill="${far?c:"#E9A9A0"}"/></g>`;
      }
      case "fold": {
        const rot = -10 + droop*50 + tilt;
        return `<g transform="translate(${(-R*0.1+ox).toFixed(1)},${(-R*0.65).toFixed(1)}) rotate(${rot.toFixed(1)})">
          <path d="M${-R*0.3},0 L${R*0.05},${-R*0.55} L${R*0.42},${-R*0.2} Z" fill="${c}" stroke="${outline}" stroke-width="1.8" stroke-linejoin="round"/></g>`;
      }
      case "floppy": case "longDrop": case "curlyDrop": {
        const len = type==="longDrop" ? R*1.45 : (type==="curlyDrop" ? R*1.35 : R*1.1);
        const sw = Math.sin(t*3)*3*(1-droop);
        const rot = 8 + droop*12 + tilt*0.3 + sw;
        const curly = type==="curlyDrop";
        let e = `<g transform="translate(${(-R*0.35+ox).toFixed(1)},${(-R*0.5).toFixed(1)}) rotate(${rot.toFixed(1)})">`;
        if (curly){
          for (let i=0;i<4;i++) e += `<circle cx="${(i%2?3:-1)}" cy="${(i*len*0.26).toFixed(1)}" r="${(R*0.36).toFixed(1)}" fill="${c}" stroke="${shade(main,-0.15)}" stroke-width="1.4"/>`;
        } else {
          e += `<path d="M${-R*0.28},0 C${-R*0.5},${len*0.6} ${-R*0.2},${len} ${R*0.08},${len} C${R*0.38},${len} ${R*0.42},${len*0.45} ${R*0.3},0 Z" fill="${shade(c,-0.12)}" stroke="${outline}" stroke-width="1.8"/>`;
        }
        return e + `</g>`;
      }
    }
    return "";
  };
  return { far: ear(-12, true), near: ear(0, false) };
}

function tailShape(type, B, main, second, outline){
  const L = B.bodyL;
  switch(type){
    case "curl": // cuộn lên lưng
      return `<path d="M0,0 C${-L*0.18},${-L*0.32} ${L*0.25},${-L*0.48} ${L*0.32},${-L*0.2}" stroke="${outline}" stroke-width="${B.fur==="fluffy"?20:11}" fill="none" stroke-linecap="round"/>
              <path d="M0,0 C${-L*0.18},${-L*0.32} ${L*0.25},${-L*0.48} ${L*0.32},${-L*0.2}" stroke="${main}" stroke-width="${B.fur==="fluffy"?17:8}" fill="none" stroke-linecap="round"/>
              ${B.fur==="fluffy"?`<circle cx="${L*0.06}" cy="${-L*0.36}" r="${L*0.14}" fill="${shade(main,0.08)}"/>`:`<path d="M${L*0.2},${-L*0.33} C${L*0.3},${-L*0.3} ${L*0.33},${-L*0.25} ${L*0.32},${-L*0.2}" stroke="${second}" stroke-width="5" fill="none" stroke-linecap="round"/>`}`;
    case "plume":
      return `<ellipse cx="${-L*0.12}" cy="${-L*0.28}" rx="${L*0.16}" ry="${L*0.3}" transform="rotate(-25)" fill="${shade(main,0.06)}" stroke="${outline}" stroke-width="1.8"/>`;
    case "fox":
      return `<ellipse cx="${-L*0.18}" cy="${-L*0.1}" rx="${L*0.2}" ry="${L*0.08}" transform="rotate(-25)" fill="${main}" stroke="${outline}" stroke-width="1.8"/>
              <ellipse cx="${-L*0.32}" cy="${-L*0.17}" rx="${L*0.07}" ry="${L*0.05}" transform="rotate(-25)" fill="${second}"/>`;
    case "stub":
      return `<ellipse cx="${-4}" cy="${-3}" rx="7" ry="5" fill="${main}" stroke="${outline}" stroke-width="1.6"/>`;
    case "pompom":
      return `<path d="M0,0 L${-L*0.08},${-L*0.42}" stroke="${outline}" stroke-width="6" stroke-linecap="round"/>
              <path d="M0,0 L${-L*0.08},${-L*0.42}" stroke="${main}" stroke-width="4" stroke-linecap="round"/>
              <circle cx="${-L*0.09}" cy="${-L*0.47}" r="${L*0.13}" fill="${main}" stroke="${shade(main,-0.15)}" stroke-width="1.6"/>`;
    case "straight":
      return `<path d="M0,0 L${-L*0.18},${-L*0.42}" stroke="${outline}" stroke-width="8" stroke-linecap="round"/>
              <path d="M0,0 L${-L*0.18},${-L*0.42}" stroke="${main}" stroke-width="5.5" stroke-linecap="round"/>`;
    case "sickle":
      return `<path d="M0,0 C${-L*0.2},${-L*0.25} ${-L*0.05},${-L*0.5} ${L*0.12},${-L*0.42}" stroke="${outline}" stroke-width="11" fill="none" stroke-linecap="round"/>
              <path d="M0,0 C${-L*0.2},${-L*0.25} ${-L*0.05},${-L*0.5} ${L*0.12},${-L*0.42}" stroke="${main}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
    case "long": // dachshund: dài, thon, cong nhẹ
      return `<path d="M0,0 C${-L*0.18},${L*0.02} ${-L*0.3},${-L*0.05} ${-L*0.38},${-L*0.16}" stroke="${outline}" stroke-width="7" fill="none" stroke-linecap="round"/>
              <path d="M0,0 C${-L*0.18},${L*0.02} ${-L*0.3},${-L*0.05} ${-L*0.38},${-L*0.16}" stroke="${main}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
    case "saber":
      return `<path d="M0,0 C${-L*0.15},${-L*0.05} ${-L*0.28},${-L*0.2} ${-L*0.3},${-L*0.36}" stroke="${outline}" stroke-width="7" fill="none" stroke-linecap="round"/>
              <path d="M0,0 C${-L*0.15},${-L*0.05} ${-L*0.28},${-L*0.2} ${-L*0.3},${-L*0.36}" stroke="${main}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  }
  return "";
}

// ảnh tĩnh (thẻ, thẻ chọn giống)
function staticDog(look, w, h, type="stand", bg=""){
  const B = BREEDS[look.breed];
  const pose = poseFor(type==="stand"?"happy":type, B);
  const span = B.bodyL + B.headR*2 + B.snout + 40;
  const tall = B.legL + B.bodyH + B.headR*2.6 + 10;
  const sc = Math.min(w/span, h/tall)*0.95;
  const ox = w/2 - (B.headR*0.6)*sc, oy = h - 8;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${bg}<ellipse cx="${w/2}" cy="${oy}" rx="${span*sc*0.4}" ry="5" fill="rgba(0,0,0,.12)"/><g transform="translate(${ox},${oy}) scale(${sc})">${dogSVG(look,pose,0.3)}</g></svg>`;
}

let save = loadSave();
let prof = null; // hồ sơ đang chơi

function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw){ const d = JSON.parse(raw); if (d && Array.isArray(d.profiles)) return d; }
  } catch(e){}
  return {version: SAVE_VERSION, profiles: [], current: null};
}
function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
  catch(e){ toast("Không lưu được trên trình duyệt này. Hãy dùng nút Lưu bản sao."); }
}
function newProfile(owner, look, name, ownerLook){
  const B = BREEDS[look.breed];
  const now = Date.now();
  return {
    id: uid(), owner, created: now, ownerLook: Object.assign({}, OWNER_DEFAULT, ownerLook||{}),
    dog: {name, breed: look.breed, coat: look.coat, ear: look.ear, tail: look.tail, eye: look.eye, colors: Object.assign({}, look.colors||{})},
    stats: {xp: 0, hunger: 20, happy: 75, bond: 10, weight: 50, thirst: 0, fit: 50, sick: 0, energy: 85, clean: 95},
    skills: {come: 0, sit: 0, stand: 0, lie: 0, potty: 0, no: 0},
    practiced: {come: now, sit: now, stand: now, lie: now, potty: now, no: now},
    bladder: 20, messes: [], marks: {sofa: 0, table: 0, cab: 0}, lastLove: now,
    pets: {date: todayStr(now), gained: 0, recent: []},
    treats: {left: TREAT_BAG, bag: true}, room: {layout: 0, palette: 0},
    last: now, clock: now
  };
}
// bệnh: thanh nào xuống dưới 10% càng lâu thì bệnh càng nặng, nhưng không bao giờ chết
const SICK_LABELS = ["Khỏe", "Hơi mệt", "Ốm", "Ốm nặng"];
function sickLevel(v){ v = v||0; return v >= 80 ? 3 : v >= 50 ? 2 : v >= 25 ? 1 : 0; }
function happyCap(v){ return [100, 80, 50, 30][sickLevel(v)]; }
function curSick(){ return prof ? sickLevel(prof.stats.sick) : 0; }
function levelOf(p){ return 1 + Math.floor(Math.sqrt(p.stats.xp/30)); }
function weightLabel(w){ return w < 35 ? "Cần ăn thêm" : (w > 65 ? "Hơi tròn" : "Vừa vặn"); }

// thời gian trôi (kể cả lúc tắt app). p.clock = giờ trong trò chơi (bằng giờ thật, trừ khi thử nhanh ?speed=)
function gameNow(p){ return p.clock || Date.now(); }
function applyTime(p, now){
  const dtReal = clamp(now - p.last, 0, 7*86400000);
  if (dtReal <= 0){ p.last = now; return; }
  let start = now - dtReal;
  if (!p.clock) p.clock = start;   // đồng hồ game bắt đầu bằng giờ thật, sau đó chạy riêng
  // đang chơi: nhanh gấp 24; phần quá 5 giây (máy ngủ, tắt màn hình) và lúc tắt game: bằng giờ thật
  const liveMs = liveApply ? Math.min(dtReal, LIVE_GAP_MAX) : 0;
  const run = (from, to, sp) => {   // tính từng đoạn tối đa 30 phút giờ game: đói, ăn, khỏi bệnh theo thứ tự
    const chunk = 1800000/sp;
    while (from < to){ const end = Math.min(to, from + chunk); p.last = from; stepTime(p, end, sp); from = end; }
  };
  run(start, now - liveMs, SPEED);
  run(now - liveMs, now, SPEED*GAME_SPEED);
  p.last = now;
}
function stepTime(p, now, sp = SPEED){
  const dtReal = now - p.last;
  p.last = now;
  if (dtReal <= 0) return;
  const S = p.stats, B = BREEDS[p.dog.breed];
  if (p.skills.lie == null){ p.skills.lie = 0; p.practiced.lie = p.last; }
  if (!p.pets) p.pets = {date: todayStr(now), gained: 0, recent: []};
  if (S.thirst == null) S.thirst = 0;
  if (S.fit == null) S.fit = 50;
  if (S.sick == null) S.sick = 0;
  if (S.energy == null) S.energy = 80;
  if (S.clean == null) S.clean = 95;
  if (p.bladder == null) p.bladder = 20;
  if (!p.messes) p.messes = [];
  if (!p.marks) p.marks = {sofa: 0, table: 0, cab: 0};
  for (const k of ["potty","no"]) if (p.skills[k] == null){ p.skills[k] = 0; p.practiced[k] = p.last; }
  const from = gameNow(p);
  const to = from + dtReal*sp;
  p.clock = to;
  const dtH = dtReal*sp/3600000;
  if (p.boarding && from < p.boarding.until){   // đang gửi ở CTY KHÔI & KHANG: được chăm đủ
    S.hunger = Math.min(S.hunger, 15); S.thirst = Math.min(S.thirst || 0, 15); S.clean = 100; S.energy = Math.max(S.energy ?? 80, 85);
    S.sick = Math.max(0, (S.sick || 0) - dtH*6); p.bladder = 0; p.messes = []; return;
  }
  if (p.sitting && from < p.sitting.until && (!liveApply || p.work)){   // nhân viên tới nhà chăm chó lúc chủ vắng (tắt game hoặc đang đi làm)
    S.hunger = Math.min(S.hunger, 15); S.thirst = Math.min(S.thirst || 0, 15); S.clean = Math.max(S.clean, 90); S.energy = Math.max(S.energy ?? 80, 80);
    S.fit = Math.max(S.fit ?? 50, 60); S.happy = Math.max(S.happy, 60); S.sick = Math.max(0, (S.sick || 0) - dtH*6); p.bladder = 0; return;
  }
  // năng lượng: ngủ hoặc nghỉ thì hồi (tắt app trong giờ ngủ của chó, mặc định 22h–6h, coi như ngủ), thức thì giảm
  const resting = p.resting || (!liveApply && inSleepHours(from, p));
  const slow = resting ? 0.5 : 1;   // đang ngủ: đói, khát, buồn chậm lại
  // no bụng, nước: tự giảm đều (không còn giờ ăn, giờ uống cố định)
  S.hunger = clamp(S.hunger + dtH*RATE.full*slow, 0, 100);
  S.thirst = clamp(S.thirst + dtH*RATE.water*slow, 0, 100);
  S.energy = clamp(S.energy + dtH*(resting ? 30 : -RATE.energy*B.energy), 0, 100);
  // vui vẻ: buồn dần; đói, khát thì buồn nhanh hơn
  let happyLoss = dtH*(100/24)*B.energy*slow;
  if (S.hunger > 75 || S.thirst > 75) happyLoss += dtH*4;
  if (from - (p.lastLove || from) > 3*3600000) happyLoss *= 2;   // lâu không chơi: tụt nhanh gấp đôi (hai mũi tên đỏ)
  // vệ sinh: vết bẩn chưa dọn làm giảm (để lâu thì bốc mùi, giảm nhanh hơn); sạch thì hồi dần
  if (p.messes.length) S.clean = Math.max(0, S.clean - dtH*p.messes.reduce((a, m) => a + (from - m.t > MESS_SMELL_MS ? 4 : 2), 0));
  else S.clean = Math.min(100, S.clean + dtH*4);
  p.bladder += dtH*100/BLADDER_H;
  if (p.bladder >= 100 && !liveApply) offlinePotty(p, from);
  S.happy = Math.max(0, S.happy - happyLoss);
  // tập thể dục: giảm dần nếu không tập
  S.fit = resting ? Math.min(100, S.fit + dtH*2) : Math.max(0, S.fit - dtH*RATE.fit);
  // bệnh: thanh nào dưới 10% thì bệnh tăng (càng nhiều thanh càng nhanh; khỏe mạnh thì chậm hơn).
  // Không thanh nào dưới 10% và no bụng, nước từ 25% trở lên thì khỏi dần.
  const vals = BARS.map(b => b.get(S));
  const nLow = vals.filter(v => v < ALERT.sick).length;
  if (nLow > 0) S.sick = Math.min(100, S.sick + dtH*8*nLow*(1.3 - clamp(S.fit,0,100)/100));
  else if (vals[1] >= ALERT.orange && vals[2] >= ALERT.orange) S.sick = Math.max(0, S.sick - dtH*6);
  S.happy = Math.min(S.happy, happyCap(S.sick));
  // cân nặng: trở về vừa vặn; bị bỏ đói thì giảm cân nhẹ
  S.weight = S.weight + clamp(50 - S.weight, -dtH*0.5, dtH*0.5);
  if (S.hunger > 90) S.weight = Math.max(25, S.weight - dtH*0.8);
  // bệnh thì trí thông minh giảm dần
  if (sickLevel(S.sick) >= 1) for (const k in p.skills) p.skills[k] = Math.max(0, p.skills[k] - dtH*0.3*sickLevel(S.sick));
  // lâu không luyện thì quên nhẹ (sau 2 ngày, mỗi ngày -1)
  for (const k in p.skills){
    const idleDays = (to - p.practiced[k])/86400000;
    if (idleDays > 2){
      const loss = Math.min(dtH/24, idleDays-2);
      p.skills[k] = Math.max(0, p.skills[k] - loss);
    }
  }
  const td = todayStr(to);
  if (!p.treats.bag){ p.treats = {left: TREAT_BAG, bag: true}; }   // hồ sơ cũ (10 viên/ngày) đổi sang bịch 100 viên
}

// một bức tường, có lỗ cửa sổ / cửa chính; dựng 2 bản: cao đủ và bản thấp (khi tường nằm giữa camera và phòng)
function mkWallPieces(side, holes, H, color, P){
  const W = WALLS[side], horiz = side === "B" || side === "F";
  const a0 = horiz ? -3 - WT : -2.5, a1 = horiz ? 3 + WT : 2.5;
  const g = new THREE.Group();
  const piece = (s0, s1, y0, y1)=>{
    if (s1 - s0 < 0.005 || y1 - y0 < 0.005) return;
    const L = s1 - s0, m = new THREE.Mesh(horiz ? new THREE.BoxGeometry(L, y1 - y0, WT) : new THREE.BoxGeometry(WT, y1 - y0, L), mat(color));
    const c = W.pos((s0 + s1)/2, (y0 + y1)/2, -WT/2); m.position.copy(c); m.receiveShadow = true; g.add(m);
  };
  const hs = holes.slice().sort((p, q) => p.t - q.t);
  let s = a0;
  for (const h of hs){
    const h0 = h.t - h.w/2, h1 = h.t + h.w/2;
    piece(s, h0, 0, H);
    piece(h0, h1, 0, Math.min(h.y0, H));
    if (h.y1 < H) piece(h0, h1, h.y1, H);
    s = h1;
  }
  piece(s, a1, 0, H);
  // nẹp gỗ trên đỉnh
  const capL = a1 - a0 + 0.04, cap = horiz ? rbox(capL, 0.06, WT + 0.04, 0.015, P.trim) : rbox(WT + 0.04, 0.06, capL, 0.015, P.trim);
  cap.position.copy(W.pos((a0 + a1)/2, H + 0.03, -WT/2)); g.add(cap);
  // chân tường trắng phía trong
  const bL = (horiz ? 6 : 5), base = horiz ? rbox(bL, 0.12, 0.04, 0.01, "#FFFFFF") : rbox(0.04, 0.12, bL, 0.01, "#FFFFFF");
  base.position.copy(W.pos(0, 0.06, 0.02)); if (H > 0.3) g.add(base);
  return g;
}
function disposeTree(o){ o.traverse(m=>{ if (m.geometry && m.geometry !== SPHERE && m.geometry !== SPHERE_LO && m.geometry !== CYL) m.geometry.dispose(); for (const mt of [].concat(m.material || [])) if (mt.map && mt.map.isTexture) mt.map.dispose(); }); }

function buildRoom(li=0, pi=0){
  li = clamp(li|0, 0, LAYOUTS.length-1); pi = clamp(pi|0, 0, PALETTES.length-1);
  const L = LAYOUTS[li], P = PALETTES[pi];
  if (roomGroup){ scene.remove(roomGroup); disposeTree(roomGroup); }
  for (let i = pickables.length - 1; i >= 0; i--) if (pickables[i].userData.room) pickables.splice(i, 1);
  obstacles.length = 0;
  for (const k in room) delete room[k];
  roomGroup = new THREE.Group(); scene.add(roomGroup);
  roomKey = li + "/" + pi; room.layout = li; room.palette = pi; room.L = L; room.P = P;
  const add = (g, it, kind) => { g.position.set(it.x, 0, it.z); g.rotation.y = angOf(it); roomGroup.add(g); if (kind !== undefined) pickable(g, kind); return g; };

  // sàn gỗ
  const floorTex = canvasTex(512, 512, (g, w, h)=>{
    g.fillStyle = P.floor[0]; g.fillRect(0,0,w,h);
    const rows = 8;
    for (let i=0;i<rows;i++){
      const y = i*h/rows;
      g.fillStyle = i%2 ? P.floor[1] : P.floor[2]; g.fillRect(0, y, w, h/rows);
      g.fillStyle = "rgba(90,60,30,.25)"; g.fillRect(0, y, w, 2);
      const off = (i*173)%w;
      g.fillRect(off, y, 2, h/rows); g.fillRect((off+w/2)%w, y, 2, h/rows);
    }
  });
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(3, 2.5);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 5), new THREE.MeshStandardMaterial({map: floorTex, roughness: 0.75}));
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; floor.userData.kind = "floor";
  roomGroup.add(floor); pickables.push(floor);
  // nền nhà (mép gỗ dày)

  slab.position.set(0, -0.081, 0); slab.receiveShadow = true; roomGroup.add(slab);

  // 4 bức tường + vật treo tường

  for (const w of L.win) holes[w.w].push({t: w.t, w: WIN_W, y0: WIN_Y0, y1: WIN_Y1});
  holes[L.door.w].push({t: L.door.t, w: DOOR_W, y0: 0, y1: DOOR_H});
  room.walls = [];
  for (const side of ["B","F","L","R"]){
    const col = side === "B" || side === "F" ? P.wall : P.wall2;
    const full = mkWallPieces(side, holes[side], WH, col, P), stub = mkWallPieces(side, holes[side], STUB_H, col, P);
    stub.visible = false; roomGroup.add(full); roomGroup.add(stub);
    const W = WALLS[side];
    room.walls.push({side, full, stub, n: W.n, c: W.pos(0, WH/2, 0)});
  }
  const onWall = (g, w, t, y) => { g.position.copy(WALLS[w].pos(t, y, 0)); g.rotation.y = wallRot(w); room.walls.find(x => x.side === w).full.add(g); return g; };
  for (const w of L.win) onWall(mkWindow(P), w.w, w.t, (WIN_Y0 + WIN_Y1)/2);
  const door = mkDoor(P); onWall(door, L.door.w, L.door.t, 0);
  // thảm chùi chân và bậc thềm ở ngay cửa: luôn hiện (không ẩn theo tường)
  room.door = {w: L.door.w, t: L.door.t, inside: (()=>{ const p = WALLS[L.door.w].pos(L.door.t, 0, 0.6); return {x: p.x, z: p.z}; })()};
  onWall(mkArt(P), L.art.w, L.art.t, 1.62);
  onWall(mkClock(), L.clock.w, L.clock.t, 1.95);
  room.photos = [];
  for (const ph of L.photos || []) pickable(onWall(mkPhoto(ph.k, P), ph.w, ph.t, ph.y));
  pickable(door);

  // thảm tròn
  const rug = mesh(new THREE.CylinderGeometry(L.rug.r, L.rug.r, 0.02, 48), mat(P.rug), false);
  rug.position.set(L.rug.x, 0.011, L.rug.z); rug.userData.kind = "floor"; roomGroup.add(rug); pickables.push(rug);
  const rug2 = mesh(new THREE.CylinderGeometry(L.rug.r*0.76, L.rug.r*0.76, 0.022, 48), mat(P.rug2), false);
  rug2.position.set(L.rug.x, 0.012, L.rug.z); rug2.userData.kind = "floor"; roomGroup.add(rug2); pickables.push(rug2);

  // sofa quay về phía TV
  add(mkSofa(P), L.sofa, "sofa"); addObstacle(L.sofa.x, L.sofa.z, 2.05, 0.95, angOf(L.sofa));
  room.sofa = L.sofa;
  const st = localToRoom(L.sofa, 0.56, 0.08), sf = localToRoom(L.sofa, 1.25, 0.65);
  room.sofaTop = {x: st.x, z: st.z, y: 0.55};
  add(mkTable(P), L.table); addObstacle(L.table.x, L.table.z, 1.05, 0.6, angOf(L.table));
  add(mkTV(P), L.tv, "tv"); addObstacle(L.tv.x, L.tv.z, 1.55, 0.5, angOf(L.tv));
  const shelfG = add(mkShelf(P), L.shelf); addObstacle(L.shelf.x, L.shelf.z, 1.25, 0.42, angOf(L.shelf));
  add(mkLamp(), L.lamp, "lamp"); addObstacle(L.lamp.x, L.lamp.z, 0.45, 0.45);
  for (const p of L.plants){ add(mkPlant(), p); addObstacle(p.x, p.z, 0.5, 0.5); }
  add(mkToyBox(P), L.box, null); addObstacle(L.box.x, L.box.z, 0.65, 0.5, angOf(L.box));

  // ghế đôn bọc nệm sát cửa sổ: chỗ yêu thích, chó nhảy lên ngồi ngắm ra ngoài
  const sw = L.win.find(w => w.seat) || L.win[0], N = WALLS[sw.w].n;
  const cp = WALLS[sw.w].pos(sw.t, 0, 0.48);
  room.chair = {x: cp.x, z: cp.z, y: 0.53};

function buildPath(D){
  const W = WALLS[D.w], out = [-W.n[0], -W.n[1]];
  const p0 = W.pos(D.t, 0, -WT - 0.75), pts = [{x: p0.x, z: p0.z}];
  const p1 = {x: p0.x + out[0]*0.6, z: p0.z + out[1]*0.6}; pts.push(p1);
  if (D.w === "B"){ const sx = D.t >= 0 ? 4 : -4; pts.push({x: sx, z: p1.z}, {x: sx, z: 4.1}); }
  else if (D.w === "L" || D.w === "R") pts.push({x: p1.x, z: 4.1});
  else pts.push({x: p1.x, z: 4.1});
  pts.push({x: 0, z: 4.1}, {x: 0, z: 5.2});
  const stoneGeo = new THREE.CylinderGeometry(0.24, 0.26, 0.05, 9);
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i+1], len = Math.hypot(b.x - a.x, b.z - a.z), n = Math.max(1, Math.round(len/0.62));
    for (let k = 0; k < n; k++){
      const s = new THREE.Mesh(stoneGeo, mat(k % 2 ? "#CFC8BA" : "#C2BAAA")); const f = k/n;
      s.position.set(a.x + (b.x - a.x)*f + Math.sin(k*2.1)*0.05, -0.14, a.z + (b.z - a.z)*f + Math.cos(k*1.7)*0.05); s.rotation.y = k; s.receiveShadow = true; roomGroup.add(s);

}

function updateWalls(){
  updateOccluders();
  if (!room.walls) return;
  if (outdoor){ for (const w of room.walls){ w.full.visible = true; w.stub.visible = false; if (w.tall) for (const g of w.tall) g.visible = true; } return; }

// ---------- bản đồ đi lại (lưới + A*) ----------
const GRID = 0.12, GX = Math.round(6/GRID), GZ = Math.round(5/GRID);
let blocked = null, dogRadius = 0.3;
function buildGrid(radius){
  dogRadius = radius;
  blocked = new Uint8Array(GX*GZ);
  for (let i=0;i<GX;i++) for (let j=0;j<GZ;j++){
    const x = ROOM.x0 + (i+0.5)*GRID, z = ROOM.z0 + (j+0.5)*GRID;
    let b = x < ROOM.x0 + radius || x > ROOM.x1 - radius || z < ROOM.z0 + radius || z > ROOM.z1 - radius;
    for (const o of obstacles) if (inObstacle(o, x, z, radius)){ b = true; break; }
    blocked[i*GZ+j] = b ? 1 : 0;
  }
}
const cellOf = p => [clamp(Math.floor((p.x - ROOM.x0)/GRID), 0, GX-1), clamp(Math.floor((p.z - ROOM.z0)/GRID), 0, GZ-1)];
const cellPt = (i,j) => ({x: ROOM.x0 + (i+0.5)*GRID, z: ROOM.z0 + (j+0.5)*GRID});
function isFree(p){ const [i,j] = cellOf(p); return !blocked[i*GZ+j]; }
function nearestFree(p){
  if (isFree(p)) return {x: p.x, z: p.z};
  const [ci,cj] = cellOf(p);
  for (let r=1; r<Math.max(GX,GZ); r++){
    let best = null, bd = 1e9;
    for (let i=ci-r;i<=ci+r;i++) for (let j=cj-r;j<=cj+r;j++){
      if (i<0||j<0||i>=GX||j>=GZ || blocked[i*GZ+j]) continue;
      const q = cellPt(i,j), d = (q.x-p.x)**2 + (q.z-p.z)**2;
      if (d < bd){ bd = d; best = q; }
    }
    if (best) return best;
  }
  return {x:0, z:0};
}
function lineFree(a, b){
  const d = Math.hypot(b.x-a.x, b.z-a.z), n = Math.ceil(d/(GRID*0.5));
  for (let k=1;k<n;k++){ const t = k/n; if (!isFree({x: lerp(a.x,b.x,t), z: lerp(a.z,b.z,t)})) return false; }
  return true;
}
function findPath(from, to){
  to = nearestFree(to);
  const start = isFree(from) ? from : nearestFree(from);
  if (lineFree(start, to)) return [to];
  const [si,sj] = cellOf(start), [ti,tj] = cellOf(to);
  const N = GX*GZ, g = new Float32Array(N).fill(1e9), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const open = [si*GZ+sj]; g[si*GZ+sj] = 0;
  const h = (i,j)=>Math.hypot(i-ti, j-tj);
  while (open.length){
    let bi = 0, bf = 1e9;
    for (let k=0;k<open.length;k++){ const c = open[k], f = g[c] + h(Math.floor(c/GZ), c%GZ); if (f < bf){ bf = f; bi = k; } }
    const c = open.splice(bi,1)[0];
    if (closed[c]) continue; closed[c] = 1;
    const ci = Math.floor(c/GZ), cj = c%GZ;
    if (ci===ti && cj===tj) break;
    for (let di=-1;di<=1;di++) for (let dj=-1;dj<=1;dj++){
      if (!di && !dj) continue;
      const ni = ci+di, nj = cj+dj;
      if (ni<0||nj<0||ni>=GX||nj>=GZ) continue;
      const n = ni*GZ+nj;
      if (blocked[n] || closed[n]) continue;
      if (di && dj && (blocked[ci*GZ+nj] || blocked[ni*GZ+cj])) continue;
      const ng = g[c] + (di && dj ? 1.414 : 1);
      if (ng < g[n]){ g[n] = ng; came[n] = c; open.push(n); }
    }
  }
  const end = ti*GZ+tj;
  if (came[end] < 0) return [to];
  const pts = []; let c = end;
  while (c >= 0 && c !== si*GZ+sj){ pts.unshift(cellPt(Math.floor(c/GZ), c%GZ)); c = came[c]; }
  pts[pts.length-1] = to;
  // làm thẳng đường
  const out = []; let cur = start, k = 0;
  while (k < pts.length){
    let far = k;
    for (let m=pts.length-1; m>k; m--) if (lineFree(cur, pts[m])){ far = m; break; }
    out.push(pts[far]); cur = pts[far]; k = far + 1;
  }
  return out;
}
function randomFreePoint(){
  for (let n=0;n<200;n++){ const p = {x: rnd(ROOM.x0+0.4, ROOM.x1-0.4), z: rnd(ROOM.z0+0.4, ROOM.z1-0.4)}; if (isFree(p)) return p; }
  return {x:0, z:0.5};
}

function giveTreat(){
  closeRing(); excite();
  const p = prof;
  if (p.treats.left <= 0){ toast("Hết treat rồi! Sau này mua bịch mới ở cửa hàng nha"); return; }
  p.treats.left--; loved();
  const S = p.stats;
  S.happy = Math.min(happyCap(S.sick), S.happy + 2);   // treat: làm chó vui (+2 Tình cảm), giúp học lệnh
  S.hunger = Math.max(0, S.hunger - 0.5);              // cột Ăn tăng rất chậm: +0,5% mỗi viên; không làm béo, không tăng Nước uống
  dog.faceCam = true;
  if (trainWin && performance.now() < trainWin.until){
    const k = trainWin.cmd;
    const B = BREEDS[p.dog.breed];
    const gain = Math.max(1, Math.round(B.learn * (1 + p.stats.bond/150) * (curSick() >= 2 ? 0.5 : 1) * (10 - p.skills[k]/12)));
    p.skills[k] = Math.min(100, p.skills[k] + gain);
    S.xp += 10; S.bond = Math.min(100, S.bond + 2);
    trainWin = null;
    setState("eat", 1200, {afterEat:"happy"});
    sfx("chime");
    bubble(`Giỏi quá! ${(COMMANDS[k] || {n: LEARN_EXTRA[k]}).n} +${gain}`, 2400, true);
  } else {
    S.xp += 1;
    setState("eat", 1200, {afterEat:"happy"});
    bubble("Ngon quá!", 1800);
    if (p.treats.left <= 5) setTimeout(()=>hint(`Bịch treat còn ${p.treats.left} viên`), 1400);
  }
  persist();
}

function playToy(type){

  if (restMode){ restMode=false; updateRestBtn(); }
  if (dog.onChair || dog.jump){ walkTo(perchLaunch(dog.onChair || dog.pendingPerch), false, ()=>playToy(type)); return; }
  if (type==="ball" && curSick() >= 2){ setState("sad", 3000); bubble("Mệt quá, hông chơi nổi 🤒", 2200, true); return; }
  play = {type, start: performance.now(), rounds: 0};
  excite();
  dog.path = []; dog.then = null;
  const f = fwd();
  if (type==="ball" && ownerHome()){   // Sếp 10/11: chủ ở nhà thì chủ ném bóng, chó nhặt về đưa chủ
    play.owner = true;
    toy = {type, p: new THREE.Vector3(), v: new THREE.Vector3(), held: false, inHand: true}; ownerHand(toy.p);
    ownerDo(besideDog(1.1), dog.pos, "none", 150, () => { if (!play || !toy) return; hm.hold = "play"; dog.faceCam = false; dog.lookAt = {x: hm.x, z: hm.z};
      gesture("bow", ()=>{ if (play && toy) setState("play", 300, {afterPlay: "throw"}); }); });

  } else {
    toy = {type, p: new THREE.Vector3(dog.pos.x + f.x*0.3, 0.03, dog.pos.z + f.z*0.3), v: new THREE.Vector3(), held:true, spin:0};

const fwd = () => ({x: Math.sin(dog.heading), z: Math.cos(dog.heading)});
function throwBall(){
  if (!play || !toy) return;
  if (play.owner && hm){   // chủ vung tay ném; bóng rời tay ở giữa động tác (ownerThrowTick)
    if (!toy.inHand){ toy.inHand = true; }
    let tg = null; for (let i = 0; i < 12 && !tg; i++){ const q = randomFreePoint(); if (Math.hypot(q.x - hm.x, q.z - hm.z) > 1.6) tg = q; }
    hm.throwAt = tSec; hm.throwTo = tg || randomFreePoint(); dog.lookAt = {x: hm.x, z: hm.z}; setState("play", 4000, {afterPlay: null});
    return;
  }
  const target = randomFreePoint();
  const T = 0.9;
  toy.held = false;
  toy.p.set(dog.pos.x, 0.35, dog.pos.z);
  toy.v.set((target.x - toy.p.x)/T, 4.9*T - 0.35/T, (target.z - toy.p.z)/T);
  dog.lookAt = target;
  setState("play", 500, {afterPlay: "chase"});
}
function playRoundReward(){
  const S = prof.stats, B = BREEDS[prof.dog.breed]; loved();
  play.rounds++;
  if (play.type === "ball"){
    S.happy = Math.min(happyCap(S.sick), S.happy + 3*B.energy);
    S.fit = Math.min(100, (S.fit||50) + 1);
    S.weight = Math.max(25, S.weight - 0.3);
    S.hunger = Math.min(100, S.hunger + 1);
    S.thirst = Math.min(100, (S.thirst||0) + 2);
    S.energy = Math.max(0, (S.energy ?? 80) - 1.5);
    S.bond = Math.min(100, S.bond + 0.5); S.xp += 1;
  } else {
    S.happy = Math.min(happyCap(S.sick), S.happy + 2);
    S.bond = Math.min(100, S.bond + 0.3); S.xp += 0.5;
  }
}
function callName(){   // chủ gọi tên: chó chạy ra giữa màn hình, đứng hai chân hoặc ngồi ngoan

function tapToy(){   // bấm vào đồ chơi đang nằm trên sàn

function stopPlay(silent=false){

  updatePlayUI();

function applyMeal(S, amt=MEAL_GAIN){   // ăn lúc nào cũng được: cột Ăn tăng đúng lượng đã cho; cho dư thì tăng cân
  const before = 100 - S.hunger, over = Math.max(0, before + amt - 100);
  S.hunger = Math.max(0, S.hunger - amt);
  S.happy = Math.min(happyCap(S.sick), S.happy + 3 + amt/20);
  S.weight = Math.min(100, S.weight + 0.5 + over*0.04);
  if (prof && S === prof.stats){ prof.bladder = (prof.bladder||0) + amt*0.2; prof.bowel = Math.min(120, (prof.bowel||0) + amt*0.3); }
  S.bond = Math.min(100, S.bond + 1); S.xp += 2;
}

}

// ---- tự đi lại khi rảnh ----
function idleBrain(now){ return idleBrainCore(now); }
function idleGesture(S){   // thỉnh thoảng mới làm, để không lặp lại
  const E = S.energy ?? 80, q = Math.random();
  if (performance.now() - (dog.lastGest||0) < 9000) return false;
  const go = (name, fn)=>{ dog.lastGest = performance.now(); fn ? fn() : (dog.faceCam = Math.random() < 0.6, gesture(name)); return true; };
  if (E < 45 && q < 0.25) return go("yawn");
  if (q < 0.07 && S.happy > 65 && E > 55) return go("chase", ()=>{ gesture("chase", ()=>{ bubble("Chóng mặt quá 😵", 1400); setState("happy", 1200); }); });
  if (q < 0.13 && S.happy > 60 && E > 50) return go("bow", ()=>{ dog.faceCam = true; gesture("bow"); bubble(pick(["Chơi hông?","Gâu!"]), 1300); });
  if (q < 0.22) return go("sniff", ()=>{ walkTo(randomFreePoint(), false, ()=>setState("sniff", rnd(1800, 2800))); });
  if (q < 0.27) return go("tilt", ()=>{ dog.faceCam = true; gesture("tilt"); });
  if (q < 0.33 && S.happy > 50) return go("restHead", ()=>{ dog.faceCam = true; gesture("restHead"); });
  if (q < 0.36 && E > 80 && S.happy > 60) return go("zoom", zoomies);
  return false;
}
function zoomies(){   // chạy vòng vòng quanh thảm khi vui quá
  const pts = []; const n = 7, c = {x: room.L.rug.x, z: room.L.rug.z}, dir = Math.random() < 0.5 ? 1 : -1;
  for (let i = 0; i <= n*2; i++){ const a = dir*i/n*Math.PI*2; pts.push(nearestFree({x: c.x + Math.cos(a)*0.95, z: c.z + Math.sin(a)*0.7})); }
  let i = 0; excite(9000); sfx("bark");
  const next = ()=>{ if (++i >= pts.length || play || restMode){ dog.faceCam = true; setState("happy", 1500); sfx("pant"); return; } walkTo(pts[i], true, next); };
  walkTo(pts[0], true, next);
}
function needLick(kind){   // tới bát, liếm bát trống vài cái, rồi quay ra xin chủ
  const food = kind === "food", spot = food ? room.bowlStand : room.waterStand, bowl = food ? room.bowl : room.water;
  if (dog.onChair){ walkTo(perchLaunch(dog.onChair)); return; }
  const lick = () => { dog.lookAt = bowl; if (!food) waterFull = false; setState("eat", 2400, {lick: kind, afterEat: "hungry"}); };
  if (Math.hypot(dog.pos.x - spot.x, dog.pos.z - spot.z) > 0.25) walkTo(spot, false, lick); else lick();
}
function idleBrainCore(now){
  if (restMode) return;
  const S = prof.stats;
  if (now < dog.next) return;
  dog.next = now + rnd(3500, 8000);
  if (sickLevel(S.sick) >= 2){
    dog.faceCam = true; setState("sad", 7000);
    if (Math.random()<0.5) bubble(pick(["Mệt quá... 🤒","Đói quá, ốm rồi 🤒","Cho ăn đi mà 🤒"]), 2600);
    return;
  }
  // nhu cầu tự động (Sếp nhắc 10/11): đói thì ra bát ăn liếm liếm, khát thì ra bát nước liếm, rồi ngước nhìn chủ xin
  if (S.hunger > 70 && !bowlFull){ needLick("food"); return; }
  if ((S.thirst||0) >= 100 - ALERT.orange - 15 && Math.random() < 0.7){ needLick("water"); return; }
  if (S.happy < 35){
    dog.faceCam = true; setState("sad", 6000);
    if (Math.random()<0.4) bubble(pick(["Buồn quá...", `Chơi với ${prof.dog.name} hông?`]), 2400);
    return;
  }
  if ((S.energy ?? 80) < ALERT.orange && !dog.onChair && Math.random() < 0.5){   // mệt: về nệm nằm
    bubble(pick(["Buồn ngủ quá...","Mệt rồi"]), 2200);
    walkTo(nearestFree(room.bed), false, () => { dog.lookAt = null; dog.faceCam = true; setState("lie", 7000); }); return; }
  if (dog.onChair){   // trên ghế: thích ngồi ngắm lâu, thỉnh thoảng nằm, rồi mới nhảy xuống
    const q = Math.random();
    perchLook(dog.onChair);
    if (q < 0.55) setState("sit", rnd(8000, 14000));
    else if (q < 0.75) setState("lie", rnd(6000, 10000));
    else walkTo(randomFreePoint());
    return;
  }
  if (Math.random() < chewChance()){ startGnaw(); return; }
  if (idleGesture(S)) return;
  const r = Math.random();
  if (r < 0.4) walkTo(randomFreePoint());
  else if (r < 0.62) goChair();          // chỗ yêu thích: ghế cạnh cửa sổ
  else if (r < 0.64){ dog.faceCam = Math.random() < 0.5; setState("sit", rnd(3000,6000)); }
  else if (r < 0.74) setState("lie", rnd(4000,7000));
  else if (r < 0.87) setState("look", 2000);
  else setState("idle", 2500);
}

// ---------- cử chỉ: động tác có thời gian, chuyển mượt (vào, giữ, ra) ----------
// Cách làm cho mềm: mỗi cử chỉ là đường cong theo thời gian k (0→1); dùng hàm êm (smoothstep) để vào và ra,
// thêm dao động nhỏ (thở, nhún) để không cứng như robot. Tư thế cuối vẫn qua bộ lọc lerp chung.
const GEST = {
  bow:     {dur: 1700, sfx: "bark"},     // cúi người mời chơi
  tilt:    {dur: 1500},                  // nghiêng đầu khi nghe gọi
  stretch: {dur: 2700, sfx: "yawn", sfxAt: 0.22}, // vươn vai sau khi dậy: duỗi trước + ngáp, rồi duỗi sau
  yawn:    {dur: 1500, sfx: "yawn"},
  circle:  {dur: 1500, spin: 1},         // xoay một vòng trước khi nằm / đi vệ sinh
  chase:   {dur: 3000, spin: 3},         // đuổi đuôi
  wiggle:  {dur: 1900, sfx: "whine"},    // vẫy cả mông mừng chủ
  shake:   {dur: 1100, sfx: "shakeOff"}, // lắc cả mình
  paw:     {dur: 1900},                  // giơ một chân trước
  restHead:{dur: 7000, sfx: "sigh"},     // nằm tựa cằm lên chân, mắt ngước nhìn
};
const sstep = (a, b, x) => { const k = clamp((x - a)/(b - a), 0, 1); return k*k*(3 - 2*k); };
const env3 = (k, i=0.18, o=0.82) => sstep(0, i, k)*(1 - sstep(o, 1, k));   // vào – giữ – ra
function gesture(name, then=null, opt={}){
  const g = GEST[name]; if (!g || !prof) { if (then) then(); return; }
  dog.path = []; dog.then = null;
  dog.gest = {name, t0: tSec, dur: g.dur/1000, then, h0: dog.heading, dir: opt.dir || (Math.random() < 0.5 ? 1 : -1), sfxDone: false};
  if (g.sfx && !g.sfxAt){ sfx(g.sfx); dog.gest.sfxDone = true; }
  if (name === "bow" || name === "wiggle" || name === "chase") excite(g.dur + 800);
  setState("gest", g.dur);
}
const GK = QS.get("gk") != null ? +QS.get("gk") : null;   // chạy thử: đứng hình cử chỉ ở thời điểm gk
function gestK(){ const g = dog.gest; if (GK != null && g) return GK; return g ? clamp((tSec - g.t0)/g.dur, 0, 1) : 1; }
// bước chân tại chỗ (xoay vòng, đuổi đuôi)
function stepInPlace(T, B, speed){
  const ph = tSec*speed, L = B.legL, st = Math.max(L*0.25, 3), lf = Math.max(L*0.3, 3.5);
  T.fF = Math.sin(ph)*st; T.fLift = Math.max(0, Math.cos(ph))*lf;
  T.fFFar = Math.sin(ph + Math.PI)*st; T.fLiftFar = Math.max(0, Math.cos(ph + Math.PI))*lf;
  T.bF = Math.sin(ph + Math.PI + 0.3)*st; T.bLift = Math.max(0, Math.cos(ph + Math.PI + 0.3))*lf;
  T.bFFar = Math.sin(ph + 0.3)*st; T.bLiftFar = Math.max(0, Math.cos(ph + 0.3))*lf;
}
function gestPose(B){
  const g = dog.gest, k = gestK(), L = B.legL, H = B.bodyH;
  if (GEST[g.name].sfxAt && !g.sfxDone && k >= GEST[g.name].sfxAt){ g.sfxDone = true; sfx(GEST[g.name].sfx); }
  let T;
  switch (g.name){
    case "bow": {
      T = poseFor("stand", B); const a = env3(k, 0.2, 0.8);
      T.tilt = 0.42*a; T.cy -= L*0.12*a - Math.max(0, Math.sin(tSec*9))*L*0.06*a;   // nhún nhún
      T.fF = L*0.95*a; T.fFFar = L*0.8*a; T.head = -0.4*a; T.ear = -0.2*a;
      T.tail = -0.6*a; T.wag = 0.9; T.wagSpd = 20; T.happy = 1; T.tongue = a > 0.5 ? 1 : 0; T.mouth = 0.25*a;
      break;
    }
    case "tilt": {
      T = poseFor("stand", B); const a = env3(k, 0.15, 0.75), b = env3(k, 0.5, 0.95);
      T.cock = g.dir*0.42*a - g.dir*0.3*b*(1 - a);   // nghiêng một bên, rồi thoáng nghiêng bên kia
      T.ear = -0.35*Math.max(a, b); T.head = -0.12; T.eye = 1; T.wag = 0.3;
      break;
    }
    case "stretch": {
      T = poseFor("stand", B);
      const a = env3(clamp(k/0.55, 0, 1), 0.3, 0.75);          // pha 1: chồm trước, mông chổng
      const b = env3(clamp((k - 0.5)/0.5, 0, 1), 0.3, 0.7);    // pha 2: rướn ngực, duỗi chân sau
      T.tilt = 0.5*a - 0.32*b; T.cy -= L*0.18*a + L*0.22*b;
      T.fF = L*1.1*a - L*0.2*b; T.fFFar = L*1.0*a - L*0.15*b;
      T.bF = -L*0.15*a - L*1.15*b; T.bFFar = -L*0.1*a - L*0.9*b; T.bLift = L*0.15*b;
      const y = env3(clamp((k - 0.15)/0.35, 0, 1), 0.25, 0.7);   // ngáp trong lúc chồm
      T.mouth = 1.25*y; T.eye = 1 - 0.85*y - 0.3*b; T.head = -0.45*a - 0.3*y - 0.4*b; T.ear = 0.35*a + 0.3*b;
      T.tail = 0.3; T.wag = 0.1;
      break;
    }
    case "yawn": {
      T = poseFor(dog.gestBase || "stand", B); const y = env3(k, 0.3, 0.7);
      T.mouth = 1.25*y; T.eye = 1 - 0.9*y; T.head = (T.head || 0) - 0.35*y; T.tongue = y > 0.7 ? 1 : 0; T.ear = 0.3*y;
      break;
    }
    case "circle": case "chase": {
      T = poseFor("stand", B); const fast = g.name === "chase";
      stepInPlace(T, B, fast ? 22 : 13);
      T.yaw = g.dir*(fast ? 0.95 : 0.35); T.cock = g.dir*(fast ? 0.2 : 0.05);
      T.head = fast ? 0.15 : 0.35; T.tail = fast ? -0.4 : 0.2;
      if (fast){ T.happy = 1; T.tongue = 1; T.wag = 0.9; T.wagSpd = 22; } else { T.wag = 0.15; }
      break;
    }
    case "wiggle": {
      T = poseFor("stand", B); const a = env3(k, 0.12, 0.85);
      T.wiggle = a; T.happy = 1; T.tongue = 1; T.ear = 0.45*a; T.head = -0.15; T.wag = 1; T.wagSpd = 24;
      T.cy -= L*0.08*a;   // hạ thấp người khi mừng
      break;
    }
    case "shake": {
      T = poseFor("stand", B); const a = env3(k, 0.1, 0.75);
      T.bodyShake = a; T.ear = 0.2; T.eye = 1 - 0.6*a; T.wag = 0;
      break;
    }
    case "paw": {
      T = poseFor("sit", B); const a = env3(k, 0.2, 0.8);
      const fs = T.fStretch || 1; T.fLift = L*0.62*fs*a; T.fF = 2 + L*0.4*fs*a; T.head -= 0.15*a; T.cock = g.dir*0.15*a; T.happy = 1; T.wag = 0.6;
      break;
    }
    case "restHead": {
      T = poseFor("lie", B); const a = env3(k, 0.15, 0.9);
      T.head = 0.05 + 0.6*a; T.eye = 1 - 0.15*a + Math.sin(tSec*0.7)*0.05; T.ear = 0.45*a; T.tail = 1.2; T.wag = 0.05;
      T.fF = L*1.1; T.fFFar = L*1.05;   // hai chân trước duỗi thẳng để tựa cằm
      break;
    }
    default: T = poseFor("stand", B);
  }
  return T;
}

function turnTo(target, dt, rate=7){
  let d = target - dog.heading;
  while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2;
  const step = clamp(d, -rate*dt, rate*dt);
  dog.heading += step;
  return Math.abs(d);
}

const MEDS_PER_DAY = 3;
function giveMedicine(){
  const S = prof.stats, td = todayStr(gameNow(prof));

}

function updateOccluders(){

  const cam = camera.position; _oT[0].set(outdoor.x, 1.1, outdoor.z); _oT[1].set(dog.pos.x, 0.25, dog.pos.z);
  for (const o of OCCL){

// dụng cụ dựng khu phố, dùng chung cho đường phố và công viên
function townKit(root){

  const add = m => { par.add(m); return m; };
  const group = (f, occl = true) => { const g = new THREE.Group(); par.add(g); const old = par; par = g; f(g); par = old; if (occl) OCCL.push({obj: g}); return g; };
  const ground = m => { m.userData.kind = "ground"; pickables.push(m); return m; };
  const tree = (x, z, s = 1) => group(() => {
    const t = M(CYL, "#8A6142"); t.scale.set(0.14*s, 1.5*s, 0.14*s); t.position.set(x, G + 0.75*s, z); add(t);
    for (const [dx, dy, dz, r] of [[0, 1.9, 0, 0.85], [0.38, 1.6, 0.22, 0.6], [-0.33, 1.65, -0.28, 0.6]]){ const l = M(SPHERE_LO, dy > 1.8 ? "#4F9450" : "#63A85A"); l.scale.setScalar(r*s); l.position.set(x + dx*s, G + dy*s, z + dz*s); add(l); } });
  let glowTex = null;
  const lamp = (x, z, rot = 0) => group(g => {
    g.position.set(x, 0, z); g.rotation.y = rot;
    const p = M(new THREE.CylinderGeometry(0.06, 0.09, 4.4, 8), "#4A4F55"); p.position.set(0, G + 2.2, 0); add(p);
    box(0.08, 0.08, 0.9, "#4A4F55", 0, G + 4.35, 0.42); box(0.36, 0.12, 0.5, "LAMP", 0, G + 4.28, 0.85);
    if (!glowTex) glowTex = canvasTex(64, 64, (c, w, h) => { const gr = c.createRadialGradient(32, 32, 2, 32, 32, 31); gr.addColorStop(0, "rgba(255,235,170,0.95)"); gr.addColorStop(1, "rgba(255,220,140,0)"); c.fillStyle = gr; c.fillRect(0, 0, w, h); });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending})); s.scale.setScalar(2.2); s.position.set(0, G + 4.1, 0.85); s.visible = !!townNight; add(s); LAMP_GLOWS.push(s);
    const pool = new THREE.Sprite(new THREE.SpriteMaterial({map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.35})); pool.scale.set(4, 4, 1); pool.position.set(0, G + 0.3, 0.85); pool.visible = !!townNight; add(pool); LAMP_GLOWS.push(pool); });
  // nhà phố: mặt tiền quay về +z cục bộ, thân nhà lùi về -z; rot xoay cả căn (0: nhìn +z, π: nhìn -z, π/2: nhìn +x)
  const shophouse = (x, z, rot, w, floors, col, opt = {}) => group(g => {
    g.position.set(x, 0, z); g.rotation.y = rot;

    box(w*0.8, 2.2, 0.06, opt.ground || "#8B9096", 0, G + 1.15, 0.02);
    for (let f = 1; f < floors; f++){
      const y = G + f*fh;
      box(w, 0.12, 0.9, "#FFFFFF", 0, y + 0.05, 0.45); box(w, 0.5, 0.05, "#5E6B73", 0, y + 0.35, 0.88);
      box(w*0.55, 1.5, 0.06, "WIN", 0, y + 1.2, 0.02); box(w*0.6, 0.12, 0.25, shade(col, -0.25), 0, y + 2.05, 0.12);
      if ((floors + f) % 3 === 0){ const pot = M(SPHERE_LO, "#5E9E57"); pot.scale.set(0.25, 0.22, 0.25); pot.position.set(-w*0.35, y + 0.4, 0.6); add(pot); }
    }
    if (opt.roof){ const r = M(new THREE.CylinderGeometry(0.01, w*0.62, 1.2, 4), "#C8553D"); r.rotation.y = Math.PI/4; r.scale.z = d/w*0.9; r.position.set(0, G + H + 0.6, -d/2); add(r); }
    else box(w, 0.35, 0.12, shade(col, -0.15), 0, G + H + 0.17, 0.02);
    if (opt.sign){ const sg = new THREE.Mesh(new THREE.PlaneGeometry(w*0.9, 0.8), new THREE.MeshBasicMaterial({map: signTex(opt.sign, opt.signBg || "#1E6F78", opt.signFg || "#FFFFFF", 768, 116)})); sg.position.set(0, G + 2.46, 0.07); /* thấp hơn ban công tầng 2 để dấu tiếng Việt không bị che */ if (opt.kind){ sg.userData.kind = opt.kind; pickables.push(sg); } add(sg); }

// ---------- bản đồ đi lại ngoài trời (lưới 0,5 m + A*): chỉ vỉa hè, vạch qua đường, sân, công viên ----------
const OG = {x0: WORLD.x0, z0: WORLD.z0, cell: 0.5, nx: Math.round((WORLD.x1 - WORLD.x0)/0.5), nz: Math.round((WORLD.z1 - WORLD.z0)/0.5)};
let oBlocked = null;
function buildOutdoorGrid(){
  const {x0, z0, cell, nx, nz} = OG, g = new Uint8Array(nx*nz).fill(1);
  const rect = (ax, bx, az, bz, v) => { if (!v){ ax -= 0.02; bx += 0.02; az -= 0.02; bz += 0.02; } const i0 = Math.max(0, Math.floor((ax - x0)/cell - 0.5) + 1), i1 = Math.min(nx - 1, Math.ceil((bx - x0)/cell - 0.5) - 1), j0 = Math.max(0, Math.floor((az - z0)/cell - 0.5) + 1), j1 = Math.min(nz - 1, Math.ceil((bz - z0)/cell - 0.5) - 1);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) g[i*nz + j] = v; };
  const disc = (cx, cz, r) => { for (let i = Math.max(0, Math.floor((cx - r - x0)/cell)); i <= Math.min(nx - 1, Math.ceil((cx + r - x0)/cell)); i++) for (let j = Math.max(0, Math.floor((cz - r - z0)/cell)); j <= Math.min(nz - 1, Math.ceil((cz + r - z0)/cell)); j++){
    const x = x0 + (i + 0.5)*cell, z = z0 + (j + 0.5)*cell; if (Math.hypot(x - cx, z - cz) < r) g[i*nz + j] = 1; } };
  // chỗ được đi
  rect(-5.2, 5.2, -4.15, 5.0, 0); rect(-0.65, 0.65, 4.9, 5.5, 0);                                 // sân nhà, cổng
  rect(WORLD.x0, WORLD.x1, ST1.sw0, ST1.road0, 0); rect(WORLD.x0, WORLD.x1, ST1.road1, ST1.sw1, 0);   // vỉa hè đường 1
  rect(ST2.sw0, ST2.road0, WORLD.z0, ST1.sw0, 0); rect(ST2.road1, ST2.sw1, WORLD.z0, ST1.sw0, 0);    // vỉa hè đường 2
  for (const c of CROSSWALKS) rect(c.x0, c.x1, c.z0, c.z1, 0);
  rect(PARK.x0 + 0.25, PARK.x1 - 0.25, PARK.z0 + 0.25, PARK.z1 - 0.25, 0);
  for (const q of GATES) rect(q.x0, q.x1, q.z0, q.z1, 0);
  // vật cản
  rect(-3.4, 3.4, -2.9, 2.9, 1); disc(1.6, 4.7, 0.3);
  for (const p of QUEST_POLES) disc(p.x, p.z, 0.28);
  for (const x of [-20, -12, -4, 32, 44, 56, 68, 80, 92, 104]) disc(x, QUEST_POLES[0].z, 0.28);
  for (const x of [-12, -4.5, 3.5, 11, 66, 82, 98]) disc(x, 14.05, 0.4);
  disc(POND.x, POND.z, POND.r + 0.4); rect(POND.x - 3.2, POND.x + 3.2, POND.z - POND.r - 2.1, POND.z - POND.r - 0.5, 1);
  rect(POOL.x0 - 0.2, POOL.x1 + 0.2, POOL.z0 - 0.2, POOL.z1 + 0.2, 1); for (const z of [POOL.z0 + 1.5, POOL.z1 - 1.5]) disc(POOL.x1 + 0.9, z, 0.3);
  for (const q of KIOSKS){ rect(q.x - KW/2 - 0.2, q.x + KW/2 + 0.2, q.z - KD/2 - 0.2, q.z + KD/2 + 0.4, 1); for (const s of [-1, 1]) disc(q.x + s*1.6, q.z + KD/2 + 3.2, 0.6); }

  const T = TRAIN; rect(T.x0 - 0.35, T.gx0, T.z1 - 0.35, T.z1 + 0.35, 1); rect(T.gx1, T.x1 + 0.35, T.z1 - 0.35, T.z1 + 0.35, 1);
  rect(T.x0 - 0.35, T.x1 + 0.35, T.z0 - 0.35, T.z0 + 0.35, 1); rect(T.x0 - 0.35, T.x0 + 0.35, T.z0, T.z1, 1); rect(T.x1 - 0.35, T.x1 + 0.35, T.z0, T.z1, 1);
  rect(39, 41, -54.4, -50.6, 1); rect(43.6, 52.4, -59.4, -58.6, 1); rect(53.9, 55.1, -55.4, -48.6, 1); rect(47.3, 48.7, -52.4, -49.6, 1);
  rect(T.booth.x - 1.2, T.booth.x + 1.2, T.booth.z - 0.9, T.booth.z + 0.9, 1);

  for (const [x, z, s] of PARK_TREES) disc(x, z, 0.35*s + 0.15);

  for (const [x, z] of [[46, -2.5], [62, -2.5], [80, -33], [96, -33], [80, -64.5], [56, -64.5], [103, -18], [103, -48], [39, -16], [39, -48]]) disc(x, z, 0.2);
