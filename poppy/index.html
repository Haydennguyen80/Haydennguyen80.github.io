const oCell = p => [clamp(Math.floor((p.x - OG.x0)/OG.cell), 0, OG.nx - 1), clamp(Math.floor((p.z - OG.z0)/OG.cell), 0, OG.nz - 1)];
const oPt = (i, j) => ({x: OG.x0 + (i + 0.5)*OG.cell, z: OG.z0 + (j + 0.5)*OG.cell});
function oFree(p){ if (!oBlocked) buildOutdoorGrid(); if (p.x < WORLD.x0 || p.x > WORLD.x1 || p.z < WORLD.z0 || p.z > WORLD.z1) return false; const [i, j] = oCell(p); return !oBlocked[i*OG.nz + j]; }
function oLine(a, b){ const d = Math.hypot(b.x - a.x, b.z - a.z), n = Math.max(1, Math.ceil(d/0.2)); for (let k = 1; k <= n; k++){ const f = k/n; if (!oFree({x: a.x + (b.x - a.x)*f, z: a.z + (b.z - a.z)*f})) return false; } return true; }
function oNearest(p){
  if (oFree(p)) return {x: p.x, z: p.z};
  const [ci, cj] = oCell(p);
  for (let r = 1; r < 60; r++) for (let di = -r; di <= r; di++) for (const dj of [-r, r]) for (const [i, j] of [[ci + di, cj + dj], [ci + dj, cj + di]]){
    if (i >= 0 && j >= 0 && i < OG.nx && j < OG.nz && !oBlocked[i*OG.nz + j]) return oPt(i, j); }
  return {x: p.x, z: p.z};
}
function oPath(from, to){
  if (!oBlocked) buildOutdoorGrid();
  const s = oCell(oNearest(from)), t = oCell(oNearest(to)), N = OG.nx*OG.nz, nz = OG.nz;
  const g = new Float32Array(N).fill(1e9), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const si = s[0]*nz + s[1], ti = t[0]*nz + t[1]; g[si] = 0;
  const h = k => { const dx = Math.abs(Math.floor(k/nz) - t[0]), dz = Math.abs(k % nz - t[1]); return Math.max(dx, dz) + 0.414*Math.min(dx, dz); };
  const hk = [], hf = [];   // hàng đợi ưu tiên (đống nhị phân) để tìm đường nhanh trên bản đồ lớn
  const push = (k, f) => { hk.push(k); hf.push(f); let i = hk.length - 1; while (i > 0){ const p = (i - 1) >> 1; if (hf[p] <= hf[i]) break; [hk[p], hk[i]] = [hk[i], hk[p]]; [hf[p], hf[i]] = [hf[i], hf[p]]; i = p; } };
  const pop = () => { const top = hk[0], lk = hk.pop(), lf = hf.pop(); if (hk.length){ hk[0] = lk; hf[0] = lf; let i = 0; for (;;){ const l = 2*i + 1, r = l + 1; let m = i; if (l < hk.length && hf[l] < hf[m]) m = l; if (r < hk.length && hf[r] < hf[m]) m = r; if (m === i) break; [hk[m], hk[i]] = [hk[i], hk[m]]; [hf[m], hf[i]] = [hf[i], hf[m]]; i = m; } } return top; };
  push(si, h(si));
  while (hk.length){
    const cur = pop(); if (closed[cur]) continue; if (cur === ti) break; closed[cur] = 1;
    const ci = Math.floor(cur/nz), cj = cur % nz;
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++){
      if (!di && !dj) continue; const i = ci + di, j = cj + dj; if (i < 0 || j < 0 || i >= OG.nx || j >= nz) continue;
      const k = i*nz + j; if (oBlocked[k] || closed[k]) continue;
      if (di && dj && (oBlocked[ci*nz + j] || oBlocked[i*nz + cj])) continue;
      const ng = g[cur] + (di && dj ? 1.414 : 1); if (ng < g[k]){ g[k] = ng; came[k] = cur; push(k, ng + h(k)); }
    }
  }
  if (came[ti] < 0 && ti !== si) return [];
  const out = []; for (let k = ti; k !== si && k >= 0; k = came[k]) out.push(oPt(Math.floor(k/nz), k % nz));
  out.reverse(); const end = oNearest(to); if (out.length) out[out.length - 1] = end; else out.push(end);
  // kéo thẳng đường đi (bỏ các điểm thừa khi nhìn thẳng thấy nhau) cho đi mượt, vẫn không ra khỏi vỉa hè
  const sm = []; let a = oNearest(from), k = 0;
  while (k < out.length){ let j = k; while (j + 1 < out.length && oLine(a, out[j + 1])) j++; sm.push(out[j]); a = out[j]; k = j + 1; }
  return sm;
}

function tickFreeDog(dt, o){
  const busy = ["potty","sniff","gest","belly","eat"].includes(dog.state) || dog.jump;
  if (busy) return;
  const w = o.wander, far = Math.hypot(dog.pos.x - o.x, dog.pos.z - o.z) > 14;
  if (!w || (!isMoving() && tSec > w.until) || far && !w.home){
    let p = null;
    for (let k = 0; k < 14 && !p; k++){
      const a = Math.random()*Math.PI*2, r = far ? 2 + Math.random()*2 : 2.5 + Math.random()*8;
      const q = {x: (far ? o.x : (o.x + dog.pos.x)/2) + Math.cos(a)*r, z: (far ? o.z : (o.z + dog.pos.z)/2) + Math.sin(a)*r};
      if (inParkArea(q) && oFree(q) && (far || oLine(dog.pos, q))) p = q;
    }
    if (!p){ o.wander = {x: dog.pos.x, z: dog.pos.z, until: tSec + 1}; return; }
    const run = far || Math.random() < 0.55;
    o.wander = {x: p.x, z: p.z, until: tSec + 1.5 + Math.random()*3, home: far};
    dog.path = far ? oPath(dog.pos, p) : [p]; dog.then = null; dog.speed = run ? 2.6 : 1.4; dog.faceCam = false; dog.state = run ? "run" : "walk"; dog.until = 0;
    if (!far && Math.random() < 0.3) o.wander.sniff = true;
    return;

function buyItem(k){
  const it = (STORES[curStore] || STORES.pet).items.find(x => x.k === k); if (!it || it.soon) return;
  if (it.dog && dogAway()){ toast(`${prof.dog.name} đang không ở đây`); return; }
  if (coins() < it.p){ toast(`Chưa đủ xu. Cần 🪙 ${it.p}, bạn có ${coins()}. Đi dạo thêm để có xu nha`); return; }
  addCoins(-it.p);
  const S = prof.stats;
  if (k === "treats"){ prof.treats.left = TREAT_BAG; toast("Đã mua bịch thưởng mới: 100 viên 🍪"); }
  else if (k === "meds"){ prof.medsExtra = (prof.medsExtra || 0) + 3; toast("Đã mua hộp thuốc: thêm 3 lần uống 💊"); }
  else if (it.dog){ it.dog(S); loved(); dog.faceCam = true; setState("eat", 1200); setTimeout(()=>gesture("wiggle"), 1300); toast(`${it.ic} ${prof.dog.name} thích lắm!`); }
  else if (it.me){ S.bond = Math.min(100, S.bond + 1); toast(`${it.ic} Ngon quá! ${prof.dog.name} ngồi nhìn bạn ăn, thèm ghê 😋`); }

}
function leaveStore(){
  $("ovShop").classList.remove("show");
  if (outdoor && ownerOut) ownerOut.root.visible = true;   // sửa lỗi 09/11: người chủ không bao giờ bị ẩn khi ra khỏi tiệm
  // chó đứng chờ ngoài cửa siêu thị: chưa ngoan lệnh "Lại đây" thì có thể chạy theo mèo, đi lạc

function buyTraining(cmd){

  if ((prof.stats.energy ?? 80) < ALERT.red){ toast("Chó mệt rồi, cho chó nghỉ đã nha"); return; }
  addCoins(-TRAIN_PRICE); $("ovShop").classList.remove("show"); persist();
  const o = outdoor; o.free = false; o.noFree = true; o.wander = null; if (o.swim) stopSwim(false);
  hint(`🎟️ Đã mua vé. Huấn luyện viên đang ra đón ${prof.dog.name}...`, 3000);
  o.path = oPath(o, TRAIN.stand); o.then = ()=>{ const T = townPick.trainer; o.train = {cmd, phase: "fetch", i: 0, lap: 0, t0: tSec};
    T.wp = [TRAIN_IN[0], {x: o.x + 0.9, z: o.z - 0.6}]; o.h = Math.atan2(TRAIN_IN[0].x - o.x, TRAIN_IN[0].z - o.z); updateOutBtns(); };
  if (!o.path.length){ const t = o.then; o.then = null; t(); }
}
function trMove(T, dt, sp = 1.3){   // huấn luyện viên đi theo các điểm trong T.wp; hết điểm thì trả về true
  const w = T.wp[0]; if (!w){ T.moving = false; return true; }
  const dx = w.x - T.x, dz = w.z - T.z, d = Math.hypot(dx, dz), st = sp*dt;
  if (d <= st + 0.02){ T.x = w.x; T.z = w.z; T.wp.shift(); } else { T.x += dx/d*st; T.z += dz/d*st; }
  if (d > 0.02) T.h = Math.atan2(dx, dz); T.moving = true; return !T.wp.length;
}
// Dáng đi (10/11, Sếp chê bước đi chưa đẹp): nhịp bước tính theo quãng đường thật nên chân không trượt,
// hông đưa chân, gối gập khi nhấc chân, tay đánh ngược chân, người nhún 2 lần mỗi chu kỳ và hơi đổ về trước,
// bắt đầu và dừng bước chuyển dần (P.w) chứ không giật.
const STEP_LEN = 0.34;   // mét mỗi bước (theo tỉ lệ 1)
function personAnim(P, x, z, h, moving, dt, y0 = -0.16){
  const lx = P._lx, lz = P._lz; P._lx = x; P._lz = z;
  let d = lx === undefined ? 0 : Math.hypot(x - lx, z - lz); if (d > 0.6) d = 0;
  P.w = lerp(P.w || 0, moving ? 1 : 0, Math.min(1, dt*(moving ? 8 : 6)));
  P.phase = (P.phase || 0) + d/(STEP_LEN*(P.root.scale.x || 1))*Math.PI;
  if (!moving && P.w < 0.04) P.phase = 0;
  P.root.position.set(x, y0, z); P.root.rotation.y = h;
  ownerPose(P);
}
function ownerPose(P){
  const w = P.w || 0, ph = P.phase || 0;
  for (const L of P.legs){ const p = ph + (L.s > 0 ? 0 : Math.PI), a = -Math.sin(p)*0.42*w;
    if (L.hip){ L.hip.rotation.x = a; L.knee.rotation.x = (Math.max(0, Math.cos(p))*0.95 + 0.05)*w; }
    else L.leg.rotation.x = a; }
  for (const A of P.arms){ const p = ph + (A.s > 0 ? 0 : Math.PI);
    let rx = Math.sin(p)*0.36*w, rz = A.s*0.15;
    if (P.wave && A.s > 0){ const k = P.wave; rz = lerp(rz, 2.45 + Math.sin(tSec*11)*0.35, k); rx = lerp(rx, -0.25, k); }
    A.arm.rotation.x = rx; A.arm.rotation.z = rz; }
  const sit = P.sit || 0;
  if (sit > 0.001){   // ngồi: đùi đưa ra trước, gối gập, tay đặt lên đùi
    for (const L of P.legs) if (L.hip){ L.hip.rotation.x = lerp(L.hip.rotation.x, -1.42, sit); L.knee.rotation.x = lerp(L.knee.rotation.x, 1.38, sit); }
    for (const A of P.arms) A.arm.rotation.x = lerp(A.arm.rotation.x, -0.55, sit);
  }
  if (P.reach){ const k = P.reach; for (const A of P.arms){ A.arm.rotation.x = lerp(A.arm.rotation.x, -1.15, k); A.arm.rotation.z = lerp(A.arm.rotation.z, A.s*0.04, k); } }
  if (P.throwK != null){ const A = P.arms.find(a => a.s > 0), k = P.throwK;   // ném bóng: vung tay ra sau qua đầu rồi quăng tới trước
    A.arm.rotation.x = k < 0.45 ? lerp(-0.3, -3.0, sstep(0, 0.45, k)) : lerp(-3.0, -0.9, sstep(0.45, 0.75, k)); A.arm.rotation.z = 0.12; }
  if (P.rig){ P.rig.position.y = Math.abs(Math.cos(ph))*0.02*w + (1 - w)*Math.sin(tSec*2.1)*0.003;
    P.rig.rotation.x = 0.07*w + (P.bow || 0); P.rig.rotation.z = Math.sin(ph)*0.025*w; }
}
function tickPeople(dt){   // huấn luyện viên đi lại, người bán trong quầy vẫy tay nhẹ
  const T = townPick.trainer; if (!T) return;
  if (!(outdoor && outdoor.train)){ if (T.wp.length) trMove(T, dt); else T.moving = false; }
  personAnim(T, T.x, T.z, T.h, T.moving, dt);
  for (const [k, v] of (townPick.vendors || []).entries()) for (const A of v.arms) A.arm.rotation.x = A.s > 0 ? -0.25 - Math.max(0, Math.sin(tSec*1.3 + k*1.7))*0.5 : 0;
}
function trainerLeash(on){
  const T = townPick.trainer; T.leash.visible = on; if (!on) return;
  const hand = new THREE.Vector3(T.x + Math.cos(T.h)*0.27 + Math.sin(T.h)*0.05, 0.27, T.z - Math.sin(T.h)*0.27 + Math.cos(T.h)*0.05);
  const neck = dog3.topMark.getWorldPosition(new THREE.Vector3()); neck.y -= 0.12;
  const mid = hand.clone().lerp(neck, 0.5); mid.y -= 0.12;
  T.leash.geometry.setFromPoints([hand, mid, neck]); T.leash.geometry.attributes.position.needsUpdate = true;
}
function dogFollowTrainer(T){
  const fx = Math.sin(T.h), fz = Math.cos(T.h), want = {x: T.x - fx*0.6 + fz*0.35, z: T.z - fz*0.6 - fx*0.35};
  const d = Math.hypot(want.x - dog.pos.x, want.z - dog.pos.z);
  if (d > 0.2){ dog.path = [want]; dog.then = null; dog.speed = d > 1.2 ? 2.2 : 1.4; const st = d > 1.2 ? "run" : "walk"; if (dog.state !== st){ dog.state = st; dog.until = 0; } }
  else if (dog.state === "walk" || dog.state === "run"){ dog.path = []; setState("idle", 500); }
}
function tickTrain(dt){
  const o = outdoor, tr = o.train, T = townPick.trainer; if (!tr) return false;
  if (tr.phase === "fetch"){   // huấn luyện viên ra tận chỗ chủ đứng; chó vẫn ở cạnh chủ
    trainerLeash(false);
    if (trMove(T, dt)){ tr.phase = "lead"; tr.led = true; T.wp = TRAIN_IN.slice(); sfx("chime");
      hint(`Huấn luyện viên dắt ${prof.dog.name} vào khu huấn luyện. Bạn đứng ngoài chờ nha 👀`, 4000); }
    else return false;
  }
  if (tr.phase === "lead" || tr.phase === "back"){
    const done = trMove(T, dt, 1.2); dogFollowTrainer(T); trainerLeash(true);
    if (done && tr.phase === "lead"){ tr.phase = "course"; tr.i = 0; T.wp = [{x: 47.5, z: -53}]; trainerLeash(false); bubble("Học nào! 🎓", 1400, true); hint(`Vòng 1/${TRAIN_LAPS}`, 1800); }
    else if (done){ T.wp = [TRAIN_IN[0], TRAINER_HOME]; trainerLeash(false); finishTraining(); }
    return true;
  }
  if (tr.phase === "pick"){   // tập xong: chó ngồi chờ, huấn luyện viên tới móc dây
    if (trMove(T, dt)){ tr.phase = "back"; T.wp = [TRAIN_IN[1], TRAIN_IN[0], {x: o.x + 0.9, z: o.z - 0.6}]; }
    else if (dog.state !== "sit"){ dog.path = []; setState("sit", 5000); }
    return true;
  }
  // tập bài: huấn luyện viên đứng giữa sân, quay theo chó
  if (T.wp.length) trMove(T, dt); else { T.moving = false; T.h = Math.atan2(dog.pos.x - T.x, dog.pos.z - T.z); }
  if (dog.jump) return true;
  const wp = TRAIN_COURSE[tr.i];
  if (!wp){
    tr.lap++;
    if (tr.lap < TRAIN_LAPS){ tr.i = 0; hint(`Vòng ${tr.lap + 1}/${TRAIN_LAPS}`, 1800); return true; }
    tr.phase = "pick"; T.wp = [{x: dog.pos.x + 0.6, z: dog.pos.z + 0.5}]; dog.path = []; setState("sit", 5000); return true;
  }
  if (wp.jump){ tr.i++; jumpTo({x: wp.x, z: wp.z}, -0.16, null); return true; }
  const d = Math.hypot(wp.x - dog.pos.x, wp.z - dog.pos.z);
  if (d < 0.18){ tr.i++; return true; }
  dog.path = [wp]; dog.then = null; dog.speed = 2.5; if (dog.state !== "run"){ dog.state = "run"; dog.until = 0; }
  return true;
}
function trainBusy(){ if (outdoor && outdoor.train){ hint(`Huấn luyện viên đang dạy ${prof.dog.name}. Đứng chờ một chút nha 🎓`, 2500); return true; } return false; }
function finishTraining(){
  const o = outdoor, tr = o.train, P = prof, S = P.stats; o.train = null; o.lastTrain = {laps: tr.lap, sec: tSec - tr.t0, led: !!tr.led};
  P.skills[tr.cmd] = Math.min(100, (P.skills[tr.cmd] || 0) + TRAIN_GAIN); P.practiced[tr.cmd] = gameNow(P);
  S.fit = Math.min(100, (S.fit ?? 50) + 10); S.happy = Math.min(happyCap(S.sick), S.happy + 6); S.energy = Math.max(0, (S.energy ?? 80) - 8); S.xp += 4; loved();
  dog.path = []; dog.faceCam = true; gesture("wiggle"); sfx("chime");
  hint(`🎓 Huấn luyện viên trả ${P.dog.name} cho bạn. ${(COMMANDS[tr.cmd] || {n: LEARN_EXTRA[tr.cmd]}).n}: +${TRAIN_GAIN}. Thể dục +10`, 4500);
  persist(); showStats(4000); updateOutBtns();
}

/* ---------- BƯỚC B: ĐI LÀM (Sếp duyệt 09/11, làm 10/11) ----------
   Tới giờ ca thì bấm Đi làm: chủ rời nhà, chó ở nhà một mình (chỉ số giảm như lúc vắng chủ), hết ca nhận xu.

   Vào ca muộn thì lương tính theo số giờ còn lại của ca; về sớm thì nhận theo số giờ đã làm. */
const jobOf = k => JOBS.find(j => j.k === k) || JOBS[0];
const gameHourOf = t => { const d = new Date(t); return d.getHours() + d.getMinutes()/60; };
const fmtClock = t => { const d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
function shiftEnd(j, t){ const d = new Date(t); d.setHours(j.to, 0, 0, 0); return d.getTime(); }
function jobPay(j, t){ return Math.max(1, Math.round(j.pay*clamp((shiftEnd(j, t) - t)/((j.to - j.from)*3600000), 0, 1))); }
const atWork = () => !!(prof && prof.work);
function jobBlock(j, auto = false){   // lý do chưa được đi làm ca này, hoặc null (auto: chủ tự đi theo giờ, chó ngủ thì chủ đi nhẹ nhàng)
  const P = prof, t = gameNow(P), h = gameHourOf(t), fh = x => String(x).padStart(2, "0") + "h", c = sleepCfg(P);
  if (P.work) return "Bạn đang đi làm rồi";
  if (inSleepHours(t, P)) return `Đang là giờ ngủ (${fmtHr(c.at)} – ${fmtHr(c.wake)}). Ngủ dậy rồi đi làm nha`;
  if (h < j.from) return `Chưa tới giờ. Ca bắt đầu lúc ${fh(j.from)}`;
  if (h >= j.to - 0.25) return `Ca hôm nay đã hết. Ngày mai ${fh(j.from)} đi làm nha`;
  if (P.workDay && P.workDay.d === todayStr(t) && P.workDay.k === j.k) return "Hôm nay bạn đã làm ca này rồi";
  if (P.lost) return `${P.dog.name} đang đi lạc. Tìm chó về trước đã`;
  if (!auto && !dogAway() && dogAsleep()) return `${P.dog.name} đang ngủ 😴. Đợi chó dậy rồi mới đi làm`;
  if (outdoor && (trainBusy() || outdoor.free)) return outdoor.free ? `${P.dog.name} đang chạy chơi. Gọi chó về trước đã` : "Chó đang học ở khu huấn luyện, đợi học xong";

function goWork(k, auto = false){

function endWork(early){

/* ---------- CHỦ Ở NHÀ VỚI CHÓ; TỚI GIỜ LÀM THÌ CHÀO CHÓ, RA CỬA, XE TỚI ĐÓN (Sếp yêu cầu 10/11) ----------

var ownerIn = null, ownerInKey = "", hm = null, leave = null, ride = null, shuttle = null, ownerAtDoor = false;   // var: updateCamera/refreshWork có thể chạy trước dòng này lúc khởi động

const raycaster = new THREE.Raycaster(), _ndc = new THREE.Vector2();
function pickAt(x, y){
  _ndc.set(x/W*2 - 1, -(y/H)*2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  const shown = o => { while (o){ if (!o.visible) return false; o = o.parent; } return true; };
  return hits.find(h => shown(h.object)) || null;
}
let rubbing = null;
// chạm nhẹ = bấm như cũ; kéo một ngón (quá 8px) = xoay phòng; hai ngón hoặc lăn chuột = phóng to, thu nhỏ
const ptrs = new Map(); let gest = null, orbitHinted = false;
function canvasXY(e){ const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
canvas.addEventListener("pointerdown", e=>{
  if (!prof) return;
  const [x, y] = canvasXY(e);
  ptrs.set(e.pointerId, {x, y});
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; gest = {mode: "pinch", d0: Math.hypot(a.x-b.x, a.y-b.y) || 1, z0: camZoom}; rubbing = null; return; }
  if (ptrs.size > 2) return;
  const hit = pickAt(x, y);
  if (hit && hit.object.userData.kind === "dog"){ gest = {mode: "dog"}; tapAt(x, y, hit); return; }
  gest = {mode: "pending", x0: x, y0: y, x, y, pan: e.button === 2};   // máy tính: kéo chuột phải cũng trượt
});
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointermove", e=>{
  const [x, y] = canvasXY(e);
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x, y});
  if (gest && gest.mode === "pinch"){ if (ptrs.size >= 2){ const [a, b] = [...ptrs.values()]; camZoom = clamp(gest.z0*gest.d0/(Math.hypot(a.x-b.x, a.y-b.y) || 1), ZOOM_MIN, ZOOM_MAX); } return; }
  if (gest && (gest.mode === "pending" || gest.mode === "orbit" || gest.mode === "pan")){
    if (gest.mode === "pending" && Math.hypot(x - gest.x0, y - gest.y0) > 8){ gest.mode = !outdoor && (gest.pan || zoomedIn()) ? "pan" : "orbit"; closeRing(); closeFoodMenu(); closeBedMenu(); }
    if (gest.mode === "orbit"){ camYaw -= (x - gest.x)*0.009; camPitch = clamp(camPitch + (y - gest.y)*0.006, outdoor ? PITCH_OUT[0] : PITCH_MIN, outdoor ? PITCH_OUT[1] : PITCH_MAX); }
    if (gest.mode === "pan") panBy(x - gest.x, y - gest.y);
    gest.x = x; gest.y = y; return;
  }
  if (!rubbing || !prof) return;
  rubbing.d += Math.hypot(x - rubbing.x, y - rubbing.y); rubbing.x = x; rubbing.y = y;
  if (rubbing.d > 28){ rubbing.d = 0; const h = pickAt(x, y); if (h && h.object.userData.kind === "dog" && dog.state === "belly") rubBelly(); }
});
function endPtr(e, cancel){
  const had = ptrs.delete(e.pointerId);
  if (gest && gest.mode === "pending" && had && !cancel){ const g = gest; gest = null; tapAt(g.x0, g.y0); }
  if (ptrs.size === 0){ gest = null; rubbing = null; }
  else if (gest && gest.mode === "pinch") gest = {mode: "wait"};
}
canvas.addEventListener("pointerup", e=>endPtr(e, false));
canvas.addEventListener("pointercancel", e=>endPtr(e, true));
canvas.addEventListener("pointerleave", e=>{ if (!ptrs.size) rubbing = null; });
canvas.addEventListener("wheel", e=>{ e.preventDefault(); camZoom = clamp(camZoom*Math.exp(e.deltaY*0.0012), ZOOM_MIN, ZOOM_MAX); }, {passive: false});
function tapAt(x, y, hit = pickAt(x, y)){
  if (leaving()) return;
  if (inBR){ tapBedroom(hit); return; }
  const kind = hit ? hit.object.userData.kind : null;
  if (outdoor){ tapOutdoor(x, y, hit); return; }
  if (atWork()){ closeRing(); workHint(); return; }
  if (dogAway() && kind !== "door"){ closeRing(); awayHint(); return; }
  if (kind==="dog"){ closeRing(); petDog(); rubbing = {x, y, d: 0}; return; }
  if (kind==="bowl"){ closeRing(); openFoodMenu(); return; }
  if (kind==="mess"){ closeRing(); cleanMess(hit.object.userData.mi); return; }
  if (kind==="water"){ closeRing(); closeFoodMenu(); drinkWater(); return; }
  if (kind==="toyBall" || kind==="toyBone"){ closeRing(); const ty = kind==="toyBall" ? "ball" : "bone"; if (!(play && play.type===ty)) playToy(ty); return; }
  if (kind==="toy"){ closeRing(); tapToy(); return; }
  if (kind==="chair"){ closeRing(); goChair(true); return; }
  closeFoodMenu(); closeBedMenu();
  if (kind==="bed"){ openBedMenu(); return; }
  if (kind==="tv"){ tapTV(); return; }
  if (kind==="lamp"){ tapLamp(); return; }
  if (kind==="photo"){ closeRing(); hint(`📷 Ảnh ${prof.owner} và ${prof.dog.name}`, 2000); return; }
  if (ringOpen){ closeRing(); return; }
  if (kind==="pad"){ closeRing(); openPadMenu(); return; }
  if (kind==="floor"){ openRing(x, y, {x: hit.point.x, z: hit.point.z}); return; }
  if (kind==="sofa"){ goPerch("sofa", true); return; }
  if (kind==="door"){ closeRing(); goOutside(); return; }
  hint("Bấm lên sàn để ra lệnh", 2000);
}

   NGƯỜI CHỦ (kiểu tóc, màu áo) — dùng ở màn tạo nhân vật, sau này dùng khi đi dạo

function buildOwner3D(o){
  o = Object.assign({}, OWNER_DEFAULT, o||{});
  const root = new THREE.Group();
  const skin = "#F1C9A5", hairC = "#3B2A20", pants = /^#[0-9A-Fa-f]{6}$/.test(o.pants || "") ? o.pants : "#3E5679", shoe = "#5A4636";
  const legs = [], arms = [];
  for (const s of [-1, 1]){
    // khớp hông → đùi → gối → ống chân + giày; khớp vai → cánh tay + bàn tay (10/11: chân gập gối, tay đánh từ vai)
    const hip = new THREE.Group(); hip.position.set(s*0.075, 0.33, 0); root.add(hip);
    const th = cyl(0.058, 0.055, 0.17, pants); th.position.y = -0.08; hip.add(th);
    const knee = new THREE.Group(); knee.position.y = -0.16; hip.add(knee);
    knee.add(sph(0.055, pants));
    const shin = cyl(0.055, 0.05, 0.14, pants); shin.position.y = -0.07; knee.add(shin);
    const sh = rbox(0.1, 0.06, 0.15, 0.025, shoe); sh.position.set(0, -0.14, 0.02); knee.add(sh);
    const shd = new THREE.Group(); shd.position.set(s*0.17, 0.6, 0); shd.rotation.z = s*0.15; root.add(shd);
    const arm = cyl(0.045, 0.04, 0.27, o.shirt); arm.position.y = -0.135; shd.add(arm);
    const hand = sph(0.045, skin); hand.position.y = -0.285; shd.add(hand);
    legs.push({leg: hip, hip, knee, sh, s}); arms.push({arm: shd, s});
    const eye = sph(1, "#1E1816", {r: 0.25}); eye.scale.set(0.024, 0.03, 0.014); eye.position.set(s*0.062, 0.815, 0.152); root.add(eye);
    const ck = sph(0.026, "#F2A0A0"); ck.scale.set(0.03, 0.018, 0.012); ck.position.set(s*0.1, 0.77, 0.135); root.add(ck);
  }
  const body = rbox(0.3, 0.32, 0.2, 0.08, o.shirt); body.position.y = 0.49; root.add(body);
  const head = sph(1, skin); head.scale.set(0.17, 0.165, 0.16); head.position.y = 0.8; root.add(head);
  const capG = new THREE.SphereGeometry(1, 22, 14, 0, Math.PI*2, 0, Math.PI*0.52);
  const cap = mesh(capG, mat(hairC)); cap.scale.set(0.182, 0.18, 0.175); cap.position.set(0, 0.805, -0.008); cap.rotation.x = -0.38; root.add(cap);
  const add = (m, x, y, z)=>{ m.position.set(x, y, z); root.add(m); return m; };
  if (o.hair === "dai"){
    add(rbox(0.33, 0.3, 0.07, 0.035, hairC), 0, 0.7, -0.12);
    for (const s of [-1, 1]){ const st = sph(1, hairC); st.scale.set(0.045, 0.13, 0.06); add(st, s*0.155, 0.72, -0.03); }
  } else if (o.hair === "duoi"){
    const tie = sph(0.03, o.shirt); add(tie, 0, 0.86, -0.18);
    const pt = sph(1, hairC); pt.scale.set(0.06, 0.13, 0.06); pt.rotation.x = 0.35; add(pt, 0, 0.75, -0.22);
  } else if (o.hair === "xoan"){
    for (let i = 0; i < 16; i++){ const a = i/16*Math.PI*2, ring = i%2 ? 0.6 : 0.85;
      add(sph(0.055, hairC), Math.cos(a)*0.16*ring, 0.86 + (1-ring)*0.12, Math.sin(a)*0.15*ring - 0.03); }
    add(sph(0.07, hairC), 0, 0.97, -0.02);
  } else if (o.hair === "bui"){
    for (const s of [-1, 1]) add(sph(0.07, hairC), s*0.13, 0.95, -0.03);
  } else {   // tóc ngắn: thêm mái lệch
    const fr = sph(1, hairC); fr.scale.set(0.11, 0.04, 0.05); fr.rotation.z = 0.25; add(fr, 0.03, 0.93, 0.11);
  }
  const rig = new THREE.Group(); while (root.children.length) rig.add(root.children[0]); root.add(rig);
  return {root, rig, legs, arms};
}

let PV = null;   // khung xem trước 3D ở màn tạo chó (máy vẽ riêng, không đụng vào phòng)
function runPreview3D(){
  const box = $("prev3d"); if (!box) return;
  if (!PV){
    const r = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: SIM});
    r.outputColorSpace = THREE.SRGBColorSpace; r.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight("#FFF6E8", "#B9A68A", 1.25));
    const l = new THREE.DirectionalLight("#FFF1D6", 1.5); l.position.set(1.5, 2.5, 2); sc.add(l);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(0.55, 40), new THREE.MeshBasicMaterial({color: "#000000", transparent: true, opacity: 0.12}));
    ground.rotation.x = -Math.PI/2; ground.position.y = 0.002; sc.add(ground);
    const cam = new THREE.PerspectiveCamera(32, 1, 0.05, 20);
    PV = {r, sc, cam, d: null, key: "", yaw: 0.6, drag: null};
    r.domElement.addEventListener("pointerdown", e=>{ PV.drag = e.clientX; });
    window.addEventListener("pointermove", e=>{ if (PV.drag != null){ PV.yaw += (e.clientX - PV.drag)*0.012; PV.drag = e.clientX; } });
    window.addEventListener("pointerup", ()=>{ PV.drag = null; });
  }
  box.appendChild(PV.r.domElement);
  const isOwner = draft.step === 5;
  const key = isOwner ? "o" + JSON.stringify(draft.ownerLook) : JSON.stringify(draft.look);
  if (key !== PV.key){
    if (PV.d) PV.sc.remove(PV.d.root);
    PV.d = isOwner ? buildOwner3D(draft.ownerLook) : buildDog3D(draft.look, {preview: true}); PV.sc.add(PV.d.root); PV.key = key;
  }
  const B = BREEDS[draft.look.breed], t0 = performance.now();
  cancelAnimationFrame(previewRAF);
  const loop = (now)=>{
    if (!$("prev3d")) return;
    const w = box.clientWidth || 340, h = box.clientHeight || 230;
    PV.r.setSize(w, h, false); PV.cam.aspect = w/h; PV.cam.updateProjectionMatrix();
    const t = (now - t0)/1000;
    if (PV.drag == null) PV.yaw += 0.006;
    PV.d.root.rotation.y = PV.yaw;
    if (isOwner){
      PV.d.root.position.y = Math.abs(Math.sin(t*2.2))*0.015;
      PV.cam.position.set(0, 0.62, 2.15); PV.cam.lookAt(0, 0.5, 0);
      PV.r.render(PV.sc, PV.cam); previewRAF = requestAnimationFrame(loop); return;
    }
    PV.d.root.position.y = 0;
    updateDog3D(poseFor(Math.floor(t/4)%2 ? "sit" : "happy", B), t, PV.d);
    const size = (B.bodyL + B.headR*2)*K;
    PV.cam.position.set(0, size*0.5, size*1.75); PV.cam.lookAt(0, size*0.24, 0);
    PV.r.render(PV.sc, PV.cam);
    previewRAF = requestAnimationFrame(loop);
  };
  loop(performance.now());   // vẽ ngay khung đầu
}
function runPreview(){
  const svg = $("preview"); if (!svg) return;
  const B = BREEDS[draft.look.breed];
  const r = svg.getBoundingClientRect(); const w = r.width||340, h = r.height||190;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const span = B.bodyL + B.headR*2 + B.snout + 40, tall = B.legL + B.bodyH + B.headR*2.6 + 14;
  const sc = Math.min(w/span, (h-14)/tall)*0.9;
  const t0 = performance.now();
  const loop = (now)=>{
    if (!$("preview")) return;
    const t = (now-t0)/1000;
    const pose = poseFor(Math.floor(t/3)%3===1 ? "sit" : "happy", B);
    const svgEl = $("preview");
    svgEl.innerHTML = `<ellipse cx="${w/2}" cy="${h-8}" rx="${span*sc*0.38}" ry="5" fill="rgba(0,0,0,.12)"/><g transform="translate(${w/2 - B.headR*0.6*sc},${h-8}) scale(${sc})">${dogSVG(draft.look, pose, t)}</g>`;
    previewRAF = requestAnimationFrame(loop);
  };
  previewRAF = requestAnimationFrame(loop);
}

function barTrend(k){   // >0: số mũi tên xanh (1–3), <0: số mũi tên đỏ (1–2), theo tốc độ thật của chỉ số

function cardData(p){

          h:Math.round(p.stats.happy), d:Math.round(p.stats.bond), w:Math.round(p.stats.weight)};
}
function encodeCard(obj){
  const json = JSON.stringify(obj);
  const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return "POPPY1:" + b64;
}
function decodeCard(str){
  str = str.trim();
  if (!str.startsWith("POPPY1:")) throw new Error("bad");
  let b = str.slice(7).replace(/-/g,"+").replace(/_/g,"/"); while (b.length%4) b+="=";
  const o = JSON.parse(decodeURIComponent(escape(atob(b))));
  if (!BREEDS[o.b]) throw new Error("bad");
  return o;
}
function cardHTML(c){
  const B = BREEDS[c.b];
  const look = {breed:c.b, coat:c.c, ear:c.e, tail:c.t, eye:c.y, colors:c.k||{}};
  return `<div class="dogcard"><h3>${esc(c.n)}</h3><div class="meta">${esc(c.o)} · ${B.name} · Cấp ${c.l}</div>
    ${staticDog(look, 300, 140).replace("<svg ", '<svg class="portrait" ')}
    ${statRow("Lại đây", c.s[2], true)}${statRow("Ngồi", c.s[0], true)}${statRow("Đứng", c.s[1], true)}${statRow("Nằm", c.s[3]||0, true)}

}

function showScan(){
  const el = $("cardSheet");

async function startCam(){
  const msg = $("camMsg");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof jsQR!=="function"){
    msg.textContent = "Máy này chưa quét được mã QR trong trang. Dùng cách dán mã chữ."; return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v = $("cam"); v.srcObject = camStream; await v.play();
    msg.textContent = "Đưa mã QR vào giữa khung hình";
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently:true});
    const tick = ()=>{
      if (!camStream) return;
      if (v.readyState >= 2){
        cv.width = v.videoWidth; cv.height = v.videoHeight;
        cx.drawImage(v,0,0);
        const img = cx.getImageData(0,0,cv.width,cv.height);
        const r = jsQR(img.data, img.width, img.height);
        if (r && r.data.startsWith("POPPY1:")){
          try { const c = decodeCard(r.data); stopCam(); showCompare(c); return; } catch(e){}
        }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    tick();
  } catch(e){
    msg.textContent = "Không mở được camera (cần cho phép camera, và trang phải mở bằng https). Dùng cách dán mã chữ.";
  }
}

function roomSVG(L, P){

  const wallSeg = (w, t, len, col, sw) => { const a = WALLS[w].pos(t - len/2, 0, 0), b = WALLS[w].pos(t + len/2, 0, 0); return `<line x1="${a.x}" y1="${a.z}" x2="${b.x}" y2="${b.z}" stroke="${col}" stroke-width="${sw}"/>`; };
  const sw = L.win.find(w => w.seat) || L.win[0], cp = WALLS[sw.w].pos(sw.t, 0, 0.48);
  return `<svg viewBox="-3.3 -2.8 6.6 5.6" xmlns="http://www.w3.org/2000/svg">

    <circle cx="${L.rug.x}" cy="${L.rug.z}" r="${L.rug.r}" fill="${P.rug}"/>
    ${it(L.sofa, 2.05, 0.95, P.sofa)}${it(L.table, 1.05, 0.6, P.wood)}${it(L.tv, 1.55, 0.5, "#2B2F38")}${it(L.shelf, 1.25, 0.42, P.shelf)}${it(L.box, 0.65, 0.5, P.accent)}
    ${it({x: cp.x, z: cp.z, a: wallRot(sw.w)}, 0.62, 0.68, P.chair, 0.12)}
    <circle cx="${L.bed.x}" cy="${L.bed.z}" r="0.5" fill="${P.bed}"/><circle cx="${L.bowl.x}" cy="${L.bowl.z}" r="0.18" fill="${P.accent2}"/><circle cx="${L.water.x}" cy="${L.water.z}" r="0.18" fill="#8EC9EE"/>
    <rect x="${L.pad.x - 0.33}" y="${L.pad.z - 0.26}" width="0.66" height="0.52" fill="#A9DDEB"/>
    ${L.plants.map(q => `<circle cx="${q.x}" cy="${q.z}" r="0.26" fill="#6FAE5E"/>`).join("")}<circle cx="${L.lamp.x}" cy="${L.lamp.z}" r="0.2" fill="#FFD98A"/>
    ${L.win.map(w => wallSeg(w.w, w.t, WIN_W, "#7CC4EC", 0.22)).join("")}${wallSeg(L.door.w, L.door.t, DOOR_W, P.door, 0.3)}
  </svg>`;
}

    if (QS.get("act") === "sit"){ const m = pickables.find(x => x.userData.kind === "seat" && x.userData.seat.userData.seatN === +(QS.get("seatn") || 2)); const S = seatSpot({object: m}); outdoor.x = S.stand.x; outdoor.z = S.stand.z; dog.pos = {x: S.stand.x + 0.7, z: S.stand.z + 0.3}; sitAt({object: m}); if (outdoor.then){ outdoor.path = []; const t0 = outdoor.then; outdoor.then = null; t0(); } } }, 200);
  if (QS.get("roomui")){ renderRoomSheet(); $("ovRoom").classList.add("show"); }
  if (QS.get("soak")){ let n=0; const acts=[petDog,()=>doCommand("come", randomFreePoint()),()=>doCommand("lie", randomFreePoint()),()=>doCommand("sit", randomFreePoint()),()=>openRing(rnd(50,W-50), H*0.7, randomFreePoint()),()=>stopPlay(),()=>playToy("ball"),()=>playToy("bone"),drinkWater,exercise,()=>doCommand("sit"),()=>doCommand("stand"),()=>doCommand("come"),giveTreat,feedBowl,()=>playToy("ball"),()=>playToy("bone"),toggleRest,()=>openRing(W/2,H/2,randomFreePoint()),closeRing,callName,()=>goChair(true),tapToy,openFoodMenu,closeFoodMenu,()=>feedBowl("bo",50),()=>startGnaw(),sayNo,()=>{prof.bladder=100;},()=>{ if(prof.messes.length) cleanMess(0); },openCloset,()=>$("ovCloset").classList.remove("show"),()=>{ petDog(); petDog(); },rubBelly,showInfo,showCard,()=>{resize();}];
    const iv=setInterval(()=>{ try{ pick(acts)(); document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("show")); n++; document.title="soak "+n+" state="+dog.state+" pos="+dog.pos.x.toFixed(2)+","+dog.pos.z.toFixed(2)+" nan="+(isNaN(dog.pos.x)||isNaN(dog.pos.z))+" free="+isFree(dog.pos)+" inroom="+(dog.pos.x>ROOM.x0&&dog.pos.x<ROOM.x1&&dog.pos.z>ROOM.z0&&dog.pos.z<ROOM.z1); }catch(e){ document.title="SOAKERR "+e.message; clearInterval(iv);} }, 700); }
  if (QS.get("side")) setInterval(()=>{ if (!dog.path.length){ dog.faceCam = false; dog.lookAt = {x: dog.pos.x + 1, z: dog.pos.z + 0.25}; } }, 150);   // chạy thử: nhìn chó từ bên hông
  const st = QS.get("state"); if (st) setTimeout(()=>{ if(st==="ball"||st==="bone") playToy(st); else if(st==="ring") openRing(W*0.42, H*0.74, {x: 0.4, z: 1.3}); else if(st==="walk") walkTo({x: 0.6, z: -1.4}, false); else if(st==="chair") goChair(true); else if(st==="call") callName(); else if(st==="sofa") goPerch("sofa", true); else if(st==="belly"){ petDog(); setTimeout(petDog, 300); setInterval(()=>{ if (dog.state==="belly") rubBelly(); }, 600); } else if(st==="stats") showStats(600000); else if(st==="potty"){ prof.skills.potty = +(QS.get("skill")||0); prof.bladder = 100; } else if(st==="mess"){ prof.messes = [{x:0.6,z:1.0,t:0},{x:-0.6,z:1.3,t:gameNow(prof)}]; buildMesses(); } else if(st==="gnaw") startGnaw(QS.get("spot")||"sofa"); else if(st==="marks"){ prof.marks = {sofa: 7, table: 4, cab: 2}; buildMarks(); } else if(st==="bedmenu") openBedMenu(); else if(st==="rest") startRest(); else if(st==="sleepbed") toggleRest(); else if(st==="food") openFoodMenu(); else if(st==="closet") openCloset(); else if(st==="info") showInfo(); else if(st==="card") showCard(); else if(st.startsWith("g_")){ const gn = st.slice(2); const again = ()=>gesture(gn, ()=>setTimeout(again, 400), {dir: 1}); dog.faceCam = true; again(); } else if(st==="dream"){ toggleRest(); } else setState(st, 600000); }, 300);
} else if (QS.get("createStep")){ persist = ()=>{}; openCreate(true); draft.step = 0; draft.owner="Ryan"; draft.look.breed=QS.get("breed")||"pom"; const BB=BREEDS[draft.look.breed]; draft.look.ear=BB.ears[0][0]; draft.look.tail=BB.tails[0][0]; draft.step=+QS.get("createStep"); draft.name = draft.name || "Bông"; if (QS.get("coat")) draft.look.coat=+QS.get("coat"); if (QS.get("cols")) QS.get("cols").split(",").forEach(p=>{ const [k,v]=p.split(":"); draft.look.colors[k]="#"+v; }); if (QS.get("reg")) draft.region=QS.get("reg"); if (QS.get("hair")) draft.ownerLook.hair=QS.get("hair"); if (QS.get("shirt")) draft.ownerLook.shirt="#"+QS.get("shirt"); renderCreate();
} else if (save.profiles.length === 0) openCreate(true);
else {
  const id = save.current && save.profiles.some(p=>p.id===save.current) ? save.current : save.profiles[0].id;
  startProfile(id);
}
if (SIM){ setInterval(()=>frame(performance.now()), 33); const simDraw = ()=>{ renderer.render(scene, camera); requestAnimationFrame(simDraw); }; requestAnimationFrame(simDraw); } else requestAnimationFrame(frame);
</script>
