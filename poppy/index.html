  prof.last = Date.now() - 7*86400000; applyTime(prof, Date.now());
  ok("bỏ đói 7 ngày: ốm nặng nhưng không chết", prof.stats.sick === 100 && SICK_LABELS[sickLevel(prof.stats.sick)]==="Ốm nặng" && save.profiles.includes(prof) && prof.stats.happy >= 20, "vui "+Math.round(prof.stats.happy));
  ok("ốm nặng thì không làm lệnh", (()=>{ const b=prof.skills.sit; prof.skills.sit=100; doCommand("sit"); const r = dog.state==="sad"; prof.skills.sit=b; return r; })());
  prof.stats.hunger = 0; prof.last = Date.now() - 10*3600000; applyTime(prof, Date.now());
  ok("ăn no thì khỏi dần", prof.stats.sick < 100, Math.round(prof.stats.sick));
  ok("tập thể dục nhiều thì bệnh chậm hơn", (()=>{ const a={...prof, stats:{...prof.stats, sick:0, hunger:100, fit:100}, last:Date.now()-5*3600000}; const b={...prof, stats:{...prof.stats, sick:0, hunger:100, fit:10}, last:Date.now()-5*3600000}; applyTime(a,Date.now()); applyTime(b,Date.now()); return a.stats.sick < b.stats.sick; })());
  // ZZZ, vẫy đuôi, chơi liên tục
  ok("ZZZ không còn khi chó đã dậy", !dogSVG(prof.dog, {...poseFor("happy",B), sleep:0.3}, 1).includes(">z</text>") && dogSVG(prof.dog, poseFor("sleep",B), 1).includes(">z</text>"));
  prof.stats.sick = 0; prof.stats.hunger = 0; prof.stats.happy = 80;
  const realRAF = window.requestAnimationFrame; window.requestAnimationFrame = ()=>0;
  excitedUntil = 0; play = null; setState("happy", 99999); for (let i=0;i<60;i++) frame(lastFrame+16); excitedUntil = 0; for (let i=0;i<60;i++) frame(lastFrame+16);
  ok("không ai tương tác thì vẫy đuôi nhẹ", dog.pose.wag <= 0.2, dog.pose.wag.toFixed(2));
  excite(999999); for (let i=0;i<60;i++) frame(lastFrame+16);
  ok("chủ tương tác thì vẫy đuôi mạnh", dog.pose.wag >= 0.5, dog.pose.wag.toFixed(2)); window.requestAnimationFrame = realRAF;
  playToy("ball");
  ok("bấm bóng thì bắt đầu phiên chơi, có nút Dừng", !!play && $("stopPlay").classList.contains("show") && $("tBallLbl").textContent==="Dừng");
  ok("bóng không tự biến mất sau vài giây", toy && !toy.until);
  play.start = performance.now() - 3*60000;
  ok("chơi hơn 2 phút vẫn còn chơi (chưa bấm Dừng)", !!play);
  stopPlay();
  ok("bấm Dừng thì hết chơi", !play && !toy && !$("stopPlay").classList.contains("show"));
  playToy("bone"); ok("xương cũng chơi liên tục", !!play && play.type==="bone" && toy && !toy.until); stopPlay(true);
  // lệnh theo vị trí + cưng chó
  ok("có 4 lệnh: Lại đây, Ngồi, Đứng, Nằm", Object.keys(COMMANDS).join()==="come,sit,stand,lie");
  prof.skills.come = 100; dog.pos = {x: -2.2, z: 1.0}; const tx = {x: 2.2, z: -1.2};
  doCommand("come", tx);
  const lastWp = dog.path[dog.path.length-1];
  ok("mức cao: chó chạy tới đúng chỗ bấm", dog.state==="run" && lastWp && Math.hypot(lastWp.x-tx.x, lastWp.z-tx.z) < 0.3, dog.state);
  ok("đường đi không xuyên đồ đạc", (()=>{ let a = dog.pos; for (const p of dog.path){ if (!lineFree(a, p)) return false; a = p; } return true; })());
  ok("từ nệm tới bát ăn có đường đi", (()=>{ const pth = findPath(room.bed, room.bowl); const e = pth[pth.length-1]; return pth.length > 0 && Math.hypot(e.x-room.bowl.x, e.z-room.bowl.z) < 0.6; })());
  ok("bấm vào sofa thì chó không đi xuyên sofa", (()=>{ const p = findPath({x:-1.2, z:0.4}, {x:-1.2, z:-2.0}); const e = p[p.length-1]; return isFree(e) && !(e.x > -2.25 && e.x < -0.15 && e.z > -2.5 && e.z < -1.5); })());
  prof.skills.lie = 100; dog.pos = {x: 0, z: 0.6}; doCommand("lie", {x: 0, z: 0.6});
  ok("lệnh Nằm đúng chỗ thì nằm và mở cửa sổ thưởng", dog.state==="lie" && trainWin && trainWin.cmd==="lie");
  const lb = prof.skills.lie; prof.skills.lie = 50; giveTreat(); ok("thưởng ngay sau khi nằm đúng thì tăng mức Nằm", prof.skills.lie > 50); prof.skills.lie = lb;
  prof.pets = {date: todayStr(gameNow(prof)), gained: 0, recent: []}; prof.stats.bond = 10;
  petDog(); const g1 = prof.stats.bond - 10;
  for (let i=0;i<30;i++) petDog();
  const gAll = prof.stats.bond - 10;
  ok("cưng lần đầu +1 thân thiết", Math.abs(g1 - 1) < 0.01, g1.toFixed(2));
  ok("cưng liên tục thì tăng ít dần", gAll < 31*0.5 && gAll > 1, gAll.toFixed(2));
  prof.pets.recent = []; prof.pets.gained = 14.9; const b0 = prof.stats.bond; for (let i=0;i<5;i++){ prof.pets.recent=[]; petDog(); }
  ok("cưng tối đa 15 điểm mỗi ngày", prof.pets.gained <= 15.0001 && prof.stats.bond - b0 <= 0.11, prof.pets.gained.toFixed(2));
  ok("cưng chó thì vẫy đuôi mạnh", excitedUntil > performance.now());
  // 3D: cả 5 giống dựng được, không lỗi số
  let bad3 = "";
  for (const k of BREED_ORDER){ const BB = BREEDS[k]; for (const e of BB.ears) for (const t of BB.tails){
    try { buildDog3D({breed:k, coat:1, ear:e[0], tail:t[0], eye:2});
      for (const ps of ["stand","sit","beg","lie","sleep","sad","eat","play","scratch"]) updateDog3D(poseFor(ps, BB), 1.3);
      dog3.root.updateMatrixWorld(true); let nan = false; dog3.root.traverse(o=>{ if (isNaN(o.matrixWorld.elements[12]+o.matrixWorld.elements[13]+o.matrixWorld.elements[14])) nan = true; });
      if (nan) bad3 += k+"/"+e[0]+"/"+t[0]+" NaN; ";
    } catch(err){ bad3 += k+"/"+e[0]+"/"+t[0]+" "+err.message+"; "; } } }
  buildDog3D(prof.dog);
  ok("3D: 5 giống × tai × đuôi × tư thế dựng không lỗi", bad3==="", bad3.slice(0,200));
  // cân nặng
  ok("nhãn cân nặng", weightLabel(20)==="Cần ăn thêm" && weightLabel(50)==="Vừa vặn" && weightLabel(80)==="Hơi tròn");
  showInfo(); showCard(); const vis = document.body.innerText.toLowerCase(); $("ovInfo").classList.remove("show"); $("ovCard").classList.remove("show"); ok("màn hình không có chữ “béo”", !vis.includes("b"+"éo") && ["vừa vặn","hơi tròn","cần ăn thêm"].some(w=>vis.includes(w)));
  // thẻ chó
  const c = cardData(prof); const back = decodeCard(encodeCard(c));
  ok("thẻ chó mã hoá rồi đọc lại đúng (có dấu tiếng Việt)", JSON.stringify(c)===JSON.stringify(back));
  let qrok=false; try{ const q=qrcode(0,"M"); q.addData(encodeCard(c)); q.make(); qrok = q.getModuleCount()>0; }catch(e){}
  ok("tạo được mã QR", qrok);
  ok("mã sai thì báo lỗi", (()=>{ try{ decodeCard("abc"); return false; }catch(e){ return true; } })());
  // đủ 5 giống, mỗi giống vẽ được mọi tư thế
  let drawErr = "";
  for (const k of BREED_ORDER){ const BB=BREEDS[k]; for (const ps of ["stand","sit","beg","lie","sleep","sad","eat","chew","happy","play","scratch","look","hungry"]) for (const e of BB.ears) for (const t of BB.tails) for (let ci=0; ci<BB.coats.length; ci++){
    try { const sv = dogSVG({breed:k,coat:ci,ear:e[0],tail:t[0],eye:0}, poseFor(ps,BB), 1.2); if (sv.includes("NaN")) drawErr += k+"/"+ps+" NaN; "; } catch(err){ drawErr += k+"/"+ps+" "+err.message+"; "; } } }
  ok("5 giống × mọi tư thế × tai × đuôi × màu vẽ không lỗi", drawErr==="", drawErr.slice(0,200));
  ok("có đủ 5 giống", BREED_ORDER.length===5 && BREED_ORDER.every(k=>BREEDS[k]));
  ok("đuôi Dachshund dài, không cuộn", BREEDS.dachshund.tails.every(t=>t[0]!=="curl"));
  const pre = document.createElement("pre"); pre.id="selftest"; pre.textContent = out.join(String.fromCharCode(10));
  pre.style.cssText="position:fixed;inset:0;background:#fff;z-index:99;margin:0;padding:10px;font:13px monospace;overflow:auto";
  document.body.appendChild(pre);
} else if (QS.get("demo")){ // ?demo=corgi : chơi thử, không lưu
  const k = BREEDS[QS.get("demo")] ? QS.get("demo") : "pom", B = BREEDS[k];
  persist = ()=>{};
  const p = newProfile("Thử", {breed:k, coat:+(QS.get("coat")||0), ear:B.ears[0][0], tail:B.tails[0][0], eye:0}, B.name);
  if (QS.get("sick")){ p.stats.sick = +QS.get("sick"); p.stats.hunger = 90; p.stats.happy = 25; }
  save = {version:SAVE_VERSION, profiles:[p], current:p.id};
  startProfile(p.id);
  if (QS.get("soak")){ let n=0; const acts=[petDog,()=>doCommand("come", randomFreePoint()),()=>doCommand("lie", randomFreePoint()),()=>doCommand("sit", randomFreePoint()),()=>openRing(rnd(50,W-50), H*0.7, randomFreePoint()),()=>stopPlay(),()=>playToy("ball"),()=>playToy("bone"),drinkWater,exercise,()=>doCommand("sit"),()=>doCommand("stand"),()=>doCommand("come"),giveTreat,feedBowl,()=>playToy("ball"),()=>playToy("bone"),toggleRest,()=>openRing(W/2,H/2,randomFreePoint()),closeRing,callName,()=>goChair(true),tapToy,showInfo,showCard,()=>{resize();}];
    const iv=setInterval(()=>{ try{ pick(acts)(); document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("show")); n++; document.title="soak "+n+" state="+dog.state+" pos="+dog.pos.x.toFixed(2)+","+dog.pos.z.toFixed(2)+" nan="+(isNaN(dog.pos.x)||isNaN(dog.pos.z))+" free="+isFree(dog.pos)+" inroom="+(dog.pos.x>ROOM.x0&&dog.pos.x<ROOM.x1&&dog.pos.z>ROOM.z0&&dog.pos.z<ROOM.z1); }catch(e){ document.title="SOAKERR "+e.message; clearInterval(iv);} }, 700); }
  const st = QS.get("state"); if (st) setTimeout(()=>{ if(st==="ball"||st==="bone") playToy(st); else if(st==="ring") openRing(W*0.42, H*0.74, {x: 0.4, z: 1.3}); else if(st==="walk") walkTo({x: 0.6, z: -1.4}, false); else if(st==="chair") goChair(true); else if(st==="call") callName(); else if(st==="info") showInfo(); else if(st==="card") showCard(); else setState(st, 600000); }, 300);
} else if (QS.get("createStep")){ persist = ()=>{}; openCreate(true); draft.owner="Ryan"; draft.look.breed=QS.get("breed")||"pom"; const BB=BREEDS[draft.look.breed]; draft.look.ear=BB.ears[0][0]; draft.look.tail=BB.tails[0][0]; draft.step=+QS.get("createStep"); renderCreate();
} else if (save.profiles.length === 0) openCreate(true);
else {
  const id = save.current && save.profiles.some(p=>p.id===save.current) ? save.current : save.profiles[0].id;
  startProfile(id);
}
if (SIM){ setInterval(()=>frame(performance.now()), 33); const simDraw = ()=>{ renderer.render(scene, camera); requestAnimationFrame(simDraw); }; requestAnimationFrame(simDraw); } else requestAnimationFrame(frame);
