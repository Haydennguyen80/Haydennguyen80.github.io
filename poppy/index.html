<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Poppy</title>
<meta name="theme-color" content="#14505A">
<link href="fonts/fonts.css" rel="stylesheet">
<script src="lib/three.min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="lib/jsQR.min.js"></script>
<style>
:root{
  --c1:#1E6F78; --c1d:#14505A; --c1l:#2A9AA0;
  --c2:#FFB547; --c2l:#FFF1D0; --c3:#C9772E;
  --cream:#F9F4E9; --ink:#0F0D0B;
  --sky1:#DCEBF7; --sky2:#F9F4E9; --floor:#E9D7B5; --floor-d:#D8C094;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:Nunito,"Segoe UI",Arial,sans-serif;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,.lora{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800}
#app{display:flex;flex-direction:column;height:100%}
#topbar{background:var(--c1d);color:var(--c2l);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
#topbar .name{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .name small{display:block;font-family:Nunito;font-weight:400;font-size:12px;color:#c9d3ea}
.badge{background:var(--c2);color:var(--c1d);border-radius:999px;padding:4px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.tb-btn{background:transparent;border:1px solid var(--c2);color:var(--c2l);border-radius:10px;padding:6px 10px;font-size:13px}
#stageWrap{position:relative;flex:1;min-height:0;overflow:hidden}
#stage3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#toolbar{background:var(--c1d);display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#toolbar button{min-width:0;overflow:hidden;background:var(--c1);border:1px solid var(--c1l);color:#fff;border-radius:14px;padding:8px 2px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
#toolbar button .ic{font-size:22px;line-height:1}
#toolbar button.on{background:var(--c2);color:var(--c1d);border-color:var(--c2)}
@media (max-width:520px){#toolbar{gap:3px;padding:6px 5px;padding-bottom:max(6px,env(safe-area-inset-bottom))}#toolbar button{font-size:10.5px;padding:6px 0;border-radius:10px;line-height:1.15}}
#ring{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.ringBtn{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--c2);background:var(--c1d);color:var(--c2l);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 4px 12px rgba(0,0,0,.25);transform:scale(.2);opacity:0;transition:transform .18s ease,opacity .18s ease}
.ringBtn .ic{font-size:22px;line-height:1.1}
.ringBtn.show{transform:scale(1);opacity:1}
.ringBtn:disabled{opacity:.45}
.tapDot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--c2);border:3px solid #fff;box-shadow:0 0 0 2px var(--c1)}
#marker{position:absolute;transform:translate(-50%,-100%);background:var(--c2);color:var(--c1d);font-weight:800;font-size:14px;padding:4px 10px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#marker.show{opacity:1}
#marker:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--c2);border-bottom:0}
.heart{position:absolute;color:#E5533D;font-size:22px;pointer-events:none;animation:heart 1.2s ease-out forwards}
@keyframes heart{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-60px) scale(1.2);opacity:0}}
#bubble{position:absolute;pointer-events:none;background:#fff;border:2px solid var(--c1);color:var(--c1d);border-radius:16px;padding:6px 12px;font-weight:600;font-size:15px;transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .2s}
#bubble:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--c1);border-bottom:0}
#bubble.show{opacity:1}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,80,90,.85);color:var(--c2l);padding:6px 12px;border-radius:999px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#hint.show{opacity:1}
#stopPlay{position:absolute;right:12px;top:12px;display:none;background:var(--c2);color:var(--c1d);border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#stopPlay.show{display:block}
#stopPlay span{font-weight:600;opacity:.8;margin-left:4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--c1d);color:var(--c2l);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(20,80,90,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.overlay.show{display:flex}
@media(min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px}
@media(min-width:700px){.sheet{border-radius:20px}}
.sheet h2{margin:0 0 4px;color:var(--c1d);font-size:22px}
.sheet .sub{color:#5a6276;font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--c1);color:var(--c2l);border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600}
.btn.gold{background:var(--c2);color:var(--c1d)}
.btn.ghost{background:transparent;color:var(--c1);border:2px solid var(--c1)}
.btn:disabled{opacity:.4}
input[type=text]{width:100%;font-size:18px;padding:12px;border-radius:12px;border:2px solid #c8cfdf;background:#fff;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--c1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:2px solid #e2dccd;border-radius:14px;padding:8px;text-align:center;cursor:pointer}
.card.sel{border-color:var(--c2);box-shadow:0 0 0 3px rgba(255,181,71,.35)}
.card svg{width:100%;height:96px;display:block}
.card b{display:block;color:var(--c1d)}
.card span{font-size:12px;color:#5a6276}
.opt-label{font-weight:600;color:var(--c1d);margin:14px 0 6px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#5a6276;cursor:pointer;background:none;border:0;padding:0}
.sw i{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #c8cfdf;display:block}
.sw.sel i{box-shadow:0 0 0 3px var(--c2)}
.chip{background:#fff;border:2px solid #c8cfdf;border-radius:999px;padding:8px 14px;font-size:14px}
.chip.sel{border-color:var(--c2);background:#fbf3e2;font-weight:600}
#preview{width:100%;height:190px;background:linear-gradient(var(--sky1),var(--sky2));border-radius:14px;display:block}
.stat{margin:8px 0}
.stat .lbl{display:flex;justify-content:space-between;font-size:14px}
.bar{height:12px;background:#e6e0d2;border-radius:999px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--c1l);border-radius:999px}
.bar.gold i{background:var(--c2)}
.dogcard{background:var(--c1d);color:var(--c2l);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.dogcard h3{margin:0;font-size:22px;color:var(--c2l)}
.dogcard .meta{font-size:13px;color:#c9d3ea}
.dogcard svg.portrait{width:100%;height:140px;background:linear-gradient(#2A9AA0,#1E6F78);border-radius:12px;margin:8px 0}
.dogcard .stat .lbl{color:#fff}
.dogcard .bar{background:#24365f}
.qrbox{background:#fff;border-radius:12px;padding:10px;display:flex;justify-content:center;margin-top:10px}
.qrbox img,.qrbox canvas{width:180px;height:180px;image-rendering:pixelated}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profiles .card{display:flex;align-items:center;gap:10px;text-align:left}
.profiles .card svg{width:90px;height:64px;flex:none}
video#cam{width:100%;border-radius:12px;background:#000}
textarea{width:100%;min-height:70px;font-size:12px;border-radius:10px;border:2px solid #c8cfdf;padding:8px;font-family:monospace}
.small{font-size:12px;color:#5a6276}
</style>

<script>
"use strict";
/* =========================================================
   POPPY 3D – đợt 3D-1
   Phòng khách 3D (Three.js). Chó dựng bằng thông số, lưu trên máy (localStorage).
   Ảnh nhỏ trong màn hình tạo chó / hồ sơ / thẻ vẫn dùng hình 2D (dogSVG).
   ========================================================= */

const SAVE_KEY = "poppy.save.v1";
const SAVE_VERSION = 1;
const SPEED = Math.max(1, Number(new URLSearchParams(location.search).get("speed")) || 1); // ?speed=60 để thử nhanh
const TREATS_PER_DAY = 10;
const TRAIN_WINDOW_MS = 5000;
const MEALS = [11, 17];          // 2 bữa: 11 giờ trưa và 5 giờ chiều
const EXERCISE_FROM = 17;        // tập thể dục sau 5 giờ chiều
const WATER_HOURS = 2;           // nhắc uống nước khoảng 2 tiếng một lần

/* ---------- Giống chó ---------- */
const BREEDS = {
  pom: {
    name: "Pomeranian", desc: "Nhỏ, lông xù, thông minh vừa",
    bodyL: 58, bodyH: 46, legL: 17, legW: 9, headR: 17, snout: 9, snoutH: 9, sitTilt: 0.7,
    fur: "fluffy", learn: 1.0, energy: 1.0,
    ears: [["prick","Tai nhọn"],["fold","Tai gập"]],
    tails: [["curl","Đuôi cuộn"],["plume","Đuôi bông"]],
    coats: [
      {n:"Trắng", main:"#F6F2EA", second:"#FFFFFF"},
      {n:"Cam", main:"#E8913A", second:"#F6D3A6"},
      {n:"Kem", main:"#EED5A8", second:"#FBF0DC"},
      {n:"Đen", main:"#2B2522", second:"#4A403A"}
    ]
  },
  corgi: {
    name: "Corgi", desc: "Chân ngắn, năng động",
    bodyL: 84, bodyH: 40, legL: 14, legW: 11, headR: 16, snout: 13, snoutH: 10, sitTilt: 0.5,
    fur: "smooth", learn: 1.0, energy: 1.3, belly: true,
    ears: [["bigPrick","Tai to"],["prick","Tai nhọn"]],
    tails: [["fox","Đuôi xù"],["stub","Đuôi cụt"]],
    coats: [
      {n:"Đỏ trắng", main:"#D9822B", second:"#FFFFFF"},
      {n:"Ba màu", main:"#2B2522", second:"#FFFFFF", points:"#C98A4B"},
      {n:"Vàng sẫm", main:"#B5651D", second:"#F7EBDD"},
      {n:"Vàng nhạt", main:"#E2B373", second:"#FFFFFF"}
    ]
  },
  poodle: {
    name: "Poodle", desc: "Lông xoăn, học lệnh nhanh",
    bodyL: 60, bodyH: 38, legL: 38, legW: 9, headR: 14, snout: 15, snoutH: 8, sitTilt: 0.75,
    fur: "curly", learn: 1.3, energy: 1.1,
    ears: [["curlyDrop","Tai xoăn dài"],["floppy","Tai rủ"]],
    tails: [["pompom","Đuôi búp"],["straight","Đuôi thẳng"]],
    coats: [
      {n:"Trắng", main:"#F5F2EA", second:"#FFFFFF"},
      {n:"Đen", main:"#262222", second:"#3A3434"},
      {n:"Nâu", main:"#6B4226", second:"#86583A"},
      {n:"Mơ", main:"#E8B07A", second:"#F3CFA5"}
    ]
  },
  shiba: {
    name: "Shiba", desc: "Tai đứng, độc lập, học chậm hơn",
    bodyL: 68, bodyH: 40, legL: 28, legW: 10, headR: 16, snout: 13, snoutH: 10, sitTilt: 0.65,
    fur: "smooth", learn: 0.75, energy: 1.0, belly: true,
    ears: [["prick","Tai đứng"],["bigPrick","Tai to"]],
    tails: [["curl","Đuôi cuộn"],["sickle","Đuôi cong"]],
    coats: [
      {n:"Đỏ", main:"#D2772F", second:"#F6E6CC"},
      {n:"Mè", main:"#A8763E", second:"#F2E2C6"},
      {n:"Đen nâu", main:"#2B2522", second:"#F2E2C6", points:"#C98A4B"},
      {n:"Kem", main:"#ECD9B5", second:"#FFF8EA"}
    ]
  },
  dachshund: {
    name: "Dachshund", desc: "Chó lạp xưởng: thân dài, chân rất ngắn",
    bodyL: 100, bodyH: 32, legL: 12, legW: 10, headR: 14, snout: 17, snoutH: 9, sitTilt: 0.4,
    fur: "smooth", learn: 0.9, energy: 1.1,
    ears: [["floppy","Tai rủ"],["longDrop","Tai rủ dài"]],
    tails: [["long","Đuôi dài"],["saber","Đuôi cong nhẹ"]],
    coats: [
      {n:"Đỏ", main:"#B5541F", second:"#C8703A"},
      {n:"Đen nâu", main:"#2B1D16", second:"#2B1D16", points:"#B8763A"},
      {n:"Sô-cô-la", main:"#5A3420", second:"#6E4530", points:"#B8763A"},
      {n:"Kem", main:"#E6C08F", second:"#F0D3AC"}
    ]
  }
};
const BREED_ORDER = ["pom","corgi","poodle","shiba","dachshund"];
const EYES = [
  {n:"Nâu đậm", c:"#2A1A10"}, {n:"Nâu", c:"#5C3A1E"},
  {n:"Hổ phách", c:"#A86F12"}, {n:"Xanh", c:"#3F6FA8"}
];
const COMMANDS = {
  come:  {n:"Lại đây", ic:"👋"},
  sit:   {n:"Ngồi", ic:"🪑"},
  stand: {n:"Đứng", ic:"🐕"},
  lie:   {n:"Nằm",  ic:"💤"}
};
const PET_DAILY_MAX = 15;   // cưng chó: tối đa 15 điểm thân thiết mỗi ngày

/* ---------- Tiện ích ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shade(hex, f){ // f<0 tối hơn, f>0 sáng hơn
  const n = parseInt(hex.slice(1),16);
  let r=n>>16, g=(n>>8)&255, b=n&255;
  if (f<0){ r*=1+f; g*=1+f; b*=1+f; } else { r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; }
  return "#"+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,"0")).join("");
}
function todayStr(ts){ const d=new Date(ts); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

/* =========================================================
   VẼ CHÓ
   pose: cy (độ cao tâm thân), tilt (rad, âm = ngóc đầu lên),
   fF/bF (chân trước/sau: lệch ngang của bàn chân so với vai/hông),
   fLift/bLift, head (rad), ear (0..1 cụp), tail (rad), wag, eye (0..1),
   happy (0..1 mắt cười), tongue (0..1), mouth (0..1), chew
   ========================================================= */
function ik(hx,hy,fx,fy,L1,L2,bend){
  let dx=fx-hx, dy=fy-hy, d=Math.hypot(dx,dy)||0.001;
  const maxD=L1+L2-0.01, minD=Math.abs(L1-L2)+0.5;
  const a=Math.atan2(dy,dx);
  if (d>maxD){ fx=hx+Math.cos(a)*maxD; fy=hy+Math.sin(a)*maxD; d=maxD; }
  if (d<minD){ d=minD; fx=hx+Math.cos(a)*d; fy=hy+Math.sin(a)*d; }
  const A=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  const ang=a-bend*A;
  return {kx:hx+Math.cos(ang)*L1, ky:hy+Math.sin(ang)*L1, fx, fy};
}

function standPose(){
  return {cy:0, tilt:0, fF:0, bF:0, fLift:0, bLift:0, fLiftFar:0, bLiftFar:0, fFFar:0, bFFar:0,
          head:0, ear:0, tail:0, wag:0.25, wagSpd:6, eye:1, happy:0, tongue:0, mouth:0, chew:0, sleep:0, fStretch:1, shake:0};
}

function poseFor(type, B){
  const p = standPose();
  const L = B.legL, H = B.bodyH;
  const standCy = L + H*0.25;
  p.cy = standCy;
  switch(type){
    case "sit": {
      // hông sát đất, thân ngóc lên theo góc riêng của từng giống, chân trước duỗi dài ra để chạm đất
      const rearHip = Math.max(L*0.3, 4);
      p.tilt = -B.sitTilt;
      const hx = -B.bodyL*0.5 + B.legW*0.9, hy = H*0.25;
      p.cy = rearHip + hx*Math.sin(p.tilt) + hy*Math.cos(p.tilt);
      const sx = B.bodyL*0.5 - B.legW*0.9;
      const shoulderH = p.cy - (sx*Math.sin(p.tilt) + hy*Math.cos(p.tilt));
      p.fStretch = clamp(shoulderH/(L*1.08), 1, 2.6);
      p.bF = L*0.55; p.bFFar = L*0.55; p.fF = 2; p.fFFar = 2;
      p.head = 0.05 + B.sitTilt*0.25; p.tail = 0.6; p.wag = 0.15;
      break;
    }
    case "beg": { // đứng hai chân sau
      p.tilt = -1.05;
      const half = B.bodyL*0.42;
      p.cy = L*0.9 + H*0.2 + Math.sin(1.05)*half;
      p.bF = L*0.35; p.bFFar = L*0.15; p.fStretch = 1;
      p.fF = 6; p.fFFar = 2; p.fLift = 999; p.fLiftFar = 999; // 999 = co chân trước lên ngực
      p.head = 0.15; p.tail = 0.3; p.wag = 0.5; p.wagSpd = 14; p.happy = 1; p.tongue = 1;
      break;
    }
    case "lie": {
      p.cy = H*0.5;
      p.fF = L*0.95; p.fFFar = L*0.85; p.bF = L*0.7; p.bFFar = L*0.6;
      p.head = 0.05; p.tail = 1.1; p.wag = 0.1;
      break;
    }
    case "sleep": {
      p.cy = H*0.46;
      p.fF = L*1.0; p.fFFar = L*0.9; p.bF = L*0.7; p.bFFar = L*0.6;
      p.head = 0.5; p.ear = 0.6; p.tail = 1.3; p.wag = 0; p.eye = 0; p.sleep = 1;
      break;
    }
    case "sad": {
      p.cy = H*0.5;
      p.fF = L*0.95; p.fFFar = L*0.85; p.bF = L*0.7; p.bFFar = L*0.6;
      p.head = 0.35; p.ear = 1; p.tail = 1.5; p.wag = 0.03; p.wagSpd = 2; p.eye = 0.55;
      break;
    }
    case "eat": {
      p.tilt = 0.12; p.head = 0.9; p.fF = 3; p.mouth = 0.3; p.chew = 1; p.wag = 0.35; p.wagSpd = 10;
      break;
    }
    case "chew": { // nằm gặm xương
      p.cy = H*0.5;
      p.fF = L*0.95; p.fFFar = L*0.85; p.bF = L*0.7; p.bFFar = L*0.6;
      p.head = 0.25; p.chew = 1; p.mouth = 0.4; p.wag = 0.3; p.wagSpd = 8; p.happy = 0.5;
      break;
    }
    case "happy": {
      p.happy = 1; p.tongue = 1; p.wag = 0.6; p.wagSpd = 16; p.head = -0.1;
      break;
    }
    case "play": { // chồm xuống mời chơi
      p.tilt = 0.35; p.fF = L*0.8; p.fFFar = L*0.7; p.happy = 1; p.tongue = 1; p.wag = 0.7; p.wagSpd = 18; p.head = -0.25;
      break;
    }
    case "scratch": {
      p.tilt = -0.3; p.cy = standCy*0.8; p.bF = L*0.2; p.bLift = L*0.9; p.bFFar = L*0.5; p.head = 0.3; p.eye = 0.4; p.wag = 0.1;
      break;
    }
    case "look": {
      p.head = -0.35; p.ear = 0; p.wag = 0.05; p.wagSpd = 3;
      break;
    }
    case "hungry": {
      p.head = 0.25; p.ear = 0.6; p.wag = 0.08; p.wagSpd = 3; p.eye = 0.75;
      break;
    }
  }
  return p;
}

// vẽ một con chó, trả về chuỗi SVG (hệ toạ độ: mặt đất y=0, chó quay sang phải)
function dogSVG(look, pose, t, opts={}){
  const B = BREEDS[look.breed];
  const coat = B.coats[look.coat] || B.coats[0];
  const main = coat.main, second = coat.second, points = coat.points || null;
  const dark = shade(main, -0.28), outline = shade(main, -0.55);
  const eyeC = (EYES[look.eye]||EYES[0]).c;
  const L1 = B.legL*0.55, L2 = B.legL*0.55;
  const hL = B.bodyL*0.5, hH = B.bodyH*0.5;
  const ct = Math.cos(pose.tilt), st = Math.sin(pose.tilt);
  const cx = 0, cyW = -pose.cy;
  const W = (x,y) => [cx + x*ct - y*st, cyW + x*st + y*ct];
  const breath = Math.sin(t*2.2)*(pose.sleep>0.5?1.2:0.6);
  let s = "";

  // hông/vai
  const sh = W(hL - B.legW*0.9, hH*0.5);
  const hp = W(-hL + B.legW*0.9, hH*0.5);
  const legColor = points || (B.belly ? second : main);
  const leg = (hx,hy,fx,lift,bend,color,far) => {
    let fy = -lift;
    const st = (bend<0) ? (pose.fStretch||1) : 1;
    let L1x=L1*st, L2x=L2*st;
    if (lift===999){ // co chân trước lên ngực
      const k = ik(hx,hy,hx+B.legL*0.6,hy+B.legL*0.15,L1x,L2x,-1);
      return limb(hx,hy,k.kx,k.ky,k.fx,k.fy,color,far);
    }
    const k = ik(hx,hy,hx+fx,fy,L1x,L2x,bend);
    return limb(hx,hy,k.kx,k.ky,k.fx,k.fy,color,far);
  };
  const limb = (hx,hy,kx,ky,fx,fy,color,far) => {
    const c = far ? shade(color,-0.18) : color;
    const w = B.legW;
    return `<path d="M${hx.toFixed(1)},${hy.toFixed(1)} L${kx.toFixed(1)},${ky.toFixed(1)} L${fx.toFixed(1)},${fy.toFixed(1)}" stroke="${shade(c,-0.35)}" stroke-width="${w+2.4}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+
           `<path d="M${hx.toFixed(1)},${hy.toFixed(1)} L${kx.toFixed(1)},${ky.toFixed(1)} L${fx.toFixed(1)},${fy.toFixed(1)}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+
           `<ellipse cx="${(fx+w*0.25).toFixed(1)}" cy="${(fy-w*0.15).toFixed(1)}" rx="${(w*0.72).toFixed(1)}" ry="${(w*0.48).toFixed(1)}" fill="${c}" stroke="${shade(c,-0.35)}" stroke-width="1.2"/>`;
  };

  // chân phía xa
  s += leg(sh[0]-3, sh[1], pose.fFFar, pose.fLiftFar, -1, legColor, true);
  s += leg(hp[0]+3, hp[1], pose.bFFar, pose.bLiftFar, 1, legColor, true);

  // đuôi
  const tb = W(-hL*0.92, -hH*0.45);
  const wagA = Math.sin(t*pose.wagSpd)*pose.wag;
  const tailRot = (pose.tilt + pose.tail*0.6 + wagA) * 180/Math.PI;
  const tailSVG = tailShape(look.tail, B, main, second, outline);
  const tailFront = (look.tail==="curl");
  const tailG = `<g transform="translate(${tb[0].toFixed(1)},${tb[1].toFixed(1)}) rotate(${tailRot.toFixed(1)})">${tailSVG}</g>`;
  if (!tailFront) s += tailG;

  // tai phía xa (vẽ sau đầu nên tính trước)
  // thân
  const bodyRot = pose.tilt*180/Math.PI;
  let body = "";
  const bw = hL, bh = hH + breath*0.3;
  body += `<ellipse cx="0" cy="0" rx="${bw.toFixed(1)}" ry="${bh.toFixed(1)}" fill="${main}" stroke="${outline}" stroke-width="2"/>`;
  if (B.belly){
    body += `<ellipse cx="${(bw*0.15).toFixed(1)}" cy="${(bh*0.45).toFixed(1)}" rx="${(bw*0.72).toFixed(1)}" ry="${(bh*0.5).toFixed(1)}" fill="${second}"/>`;
    body += `<ellipse cx="${(bw*0.82).toFixed(1)}" cy="${(bh*0.05).toFixed(1)}" rx="${(bw*0.22).toFixed(1)}" ry="${(bh*0.75).toFixed(1)}" fill="${second}"/>`;
  }
  if (points){
    body += `<ellipse cx="${(bw*0.75).toFixed(1)}" cy="${(bh*0.55).toFixed(1)}" rx="${(bw*0.18).toFixed(1)}" ry="${(bh*0.32).toFixed(1)}" fill="${points}"/>`;
  }
  if (B.fur==="fluffy"){
    for (let i=0;i<9;i++){
      const a = Math.PI*(1.05 + i*0.11);
      body += `<circle cx="${(Math.cos(a)*bw*0.92).toFixed(1)}" cy="${(Math.sin(a)*bh*0.92).toFixed(1)}" r="${(bh*0.32).toFixed(1)}" fill="${main}"/>`;
    }
    // bờm ngực
    body += `<circle cx="${(bw*0.72).toFixed(1)}" cy="${(-bh*0.05).toFixed(1)}" r="${(bh*0.78).toFixed(1)}" fill="${shade(main,0.1)}" stroke="${outline}" stroke-width="1.5"/>`;
    for (let i=0;i<6;i++){
      const a = -0.9 + i*0.45;
      body += `<circle cx="${(bw*0.72+Math.cos(a)*bh*0.7).toFixed(1)}" cy="${(-bh*0.05+Math.sin(a)*bh*0.7).toFixed(1)}" r="${(bh*0.26).toFixed(1)}" fill="${shade(main,0.1)}"/>`;
    }
  } else if (B.fur==="curly"){
    const curl = shade(main, main==="#262222"?0.12:-0.07);
    for (let i=0;i<14;i++){
      const a = i/14*Math.PI*2;
      body += `<circle cx="${(Math.cos(a)*bw*0.86).toFixed(1)}" cy="${(Math.sin(a)*bh*0.82).toFixed(1)}" r="${(bh*0.3).toFixed(1)}" fill="${main}" stroke="${curl}" stroke-width="1.5"/>`;
    }
    for (let i=0;i<5;i++) body += `<circle cx="${(-bw*0.5+i*bw*0.25).toFixed(1)}" cy="${(-bh*0.1+(i%2)*bh*0.3).toFixed(1)}" r="${(bh*0.22).toFixed(1)}" fill="none" stroke="${curl}" stroke-width="1.4"/>`;
  }
  s += `<g transform="translate(${cx},${cyW.toFixed(1)}) rotate(${bodyRot.toFixed(1)})">${body}</g>`;
  if (tailFront) s += tailG;

  // chân phía gần
  s += leg(hp[0], hp[1], pose.bF, pose.bLift, 1, legColor, false);
  s += leg(sh[0], sh[1], pose.fF, pose.fLift, -1, legColor, false);

  // đầu
  const neck = W(hL*0.78, -hH*0.55);
  const headAng = (pose.head + pose.tilt*0.35) * 180/Math.PI;
  const R = B.headR;
  const bob = pose.chew > 0.3 ? Math.sin(t*14)*0.8 : 0;
  let head = "";
  const hx = R*0.45, hy = -R*0.75 + bob;
  const earDroop = pose.ear;
  const ears = earShape(look.ear, B, R, main, second, outline, earDroop, t);
  head += `<g transform="translate(${(hx-R*0.15).toFixed(1)},${hy.toFixed(1)})">${ears.far}</g>`;
  if (B.fur==="curly") head += `<circle cx="${(hx-R*0.2).toFixed(1)}" cy="${(hy-R*0.75).toFixed(1)}" r="${(R*0.62).toFixed(1)}" fill="${main}" stroke="${shade(main,-0.12)}" stroke-width="1.5"/>`;
  head += `<circle cx="${hx}" cy="${hy.toFixed(1)}" r="${R}" fill="${main}" stroke="${outline}" stroke-width="2"/>`;
  if (B.fur==="fluffy"){
    for (let i=0;i<6;i++){ const a=Math.PI*(0.55+i*0.17); head += `<circle cx="${(hx+Math.cos(a)*R*0.95).toFixed(1)}" cy="${(hy+Math.sin(a)*R*0.95).toFixed(1)}" r="${(R*0.28).toFixed(1)}" fill="${main}"/>`; }
  }
  // má/mõm
  const snoutC = (B.belly || look.breed==="shiba") ? second : (points ? points : shade(main,0.12));
  const mouthOpen = pose.mouth + (pose.chew > 0.3 ? (Math.sin(t*14)*0.5+0.5)*0.5 : 0) + pose.tongue*0.3;
  const snX = hx + R*0.62, snY = hy + R*0.3;
  head += `<ellipse cx="${(snX+B.snout*0.35).toFixed(1)}" cy="${(snY+mouthOpen*2).toFixed(1)}" rx="${(B.snout*0.75+3).toFixed(1)}" ry="${(B.snoutH*0.45).toFixed(1)}" fill="${shade(snoutC,-0.1)}" stroke="${outline}" stroke-width="1.5"/>`;
  head += `<ellipse cx="${(snX+B.snout*0.4).toFixed(1)}" cy="${snY.toFixed(1)}" rx="${(B.snout*0.8+4).toFixed(1)}" ry="${(B.snoutH*0.55).toFixed(1)}" fill="${snoutC}" stroke="${outline}" stroke-width="1.5"/>`;
  if (pose.tongue>0.5){
    head += `<path d="M${(snX+B.snout*0.3).toFixed(1)},${(snY+B.snoutH*0.4).toFixed(1)} q3,${(9+Math.sin(t*10)*1.5).toFixed(1)} 8,0" fill="#E86A7A" stroke="#B0475A" stroke-width="1.2"/>`;
  }
  // mũi
  head += `<ellipse cx="${(snX+B.snout*1.15+3).toFixed(1)}" cy="${(snY-B.snoutH*0.25).toFixed(1)}" rx="3.6" ry="3" fill="#1A1412"/>`;
  // mắt
  const ex = hx + R*0.3, ey = hy - R*0.15;
  const blink = (Math.sin(t*0.9+look.coat)>0.985) ? 0.1 : 1;
  const open = pose.eye*blink;
  if (pose.happy>0.5 && pose.eye>0.5){
    head += `<path d="M${ex-4},${ey+1} q4,-6 8,0" stroke="#1A1412" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  } else if (open<0.2){
    head += `<path d="M${ex-4},${ey} q4,3.5 8,0" stroke="#1A1412" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  } else {
    head += `<ellipse cx="${ex}" cy="${ey}" rx="3.8" ry="${(4.4*Math.max(open,0.25)).toFixed(1)}" fill="${eyeC}" stroke="#1A1412" stroke-width="1.2"/>`;
    head += `<circle cx="${ex+1.2}" cy="${ey-1.3*open}" r="1.2" fill="#fff"/>`;
    if (open<0.8) head += `<path d="M${ex-5},${(ey-4.4*open+1).toFixed(1)} h10" stroke="${outline}" stroke-width="2" stroke-linecap="round"/>`;
  }
  head += `<g transform="translate(${(hx-R*0.15).toFixed(1)},${hy.toFixed(1)})">${ears.near}</g>`;
  if (pose.sleep > 0.5){
    const z = (t*0.6)%1;
    head += `<text x="${(hx+R*0.4+z*10).toFixed(1)}" y="${(hy-R*1.2-z*18).toFixed(1)}" font-size="${(10+z*6).toFixed(1)}" fill="#2A9AA0" opacity="${(1-z).toFixed(2)}" font-family="Baloo 2,sans-serif" font-weight="700">z</text>`;
  }
  s += `<g transform="translate(${neck[0].toFixed(1)},${neck[1].toFixed(1)}) rotate(${headAng.toFixed(1)})">${head}</g>`;

  // tính vị trí đỉnh đầu cho bong bóng (toạ độ cục bộ)
  opts.headTop = [neck[0] + hx, neck[1] - R*2.1];
  { const a = headAng*Math.PI/180, mx = snX + B.snout*0.9, my = snY + B.snoutH*0.6;
    opts.mouth = [neck[0] + mx*Math.cos(a) - my*Math.sin(a), neck[1] + mx*Math.sin(a) + my*Math.cos(a)]; }
  return s;
}

function earShape(type, B, R, main, second, outline, droop, t){
  const inner = shade(main, 0.25);
  const ear = (tilt, far) => {
    const c = far ? shade(main,-0.15) : main;
    const ox = far ? R*0.25 : 0;
    switch(type){
      case "prick": case "bigPrick": {
        const h = (type==="bigPrick"? R*1.05 : R*0.75);
        const w = (type==="bigPrick"? R*0.62 : R*0.5);
        const rot = -18 + droop*70 + tilt;
        return `<g transform="translate(${(-R*0.15+ox).toFixed(1)},${(-R*0.6).toFixed(1)}) rotate(${rot.toFixed(1)})">
          <path d="M${-w/2},0 L0,${-h} L${w/2},0 Z" fill="${c}" stroke="${outline}" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M${-w/4},-2 L0,${-h*0.7} L${w/4},-2 Z" fill="${far?c:"#E9A9A0"}"/></g>`;
      }
      case "fold": {
        const rot = -10 + droop*50 + tilt;
        return `<g transform="translate(${(-R*0.1+ox).toFixed(1)},${(-R*0.65).toFixed(1)}) rotate(${rot.toFixed(1)})">
          <path d="M${-R*0.3},0 L${R*0.05},${-R*0.55} L${R*0.42},${-R*0.2} Z" fill="${c}" stroke="${outline}" stroke-width="1.8" stroke-linejoin="round"/></g>`;
      }
      case "floppy": case "longDrop": case "curlyDrop": {
        const len = type==="longDrop" ? R*1.45 : (type==="curlyDrop" ? R*1.35 : R*1.1);
        const sw = Math.sin(t*3)*3*(1-droop);
        const rot = 8 + droop*12 + tilt*0.3 + sw;
        const curly = type==="curlyDrop";
        let e = `<g transform="translate(${(-R*0.35+ox).toFixed(1)},${(-R*0.5).toFixed(1)}) rotate(${rot.toFixed(1)})">`;
        if (curly){
          for (let i=0;i<4;i++) e += `<circle cx="${(i%2?3:-1)}" cy="${(i*len*0.26).toFixed(1)}" r="${(R*0.36).toFixed(1)}" fill="${c}" stroke="${shade(main,-0.15)}" stroke-width="1.4"/>`;
        } else {
          e += `<path d="M${-R*0.28},0 C${-R*0.5},${len*0.6} ${-R*0.2},${len} ${R*0.08},${len} C${R*0.38},${len} ${R*0.42},${len*0.45} ${R*0.3},0 Z" fill="${shade(c,-0.12)}" stroke="${outline}" stroke-width="1.8"/>`;
        }
        return e + `</g>`;
      }
    }
    return "";
  };
  return { far: ear(-12, true), near: ear(0, false) };
}

function tailShape(type, B, main, second, outline){
  const L = B.bodyL;
  switch(type){
    case "curl": // cuộn lên lưng
      return `<path d="M0,0 C${-L*0.18},${-L*0.32} ${L*0.25},${-L*0.48} ${L*0.32},${-L*0.2}" stroke="${outline}" stroke-width="${B.fur==="fluffy"?20:11}" fill="none" stroke-linecap="round"/>
              <path d="M0,0 C${-L*0.18},${-L*0.32} ${L*0.25},${-L*0.48} ${L*0.32},${-L*0.2}" stroke="${main}" stroke-width="${B.fur==="fluffy"?17:8}" fill="none" stroke-linecap="round"/>
              ${B.fur==="fluffy"?`<circle cx="${L*0.06}" cy="${-L*0.36}" r="${L*0.14}" fill="${shade(main,0.08)}"/>`:`<path d="M${L*0.2},${-L*0.33} C${L*0.3},${-L*0.3} ${L*0.33},${-L*0.25} ${L*0.32},${-L*0.2}" stroke="${second}" stroke-width="5" fill="none" stroke-linecap="round"/>`}`;
    case "plume":
      return `<ellipse cx="${-L*0.12}" cy="${-L*0.28}" rx="${L*0.16}" ry="${L*0.3}" transform="rotate(-25)" fill="${shade(main,0.06)}" stroke="${outline}" stroke-width="1.8"/>`;
    case "fox":
      return `<ellipse cx="${-L*0.18}" cy="${-L*0.1}" rx="${L*0.2}" ry="${L*0.08}" transform="rotate(-25)" fill="${main}" stroke="${outline}" stroke-width="1.8"/>
              <ellipse cx="${-L*0.32}" cy="${-L*0.17}" rx="${L*0.07}" ry="${L*0.05}" transform="rotate(-25)" fill="${second}"/>`;
    case "stub":
      return `<ellipse cx="${-4}" cy="${-3}" rx="7" ry="5" fill="${main}" stroke="${outline}" stroke-width="1.6"/>`;
    case "pompom":
      return `<path d="M0,0 L${-L*0.08},${-L*0.42}" stroke="${outline}" stroke-width="6" stroke-linecap="round"/>
              <path d="M0,0 L${-L*0.08},${-L*0.42}" stroke="${main}" stroke-width="4" stroke-linecap="round"/>
              <circle cx="${-L*0.09}" cy="${-L*0.47}" r="${L*0.13}" fill="${main}" stroke="${shade(main,-0.15)}" stroke-width="1.6"/>`;
    case "straight":
      return `<path d="M0,0 L${-L*0.18},${-L*0.42}" stroke="${outline}" stroke-width="8" stroke-linecap="round"/>
              <path d="M0,0 L${-L*0.18},${-L*0.42}" stroke="${main}" stroke-width="5.5" stroke-linecap="round"/>`;
    case "sickle":
      return `<path d="M0,0 C${-L*0.2},${-L*0.25} ${-L*0.05},${-L*0.5} ${L*0.12},${-L*0.42}" stroke="${outline}" stroke-width="11" fill="none" stroke-linecap="round"/>
              <path d="M0,0 C${-L*0.2},${-L*0.25} ${-L*0.05},${-L*0.5} ${L*0.12},${-L*0.42}" stroke="${main}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
    case "long": // dachshund: dài, thon, cong nhẹ
      return `<path d="M0,0 C${-L*0.18},${L*0.02} ${-L*0.3},${-L*0.05} ${-L*0.38},${-L*0.16}" stroke="${outline}" stroke-width="7" fill="none" stroke-linecap="round"/>
              <path d="M0,0 C${-L*0.18},${L*0.02} ${-L*0.3},${-L*0.05} ${-L*0.38},${-L*0.16}" stroke="${main}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
    case "saber":
      return `<path d="M0,0 C${-L*0.15},${-L*0.05} ${-L*0.28},${-L*0.2} ${-L*0.3},${-L*0.36}" stroke="${outline}" stroke-width="7" fill="none" stroke-linecap="round"/>
              <path d="M0,0 C${-L*0.15},${-L*0.05} ${-L*0.28},${-L*0.2} ${-L*0.3},${-L*0.36}" stroke="${main}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  }
  return "";
}

// ảnh tĩnh (thẻ, thẻ chọn giống)
function staticDog(look, w, h, type="stand", bg=""){
  const B = BREEDS[look.breed];
  const pose = poseFor(type==="stand"?"happy":type, B);
  const span = B.bodyL + B.headR*2 + B.snout + 40;
  const tall = B.legL + B.bodyH + B.headR*2.6 + 10;
  const sc = Math.min(w/span, h/tall)*0.95;
  const ox = w/2 - (B.headR*0.6)*sc, oy = h - 8;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${bg}<ellipse cx="${w/2}" cy="${oy}" rx="${span*sc*0.4}" ry="5" fill="rgba(0,0,0,.12)"/><g transform="translate(${ox},${oy}) scale(${sc})">${dogSVG(look,pose,0.3)}</g></svg>`;
}

let save = loadSave();
let prof = null; // hồ sơ đang chơi

function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw){ const d = JSON.parse(raw); if (d && Array.isArray(d.profiles)) return d; }
  } catch(e){}
  return {version: SAVE_VERSION, profiles: [], current: null};
}
function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
  catch(e){ toast("Không lưu được trên trình duyệt này. Hãy dùng nút Lưu bản sao."); }
}
function newProfile(owner, look, name){
  const B = BREEDS[look.breed];
  const now = Date.now();
  return {
    id: uid(), owner, created: now,

const SICK_LABELS = ["Khỏe", "Hơi mệt", "Ốm", "Ốm nặng"];
function sickLevel(v){ v = v||0; return v >= 80 ? 3 : v >= 50 ? 2 : v >= 25 ? 1 : 0; }
function happyCap(v){ return [100, 80, 50, 30][sickLevel(v)]; }
function curSick(){ return prof ? sickLevel(prof.stats.sick) : 0; }
function levelOf(p){ return 1 + Math.floor(Math.sqrt(p.stats.xp/30)); }
function weightLabel(w){ return w < 35 ? "Cần ăn thêm" : (w > 65 ? "Hơi tròn" : "Vừa vặn"); }

// thời gian trôi (kể cả lúc tắt app). p.clock = giờ trong trò chơi (bằng giờ thật, trừ khi thử nhanh ?speed=)
function gameNow(p){ return p.clock || Date.now(); }
function mealsBetween(a, b){ // số lần đến giờ ăn trong khoảng (a, b]
  let n = 0; const d = new Date(a); d.setHours(0,0,0,0);
  for (let day = d.getTime(); day <= b; day += 86400000){
    for (const h of MEALS){ const t = new Date(day); t.setHours(h,0,0,0); const ts = t.getTime(); if (ts > a && ts <= b) n++; }
  }
  return n;
}
function isMealTime(p){ const h = new Date(gameNow(p)).getHours(); return MEALS.some(m => h >= m && h < m+2); }
function applyTime(p, now){
  const dtReal = clamp(now - p.last, 0, 7*86400000);
  if (dtReal <= 0){ p.last = now; return; }
  // tính từng đoạn tối đa 30 phút (giờ trò chơi) để lúc tắt app lâu vẫn đúng: đói, ăn, khỏi bệnh theo thứ tự
  const chunk = 1800000/SPEED;
  let start = now - dtReal;
  if (SPEED === 1) p.clock = start;
  while (start < now){
    const end = Math.min(now, start + chunk);
    p.last = start; stepTime(p, end);
    start = end;
  }
  p.last = now;
}
function stepTime(p, now){
  const dtReal = now - p.last;
  p.last = now;
  if (dtReal <= 0) return;
  const S = p.stats, B = BREEDS[p.dog.breed];
  if (p.skills.lie == null){ p.skills.lie = 0; p.practiced.lie = p.last; }
  if (!p.pets) p.pets = {date: todayStr(now), gained: 0, recent: []};
  if (S.thirst == null) S.thirst = 0;
  if (S.fit == null) S.fit = 50;
  if (S.sick == null) S.sick = 0;
  const from = gameNow(p);
  const to = from + dtReal*SPEED;
  p.clock = to;
  const dtH = dtReal*SPEED/3600000;
  // đói: tăng chậm giữa hai bữa; đến giờ ăn thì đói hẳn
  S.hunger = clamp(S.hunger + dtH*(100/20), 0, 100);
  if (mealsBetween(from, to) > 0) S.hunger = Math.max(S.hunger, 70);
  if (S.hunger >= 70) S.hunger = Math.min(100, S.hunger + dtH*10);
  // khát: nhắc khoảng 2 tiếng một lần, không phạt
  S.thirst = clamp(S.thirst + dtH*(100/WATER_HOURS), 0, 100);
  // vui vẻ: buồn dần, đói thì buồn nhanh hơn, không bao giờ dưới 20 (không bệnh, không chết)
  let happyLoss = dtH*(100/24)*B.energy;
  if (S.hunger > 60) happyLoss += dtH*(100/8);
  S.happy = Math.max(20, S.happy - happyLoss);
  // đói lâu thì bệnh dần (tập thể dục nhiều thì bệnh chậm hơn); ăn no thì khỏi dần
  if (S.hunger >= 85) S.sick = Math.min(100, S.sick + dtH*8*(1.3 - S.fit/100));
  else if (S.hunger < 50) S.sick = Math.max(0, S.sick - dtH*6);
  S.happy = Math.max(Math.min(20, happyCap(S.sick)), Math.min(S.happy, happyCap(S.sick)));
  // cân nặng: trở về vừa vặn; bị bỏ đói lâu thì giảm cân nhẹ
  S.weight = S.weight + clamp(50 - S.weight, -dtH*0.5, dtH*0.5);
  if (S.hunger > 85) S.weight = Math.max(25, S.weight - dtH*0.8);
  // khỏe mạnh: giảm dần nếu không tập
  S.fit = Math.max(10, S.fit - dtH*(100/96));
  // lâu không luyện thì quên nhẹ (sau 2 ngày, mỗi ngày -1)
  for (const k in p.skills){
    const idleDays = (to - p.practiced[k])/86400000;
    if (idleDays > 2){
      const loss = Math.min(dtH/24, idleDays-2);
      p.skills[k] = Math.max(0, p.skills[k] - loss);
    }
  }
  const td = todayStr(to);
  if (p.treats.date !== td){ p.treats = {date: td, left: TREATS_PER_DAY}; }
}

function rbox(w, h, d, r, color, o){
  r = Math.min(r, w/2-0.001, h/2-0.001, d/2-0.001);

}

// ---------- bản đồ đi lại (lưới + A*) ----------
const GRID = 0.12, GX = Math.round(6/GRID), GZ = Math.round(5/GRID);
let blocked = null, dogRadius = 0.3;
function buildGrid(radius){
  dogRadius = radius;
  blocked = new Uint8Array(GX*GZ);
  for (let i=0;i<GX;i++) for (let j=0;j<GZ;j++){
    const x = ROOM.x0 + (i+0.5)*GRID, z = ROOM.z0 + (j+0.5)*GRID;
    let b = x < ROOM.x0 + radius || x > ROOM.x1 - radius || z < ROOM.z0 + radius || z > ROOM.z1 - radius;
    for (const o of obstacles) if (x > o.x0 - radius && x < o.x1 + radius && z > o.z0 - radius && z < o.z1 + radius){ b = true; break; }
    blocked[i*GZ+j] = b ? 1 : 0;
  }
}
const cellOf = p => [clamp(Math.floor((p.x - ROOM.x0)/GRID), 0, GX-1), clamp(Math.floor((p.z - ROOM.z0)/GRID), 0, GZ-1)];
const cellPt = (i,j) => ({x: ROOM.x0 + (i+0.5)*GRID, z: ROOM.z0 + (j+0.5)*GRID});
function isFree(p){ const [i,j] = cellOf(p); return !blocked[i*GZ+j]; }
function nearestFree(p){
  if (isFree(p)) return {x: p.x, z: p.z};
  const [ci,cj] = cellOf(p);
  for (let r=1; r<Math.max(GX,GZ); r++){
    let best = null, bd = 1e9;
    for (let i=ci-r;i<=ci+r;i++) for (let j=cj-r;j<=cj+r;j++){
      if (i<0||j<0||i>=GX||j>=GZ || blocked[i*GZ+j]) continue;
      const q = cellPt(i,j), d = (q.x-p.x)**2 + (q.z-p.z)**2;
      if (d < bd){ bd = d; best = q; }
    }
    if (best) return best;
  }
  return {x:0, z:0};
}
function lineFree(a, b){
  const d = Math.hypot(b.x-a.x, b.z-a.z), n = Math.ceil(d/(GRID*0.5));
  for (let k=1;k<n;k++){ const t = k/n; if (!isFree({x: lerp(a.x,b.x,t), z: lerp(a.z,b.z,t)})) return false; }
  return true;
}
function findPath(from, to){
  to = nearestFree(to);
  const start = isFree(from) ? from : nearestFree(from);
  if (lineFree(start, to)) return [to];
  const [si,sj] = cellOf(start), [ti,tj] = cellOf(to);
  const N = GX*GZ, g = new Float32Array(N).fill(1e9), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const open = [si*GZ+sj]; g[si*GZ+sj] = 0;
  const h = (i,j)=>Math.hypot(i-ti, j-tj);
  while (open.length){
    let bi = 0, bf = 1e9;
    for (let k=0;k<open.length;k++){ const c = open[k], f = g[c] + h(Math.floor(c/GZ), c%GZ); if (f < bf){ bf = f; bi = k; } }
    const c = open.splice(bi,1)[0];
    if (closed[c]) continue; closed[c] = 1;
    const ci = Math.floor(c/GZ), cj = c%GZ;
    if (ci===ti && cj===tj) break;
    for (let di=-1;di<=1;di++) for (let dj=-1;dj<=1;dj++){
      if (!di && !dj) continue;
      const ni = ci+di, nj = cj+dj;
      if (ni<0||nj<0||ni>=GX||nj>=GZ) continue;
      const n = ni*GZ+nj;
      if (blocked[n] || closed[n]) continue;
      if (di && dj && (blocked[ci*GZ+nj] || blocked[ni*GZ+cj])) continue;
      const ng = g[c] + (di && dj ? 1.414 : 1);
      if (ng < g[n]){ g[n] = ng; came[n] = c; open.push(n); }
    }
  }
  const end = ti*GZ+tj;
  if (came[end] < 0) return [to];
  const pts = []; let c = end;
  while (c >= 0 && c !== si*GZ+sj){ pts.unshift(cellPt(Math.floor(c/GZ), c%GZ)); c = came[c]; }
  pts[pts.length-1] = to;
  // làm thẳng đường
  const out = []; let cur = start, k = 0;
  while (k < pts.length){
    let far = k;
    for (let m=pts.length-1; m>k; m--) if (lineFree(cur, pts[m])){ far = m; break; }
    out.push(pts[far]); cur = pts[far]; k = far + 1;
  }
  return out;
}
function randomFreePoint(){
  for (let n=0;n<200;n++){ const p = {x: rnd(ROOM.x0+0.4, ROOM.x1-0.4), z: rnd(ROOM.z0+0.4, ROOM.z1-0.4)}; if (isFree(p)) return p; }
  return {x:0, z:0.5};
}

const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _up = new THREE.Vector3(0,1,0), _q = new THREE.Quaternion();

const P3 = (x2, y2, side=0) => new THREE.Vector3(side, -y2*K, x2*K);
function updateDog3D(pose, t){
  const d = dog3, B = d.B;
  const L1 = B.legL*0.55, L2 = B.legL*0.55;
  const hL = B.bodyL*0.5, hH = B.bodyH*0.5;
  const ct = Math.cos(pose.tilt), st = Math.sin(pose.tilt);
  const W2 = (x,y) => [x*ct - y*st, -pose.cy + x*st + y*ct];

    [sh[0], sh[1], pose.fF, pose.fLift, -1, sideX],
    [sh[0]-3, sh[1], pose.fFFar, pose.fLiftFar, -1, -sideX],
    [hp[0], hp[1], pose.bF, pose.bLift, 1, sideX],
    [hp[0]+3, hp[1], pose.bFFar, pose.bLiftFar, 1, -sideX]
  ];
  legDefs.forEach(([hx2, hy2, fx, lift, bend, sx], i)=>{
    const lg = d.legs[i];
    const stretch = bend < 0 ? (pose.fStretch||1) : 1;
    let k;
    if (lift === 999 || lift > 500) k = ik(hx2, hy2, hx2 + B.legL*0.6, hy2 + B.legL*0.15, L1*stretch, L2*stretch, -1);
    else k = ik(hx2, hy2, hx2 + fx, -lift, L1*stretch, L2*stretch, bend);

    lg.j1.position.copy(A); lg.j2.position.copy(Kn);
    lg.paw.position.set(sx, F.y + d.legR*0.25, F.z + d.legR*0.35);

  const tb = W2(-hL*0.84, -hH*0.3);              // gốc nằm lọt trong mông

  const neck = W2(hL*0.78, -hH*0.55);

  d.head.rotation.y = (pose.shake||0)*Math.sin(t*20)*0.45;                 // lắc đầu khi ngậm xương
  d.head.rotation.z = pose.chew > 0.3 ? Math.sin(t*6)*0.2*pose.chew : 0;   // nghiêng đầu gặm

    if (e.pivot.userData.drop) e.pivot.rotation.set(0.1 + pose.ear*0.25, 0, e.s*(0.15 + Math.sin(t*3)*0.04*(1-pose.ear) + pose.ear*0.1));

  for (const e of d.eyes){
    const sy = happyEyes ? 0.28 : Math.max(0.08, open);

    e.hl1.visible = e.hl2.visible = !happyEyes && open > 0.2;
    const big = sad ? 1.12 : 1;   // mắt to long lanh khi buồn
    e.iris.scale.setScalar(d.R*0.27*0.92*big); e.pupil.scale.setScalar(d.R*0.27*0.55*big);
    e.iris.scale.y *= Math.max(0.1, open); e.pupil.scale.y *= Math.max(0.1, open);
    e.hl2.scale.setScalar(d.R*0.27*(sad ? 0.2 : joy ? 0.18 : 0.13));
    e.hl1.scale.setScalar(d.R*0.27*(joy ? 0.34 : 0.26));
    e.lid.visible = open < 0.9;
    e.lid.scale.y = d.R*0.27*1.16*Math.max(0.05, (1 - open)*0.95);
    e.lid.position.y = d.R*0.27*(0.55 + (1-open)*0.2);
    e.white.material = happyEyes ? mat("#1A1412") : mat("#FFFFFF", {r:0.3});
    e.brow.visible = sad;
    e.brow.rotation.z = -e.s*0.45;
    e.tear.visible = crying;
    if (crying){ const ph = (t*0.6 + (e.s>0?0.5:0)) % 1; e.tear.position.set(e.s*0.2*d.R*0.27, -d.R*0.27*(0.8 + ph*1.6), d.R*0.27*0.7); e.tear.material.opacity = 0.9*(1-ph); }
  }
  // chữ Z
  for (let i=0;i<3;i++){
    const z = d.zs[i]; z.visible = pose.sleep > 0.5;
    if (z.visible){ const ph = (t*0.45 + i/3) % 1; d.head.getWorldPosition(_a); z.position.set(_a.x + ph*0.18 + Math.sin(ph*6)*0.03, _a.y + d.R*1.2 + ph*0.45, _a.z); z.material.opacity = Math.min(1, (1 - ph)*1.6); z.scale.setScalar(0.1 + ph*0.12); }
  }
}

let audioCtx = null, lastBark = 0;
function soundOn(){ return !(save.settings && save.settings.sound === false); }
function bark(times=2){
  if (!soundOn()) return;
  const nowMs = performance.now(); if (nowMs - lastBark < 3500) return; lastBark = nowMs;
  try {
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const pitch = {pom:1.45, corgi:1.15, poodle:1.1, shiba:1.05, dachshund:1.0}[prof ? prof.dog.breed : "pom"] || 1.2;
    for (let i=0;i<times;i++){
      const t0 = audioCtx.currentTime + 0.02 + i*0.26;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(380*pitch, t0);
      o.frequency.exponentialRampToValueAtTime(720*pitch, t0+0.04);
      o.frequency.exponentialRampToValueAtTime(260*pitch, t0+0.16);
      f.type = "bandpass"; f.frequency.value = 1100*pitch; f.Q.value = 1.2;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.35, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.18);
      o.connect(f); f.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0+0.2);
    }
  } catch(e){}
}

  const n = noiseSrc(c), f = c.createBiquadFilter(), g = c.createGain();

  n.connect(f); f.connect(g); g.connect(c.destination); env(c, g, t0, Math.min(0.01, dur/3), peak, dur);

  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  if (f2){ o.frequency.exponentialRampToValueAtTime(f1, t0 + dur*0.4); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur); }
  else o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  o.connect(g); g.connect(c.destination); env(c, g, t0, Math.min(0.02, dur/4), peak, dur);

      const n = noiseSrc(c), f = c.createBiquadFilter(), g = c.createGain(), o = c.createOscillator(), og = c.createGain(), lp = c.createBiquadFilter();
      f.type = "bandpass"; f.frequency.setValueAtTime(380, t); f.frequency.linearRampToValueAtTime(620, t+0.9); f.Q.value = 3;
      n.connect(f); f.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t+0.6); g.gain.exponentialRampToValueAtTime(0.0001, t+1.0);
      o.type = "sawtooth"; o.frequency.setValueAtTime(70, t); o.frequency.linearRampToValueAtTime(95, t+0.9);
      lp.type = "lowpass"; lp.frequency.value = 320;

      og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.11, t+0.55); og.gain.exponentialRampToValueAtTime(0.0001, t+1.0);

    case "lap": tone(c, t, "sine", 420, 900, 0.07, 0.08); break;
    case "jump": tone(c, t, "sine", 260, 640, 0.07, 0.22); noiseHit(c, t, 1200, 0.6, 0.03, 0.18); break;
    case "land": tone(c, t, "sine", 130, 55, 0.18, 0.14); noiseHit(c, t, 400, 0.8, 0.06, 0.08); break;
    case "bounce": tone(c, t, "sine", 210, 95, 0.12, 0.1); break;
    case "squeak": tone(c, t, "square", 1250, 1900, 0.035, 0.22, 1150); break;
    case "pant": for (let i=0;i<4;i++) noiseHit(c, t + i*0.17, 1500, 1.4, 0.05, 0.1); break;
    case "chime": tone(c, t, "sine", 880, 880, 0.08, 0.25); tone(c, t+0.12, "sine", 1320, 1320, 0.07, 0.35); break;
    case "whoosh": noiseHit(c, t, 900, 0.5, 0.05, 0.3); break;
  }
}

function successChance(skill){ return clamp(0.1 + 0.9*(skill/85), 0.1, 1); }
function doCommand(cmd, at){
  closeRing(); stopPlay(true); excite();
  if (dog.state==="sleep" || dog.state==="toBed"){ restMode=false; updateRestBtn(); dog.pose.sleep = 0; }
  if (curSick() >= 3){ setState("sad", 4000); bubble("Ốm quá, hông làm nổi... 🤒", 2400, true); hint("Cho ăn và cho nghỉ để chó khỏe lại", 3500); return; }
  const target = nearestFree(at || dog.pos);
  const skill = prof.skills[cmd];
  const ok = Math.random() < successChance(skill) * (curSick() >= 2 ? 0.6 : 1);
  prof.practiced[cmd] = gameNow(prof);
  showMarker(target, COMMANDS[cmd].n + (cmd==="come" ? "" : " đây"));
  trainWin = null;
  const doAction = ()=>{
    if (!ok){ wrongAction(cmd); return; }
    dog.faceCam = true;
    if (cmd==="sit") setState("sit", 5000);
    else if (cmd==="lie") setState("lie", 5000);
    else if (cmd==="stand"){
      if (["sit","lie","sad","sleep","chew"].includes(dog.state)) setState("happy", 2500);
      else setState("beg", 2600);
    } else setState("happy", 2500);
    trainWin = {cmd, until: performance.now() + TRAIN_WINDOW_MS};
    hint(`${prof.dog.name} làm đúng rồi! Cho đồ ăn thưởng ngay để nhớ bài`, 3500);
  };
  const far = Math.hypot(dog.pos.x - target.x, dog.pos.z - target.z) > 0.15;
  if (!ok){
    const r = Math.random();
    if (r < 0.35) walkTo(randomFreePoint(), false, ()=>wrongAction(cmd));
    else if (r < 0.55) walkTo({x: room.bowl.x - 0.45, z: room.bowl.z - 0.1}, false, ()=>wrongAction(cmd));
    else if (r < 0.8 && far){ const t = rnd(0.3, 0.7); walkTo({x: lerp(dog.pos.x, target.x, t), z: lerp(dog.pos.z, target.z, t)}, false, ()=>wrongAction(cmd)); }
    else wrongAction(cmd);
  } else if (far){
    const run = skill >= 50;
    if (skill < 30 && Math.random() < 0.6){
      const dx = target.x - dog.pos.x, dz = target.z - dog.pos.z, dl = Math.hypot(dx, dz) || 1, o = rnd(0.35, 0.8);
      const over = nearestFree({x: target.x + dx/dl*o, z: target.z + dz/dl*o});
      walkTo(over, false, ()=>walkTo(target, false, doAction));
    } else walkTo(target, run, doAction);
  } else doAction();
  persist();
}
function wrongAction(cmd){
  dog.faceCam = true;
  const wrong = pick(["scratch","look","lie", cmd==="sit"?"beg":"sit"]);
  setState(wrong, wrong==="lie" ? 3000 : 2200);

function idleBrain(now){
  if (restMode) return;
  const S = prof.stats;
  if (now < dog.next) return;
  dog.next = now + rnd(3500, 8000);
  if (sickLevel(S.sick) >= 2){
    dog.faceCam = true; setState("sad", 7000);
    if (Math.random()<0.5) bubble(pick(["Mệt quá... 🤒","Đói quá, ốm rồi 🤒","Cho ăn đi mà 🤒"]), 2600);
    return;
  }
  if (S.hunger > 70){
    const spot = {x: room.bowl.x - 0.45, z: room.bowl.z - 0.05};
    if (Math.hypot(dog.pos.x - spot.x, dog.pos.z - spot.z) > 0.25) walkTo(spot);
    else { dog.faceCam = true; setState("hungry", 4000); }
    if (Math.random()<0.6) bubble(pick(["Đói quá...","Cho ăn đi mà","Bụng kêu rồi"]), 2600);
    return;
  }
  if (S.happy < 35){
    dog.faceCam = true; setState("sad", 6000);
    if (Math.random()<0.4) bubble(pick(["Buồn quá...", `Chơi với ${prof.dog.name} hông?`]), 2400);
    return;
  }
  if ((S.thirst||0) >= 100 && Math.random() < 0.35){ bubble(pick(["Khát nước quá","Cho uống nước nha"]), 2400); }
  if (isMealTime(prof) && S.hunger >= 70 && Math.random() < 0.5){ bubble("Tới giờ ăn rồi!", 2400); }
  if (dog.onChair){   // trên ghế: thích ngồi ngắm lâu, thỉnh thoảng nằm, rồi mới nhảy xuống
    const q = Math.random();
    dog.lookAt = {x: -3.2, z: room.chair.z};
    if (q < 0.55) setState("sit", rnd(8000, 14000));
    else if (q < 0.75) setState("lie", rnd(6000, 10000));
    else walkTo(randomFreePoint());
    return;
  }
  const r = Math.random();
  if (r < 0.4) walkTo(randomFreePoint());
  else if (r < 0.62) goChair();          // chỗ yêu thích: ghế cạnh cửa sổ
  else if (r < 0.64){ dog.faceCam = Math.random() < 0.5; setState("sit", rnd(3000,6000)); }
  else if (r < 0.74) setState("lie", rnd(4000,7000));
  else if (r < 0.87) setState("look", 2000);
  else setState("idle", 2500);
}

// ---- vòng lặp ----
function turnTo(target, dt, rate=7){
  let d = target - dog.heading;
  while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2;
  const step = clamp(d, -rate*dt, rate*dt);
  dog.heading += step;
  return Math.abs(d);
}
function frame(now){
  const dt = clamp((now - lastFrame)/1000, 0, 0.05); lastFrame = Math.max(lastFrame, now); tSec += dt;
  if (!prof || !dog3){ if (!SIM) requestAnimationFrame(frame); return; }
  const B = BREEDS[prof.dog.breed];

  // đang nhảy: bay theo đường cong, xong thì gọi bước tiếp
  if (dog.jump){
    const j = dog.jump, k = clamp((tSec - j.t0)/j.dur, 0, 1);
    const e = k*k*(3 - 2*k);
    dog.pos.x = lerp(j.fx, j.tx, e); dog.pos.z = lerp(j.fz, j.tz, e);
    dog.y = lerp(j.fy, j.ty, e) + Math.sin(Math.PI*k)*0.28;
    turnTo(Math.atan2(j.tx - j.fx, j.tz - j.fz), dt, 10);
    if (k >= 1){ dog.jump = null; dog.y = j.ty; sfx("land"); if (dog.state==="jump") dog.state = "idle"; if (j.then) j.then(); }
  }
  // di chuyển theo đường đi
  if (isMoving()){
    const wp = dog.path[0];
    const dx = wp.x - dog.pos.x, dz = wp.z - dog.pos.z, dist = Math.hypot(dx, dz);
    if (dist < 0.04){
      dog.path.shift();
      if (!dog.path.length){
        const then = dog.then; dog.then = null;
        if (then) then(); else setState("idle", 1200);
      }
    } else {
      const off = turnTo(Math.atan2(dx, dz), dt, dog.state==="run" ? 9 : 6);
      const sp = dog.speed * (off > 1.2 ? 0.15 : off > 0.5 ? 0.6 : 1);
      const step = Math.min(dist, sp*dt);
      const f = fwd();
      dog.pos.x += f.x*step; dog.pos.z += f.z*step;
      if (off > 0.6){ dog.pos.x += (dx/dist)*step*0.5; dog.pos.z += (dz/dist)*step*0.5; }
      const stride = Math.max(B.legL*0.5, 6)*K;
      const ph0 = Math.floor(dog.walkPhase/(Math.PI/2));
      dog.walkPhase += step/(stride*2) * Math.PI;
      if (Math.floor(dog.walkPhase/(Math.PI/2)) !== ph0) sfx("step");
    }
  } else {
    // đứng yên: quay mặt về người chơi hoặc về vật đang nhìn
    if (dog.lookAt){ turnTo(Math.atan2(dog.lookAt.x - dog.pos.x, dog.lookAt.z - dog.pos.z), dt, 4); }
    else if (dog.faceCam) turnTo(facingCamHeading(), dt, 4);
  }
  if (isMoving()) dog.lookAt = null;

  // hết thời gian trạng thái
  if (dog.until && now > dog.until){
    const st = dog.state;
    dog.until = 0;
    if (st==="eat"){
      if (dog.drink){ dog.drink=false; const S=prof.stats; S.thirst=0; S.sick=Math.max(0,(S.sick||0)-3); S.happy=Math.min(happyCap(S.sick),S.happy+2); persist(); bubble("Mát quá!",1500); }
      if (dog.meal){ dog.meal=false; bowlFull=false; const S=prof.stats; const wasFull = S.hunger<40; S.hunger=0; S.sick=Math.max(0,(S.sick||0)-10); S.happy=Math.min(happyCap(S.sick),S.happy+10); S.weight=Math.min(100,S.weight+(wasFull?3:1)); S.bond=Math.min(100,S.bond+1); S.xp+=2; persist(); bubble("No rồi!",1800); }
      const a = dog.afterEat; dog.afterEat=null; dog.lookAt = null; dog.faceCam = true;
      setState(a||"idle", 1600);
    } else if (st==="play" && play && play.type==="ball" && dog.afterPlay==="throw"){
      dog.afterPlay=null; throwBall();
    } else if (st==="play" && play && play.type==="ball" && dog.afterPlay==="chase"){
      dog.afterPlay=null; dog.lookAt = null;
      const chase = ()=>{
        if (!play || !toy) return;
        if (toy.p.y > 0.12 || toy.v.length() > 0.3){ walkTo({x: toy.p.x + toy.v.x*0.4, z: toy.p.z + toy.v.z*0.4}, true, chase); return; }
        if (Math.hypot(toy.p.x - dog.pos.x, toy.p.z - dog.pos.z) > 0.5){ walkTo({x: toy.p.x, z: toy.p.z}, true, chase); return; }
        toy.held = true;
        walkTo(nearestFree({x: -0.15 + rnd(-0.5,0.5), z: 0.6 + rnd(-0.3,0.4)}), false, ()=>{
          if (!play) return;
          toy.held = false; toy.v.set(0, 0.6, 0);
          playRoundReward(); persist();
          dog.faceCam = true;
          setState("play", 1100, {afterPlay: "throw"});
        });
      };
      walkTo({x: toy.p.x + toy.v.x*0.8, z: toy.p.z + toy.v.z*0.8}, true, chase);
    } else if (st==="chew" && play && play.type==="bone"){
      // gặm xong một lúc: ngậm xương lên lắc đầu, rồi tung lên chụp lại
      playRoundReward(); persist();
      if (toy){ toy.held = true; toy.spin = 0; }
      sfx("squeak");
      setState("play", 1600, {afterPlay: "toss"});
    } else if (st==="play" && play && play.type==="bone" && dog.afterPlay==="toss"){
      if (toy){ toy.held = false; toy.p.copy(dog.mouth3 || toy.p); toy.v.set(0, 2.4, 0); toy.spin = 1; }
      setState("play", 1050, {afterPlay: "chewStart"});
    } else if (st==="play" && play && play.type==="bone" && dog.afterPlay==="chewStart"){
      dog.afterPlay=null;
      if (toy){ toy.held = false; toy.v.set(0,0,0); toy.spin = 0; }
      { const h = facingCamHeading() + (Math.random() < 0.5 ? 1 : -1)*1.0; dog.faceCam = false; dog.lookAt = {x: dog.pos.x + Math.sin(h), z: dog.pos.z + Math.cos(h)}; }   // nằm xoay nghiêng cho thấy khúc xương
      setState("chew", rnd(6000, 9000));
    } else if (st==="chew"){ toy=null; setState("happy",1500); }
    else if (st!=="sleep"){ dog.lookAt = null; setState("idle", 0); }
  }
  if (dog.state==="idle" && !dog.until) idleBrain(now);
  // tiếng theo trạng thái: ngáy khi ngủ, gặm rôm rốp, liếm nước
  if (tSec > (dog.nextSfx||0)){
    if (dog.state==="sleep" && dog.pose.sleep > 0.5){ sfx("snore"); dog.nextSfx = tSec + 3.4; }
    else if (dog.state==="chew" || (dog.state==="eat" && !dog.drink)){ sfx("crunch"); dog.nextSfx = tSec + rnd(0.35, 0.6); }
    else if (dog.state==="eat" && dog.drink){ sfx("lap"); dog.nextSfx = tSec + 0.28; }
    else dog.nextSfx = tSec + 0.3;
  }

  // tư thế mục tiêu (dùng chung poseFor của bản 2D)
  let target;
  const moving = isMoving();
  if (moving){
    target = poseFor("stand", B);
    const ph = dog.walkPhase, stride = Math.max(B.legL*0.45, 5)*(dog.state==="run"?1.4:1);
    const lift = Math.max(B.legL*0.35, 4)*(dog.state==="run"?1.3:1);
    const f = (o)=>Math.sin(ph+o)*stride, l=(o)=>Math.max(0,Math.cos(ph+o))*lift;
    target.fF = f(0); target.fLift = l(0);
    target.bFFar = f(0.3); target.bLiftFar = l(0.3);
    target.fFFar = f(Math.PI); target.fLiftFar = l(Math.PI);
    target.bF = f(Math.PI+0.3); target.bLift = l(Math.PI+0.3);
    target.cy += Math.abs(Math.sin(ph))*1.5 - 0.8;
    if (dog.state==="run"){ target.tongue = 1; target.happy = 1; }
    if (prof.stats.happy < 35){ target.ear = 0.8; target.tail = 1.2; }
  } else {
    const map = {idle:"stand", sit:"sit", beg:"beg", lie:"lie", sleep:"sleep", sad:"sad", eat:"eat",
                 chew:"chew", happy:"happy", play:"play", scratch:"scratch", look:"look", hungry:"hungry"};
    target = poseFor(map[dog.state]||"stand", B);
    if (dog.state==="happy") target.cy += Math.max(0, Math.sin(tSec*9))*5;
    if (dog.state==="scratch") target.bF = B.legL*0.2 + Math.sin(tSec*30)*3;
    if (dog.state==="look") target.head = -0.35 + Math.sin(tSec*1.5)*0.15;
    if (dog.state==="chew" && toy && toy.type==="bone"){ target.head = 0.62; }   // cúi xuống gặm xương giữa hai chân trước
    if (dog.state==="play" && toy && toy.type==="bone" && toy.held){ target.shake = 1; target.head = -0.05; target.happy = 1; }
    if (dog.state==="sleep"){   // 3D: nằm nghiêng, chân duỗi thả lỏng, đầu gối xuống sàn
      const L = B.legL, H = B.bodyH;
      target.cy = (L + H*0.25)*0.88;
      target.fF = L*0.55; target.fFFar = L*0.3; target.bF = -L*0.45; target.bFFar = -L*0.2;
      target.head = 0.28; target.tail = 1.4; target.ear = 0.7;
    }
  }
  if (dog.jump){   // nhảy: co chân lại, thân ngóc lên rồi chúi xuống
    const kj = clamp((tSec - dog.jump.t0)/dog.jump.dur, 0, 1), L = B.legL;
    target = poseFor("stand", B);
    target.fF = L*0.55; target.fFFar = L*0.45; target.bF = -L*0.5; target.bFFar = -L*0.4;
    target.fLift = target.fLiftFar = L*0.35*Math.sin(Math.PI*kj); target.bLift = target.bLiftFar = L*0.25*Math.sin(Math.PI*kj);
    target.tilt = kj < 0.5 ? -0.3 : 0.2; target.happy = 1; target.ear = 0.3;
  }
  if (target.sleep > 0.5) target.wag = 0;
  else if (play || now < excitedUntil){ target.wag = Math.max(target.wag, 0.7); target.wagSpd = 20; }
  else { target.wag = Math.min(target.wag, 0.12); target.wagSpd = 4; }
  if (curSick() >= 1 && !target.sleep){
    target.eye = Math.min(target.eye, curSick() >= 2 ? 0.5 : 0.75);
    target.ear = Math.max(target.ear, curSick() >= 2 ? 0.8 : 0.4);
    target.happy = 0; target.tongue = 0; target.wag = Math.min(target.wag, play || now < excitedUntil ? 0.3 : 0.08);
  }
  const k = 1 - Math.pow(0.0008, dt);
  for (const key in target){
    if (target[key] === 999 || dog.pose[key] === 999){ dog.pose[key] = target[key]; continue; }
    dog.pose[key] = lerp(dog.pose[key] ?? target[key], target[key], (moving || dog.jump) ? Math.min(1,k*2.5) : k);
  }

  // đồ chơi
  if (toy){
    if (toy.held && dog.mouth3){ toy.p.copy(dog.mouth3); toy.v.set(0,0,0); }
    else if (toy.type==="bone" && dog.state==="chew" && dog.mouth3 && !toy.spin){   // xương nằm dưới miệng, giữa hai chân trước
      const f = fwd(); toy.p.set(dog.mouth3.x + f.x*0.03, Math.max(dog.y + 0.035, dog.mouth3.y - 0.03), dog.mouth3.z + f.z*0.03); toy.v.set(0,0,0);
    }
    else {
      toy.v.y -= 9.8*dt; toy.p.addScaledVector(toy.v, dt);
      const r = toy.type==="ball" ? 0.07 : 0.03;
      if (toy.p.y < r){ toy.p.y = r; if (Math.abs(toy.v.y) > 0.8) sfx(toy.type==="ball" ? "bounce" : "land"); toy.v.y = Math.abs(toy.v.y) > 0.6 ? -toy.v.y*0.45 : 0; toy.v.x *= 0.8; toy.v.z *= 0.8; if (toy.type!=="ball") toy.spin = 0; }
      if (toy.p.x < ROOM.x0+0.1 || toy.p.x > ROOM.x1-0.1){ toy.v.x *= -0.5; toy.p.x = clamp(toy.p.x, ROOM.x0+0.1, ROOM.x1-0.1); }
      if (toy.p.z < ROOM.z0+0.1 || toy.p.z > ROOM.z1-0.1){ toy.v.z *= -0.5; toy.p.z = clamp(toy.p.z, ROOM.z0+0.1, ROOM.z1-0.1); }
      if (toy.p.y <= r + 0.001){ toy.v.x *= Math.pow(0.15, dt); toy.v.z *= Math.pow(0.15, dt); }
    }
  }
  if (play) $("stopPlayTime").textContent = fmtTime(performance.now() - play.start);

  applyTime(prof, Date.now());
  render(now);
  if (!SIM) requestAnimationFrame(frame);
}
function fmtTime(ms){ const s = Math.floor(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

function ensureToyMesh(type){
  if (toyMesh[type]) return toyMesh[type];
  let m;
  if (type==="ball"){ m = sph(0.07, "#E5533D", {r:0.5}); const s = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.008, 6, 24), mat("#FFFFFF")); m.add(s); s.scale.setScalar(1/0.07); }
  else {
    m = new THREE.Group();
    const bar = rbox(0.2, 0.045, 0.045, 0.02, "#F3EBDC"); m.add(bar);
    for (const [x,z] of [[-0.1,-0.025],[-0.1,0.025],[0.1,-0.025],[0.1,0.025]]){ const k = sph(0.032, "#F3EBDC"); k.position.set(x, 0, z); m.add(k); }
    m.traverse(o=>{ if (o.isMesh) o.castShadow = true; });
  }
  m.traverse(o=>{ if (o.isMesh){ o.userData.kind = "toy"; pickables.push(o); } });
  scene.add(m); toyMesh[type] = m; return m;
}
function render(now){
  // chó
  dog.root = dog3.root;
  const onBed = Math.hypot(dog.pos.x - room.bed.x, dog.pos.z - room.bed.z) < 0.4;
  if (dog.onChair && !dog.jump) dog.y = room.chair.y;
  else if (!dog.jump) dog.y = lerp(dog.y, onBed ? 0.08 : 0, 0.15);
  dog3.root.position.set(dog.pos.x, dog.y, dog.pos.z);
  dog3.root.rotation.y = dog.heading;
  updateDog3D(dog.pose, tSec);
  dog3.root.updateMatrixWorld(true);
  dog3.topMark.getWorldPosition(_a); dog.headTop = project(_a);
  dog.mouth3 = dog3.mouthMark.getWorldPosition(new THREE.Vector3());
  // đồ chơi
  for (const t of ["ball","bone"]) if (toyMesh[t]) toyMesh[t].visible = false;
  if (toy){
    const m = ensureToyMesh(toy.type); m.visible = true;
    m.position.copy(toy.p);
    if (toy.type==="ball") m.rotation.x += toy.v.length()*0.1;
    else if (toy.spin) m.rotation.set(tSec*12, dog.heading + Math.PI/2, 0);
    else if (toy.held || dog.state==="chew") m.rotation.set(0, dog.heading + Math.PI/2 + (dog.state==="chew" ? Math.sin(tSec*6)*0.25 : 0), dog.state==="chew" ? Math.sin(tSec*12)*0.12 : 0);
    else m.rotation.set(0, 0.6, 0);
  }
  // bát, nước, đồng hồ, cửa sổ theo giờ
  room.food.visible = bowlFull;
  const wl = 1 - clamp((prof.stats.thirst||0)/100, 0, 1);
  room.waterTop.visible = wl > 0.05; room.waterTop.position.y = 0.05 + 0.035*wl;
  const gt = new Date(gameNow(prof)), hr = gt.getHours() + gt.getMinutes()/60;
  room.hHand.rotation.z = -((hr % 12)/12)*Math.PI*2;
  room.mHand.rotation.z = -(gt.getMinutes()/60)*Math.PI*2;
  const sky = hr < 5.5 || hr >= 19.5 ? "#2A3A66" : hr < 7 ? "#F6C9A0" : hr < 17 ? "#BFE3F7" : hr < 19.5 ? "#F6B98A" : "#2A3A66";
  room.sky.material.color.set(sky);
  room.sunDisc.material.color.set(hr < 5.5 || hr >= 19.5 ? "#F2F2E6" : "#FFE07A");
  room.tvScreen.material.emissiveIntensity = 0.5 + Math.sin(tSec*0.7)*0.1;
  // dấu chỗ bấm
  if (marker3){ marker3.visible = now < markerUntil; if (marker3.visible){ marker3.scale.setScalar(1 + Math.sin(tSec*6)*0.12); const [mx,my] = project(marker3.position); const m = $("marker"); m.style.left = mx+"px"; m.style.top = (my-8)+"px"; } }
  updateCamera(0.04);
  renderer.render(scene, camera);
  // bong bóng lời nói
  const bEl = $("bubble");
  if (now > dog.bubbleUntil || ringOpen) bEl.classList.remove("show");
  bEl.style.left = clamp(dog.headTop[0], 70, W-70) + "px";
  bEl.style.top = Math.max(44, dog.headTop[1] - 6) + "px";
  if (QS.get("dbg")) $("hint").textContent = `pos=${dog.pos.x.toFixed(2)},${dog.pos.z.toFixed(2)} st=${dog.state} path=${dog.path.length} chair=${!!dog.onChair} jump=${!!dog.jump} y=${dog.y.toFixed(2)} sp=${(dog.speed||0).toFixed(2)} wp=${dog.path[0]?dog.path[0].x.toFixed(2)+","+dog.path[0].z.toFixed(2):"-"} h=${dog.heading.toFixed(2)} t=${tSec.toFixed(1)}`;
}

let ringX = 0, ringY = 0, ringWorld = null;
function openRing(x, y, world){
  excite();
  ringOpen = true; ringX = x; ringY = y; ringWorld = world || null;
  $("bubble").classList.remove("show"); dog.bubbleUntil = 0;
  const ring = $("ring");
  const left = prof.treats.left;
  const items = [["come","👋","Lại đây"],["sit","🪑","Ngồi"],["stand","🐕","Đứng"],["lie","💤","Nằm"],["treat","🍪",`Thưởng (${left})`]];
  ring.innerHTML = `<div class="tapDot"></div>` + items.map(([k,ic,n])=>`<button class="ringBtn" data-k="${k}" ${k==="treat"&&left<=0?"disabled":""}><span class="ic">${ic}</span>${n}</button>`).join("");
  placeRing();
  requestAnimationFrame(()=>ring.querySelectorAll(".ringBtn").forEach(b=>b.classList.add("show")));
  ring.querySelectorAll(".ringBtn").forEach(b=>b.addEventListener("pointerdown", e=>e.stopPropagation()));
  ring.querySelectorAll(".ringBtn").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const k = b.dataset.k;
    if (k==="treat") giveTreat(); else doCommand(k, ringWorld);
  }));
}
function placeRing(){
  const ring = $("ring");
  const dot = ring.querySelector(".tapDot"); if (dot){ dot.style.left = ringX+"px"; dot.style.top = ringY+"px"; }
  const btns = ring.querySelectorAll(".ringBtn");
  const r = 92;
  const cx = clamp(ringX, r + 34, W - r - 34), cy = clamp(ringY - 10, r + 40, H);
  const angs = [-175, -132, -90, -48, -5];
  btns.forEach((b,i)=>{ const a = angs[i]*Math.PI/180; b.style.left = (cx + Math.cos(a)*r) + "px"; b.style.top = (cy + Math.sin(a)*r) + "px"; });
}
function closeRing(){
  if (!ringOpen) return;
  ringOpen = false;
  const ring = $("ring");
  ring.querySelectorAll(".ringBtn").forEach(b=>b.classList.remove("show"));
  setTimeout(()=>{ if(!ringOpen) ring.innerHTML=""; }, 200);
}

const raycaster = new THREE.Raycaster(), _ndc = new THREE.Vector2();
function pickAt(x, y){
  _ndc.set(x/W*2 - 1, -(y/H)*2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  const shown = o => { while (o){ if (!o.visible) return false; o = o.parent; } return true; };
  return hits.find(h => shown(h.object)) || null;
}
canvas.addEventListener("pointerdown", e=>{
  if (!prof) return;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = pickAt(x, y);
  const kind = hit ? hit.object.userData.kind : null;
  if (kind==="dog"){ closeRing(); petDog(); return; }
  if (kind==="bowl"){ closeRing(); feedBowl(); return; }
  if (kind==="water"){ closeRing(); drinkWater(); return; }
  if (kind==="toyBall" || kind==="toyBone"){ closeRing(); const ty = kind==="toyBall" ? "ball" : "bone"; if (!(play && play.type===ty)) playToy(ty); return; }
  if (kind==="toy"){ closeRing(); tapToy(); return; }
  if (kind==="chair"){ closeRing(); goChair(true); return; }
  if (ringOpen){ closeRing(); return; }
  if (kind==="floor" || kind==="bed"){ openRing(x, y, {x: hit.point.x, z: hit.point.z}); return; }
  if (kind==="sofa") hint("Lệnh \"Lên đây\" (nhảy lên sofa) sẽ có ở đợt sau", 2500);
  else hint("Bấm lên sàn để ra lệnh", 2000);
});

function runPreview(){
  const svg = $("preview"); if (!svg) return;
  const B = BREEDS[draft.look.breed];
  const r = svg.getBoundingClientRect(); const w = r.width||340, h = r.height||190;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const span = B.bodyL + B.headR*2 + B.snout + 40, tall = B.legL + B.bodyH + B.headR*2.6 + 14;
  const sc = Math.min(w/span, (h-14)/tall)*0.9;
  const t0 = performance.now();
  const loop = (now)=>{
    if (!$("preview")) return;
    const t = (now-t0)/1000;
    const pose = poseFor(Math.floor(t/3)%3===1 ? "sit" : "happy", B);
    const svgEl = $("preview");
    svgEl.innerHTML = `<ellipse cx="${w/2}" cy="${h-8}" rx="${span*sc*0.38}" ry="5" fill="rgba(0,0,0,.12)"/><g transform="translate(${w/2 - B.headR*0.6*sc},${h-8}) scale(${sc})">${dogSVG(draft.look, pose, t)}</g>`;
    previewRAF = requestAnimationFrame(loop);
  };
  previewRAF = requestAnimationFrame(loop);
}

function cardData(p){
  return {v:1, n:p.dog.name, o:p.owner, b:p.dog.breed, c:p.dog.coat, e:p.dog.ear, t:p.dog.tail, y:p.dog.eye,
          l:levelOf(p), s:[Math.round(p.skills.sit),Math.round(p.skills.stand),Math.round(p.skills.come),Math.round(p.skills.lie||0)],
          h:Math.round(p.stats.happy), d:Math.round(p.stats.bond), w:Math.round(p.stats.weight)};
}
function encodeCard(obj){
  const json = JSON.stringify(obj);
  const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return "POPPY1:" + b64;
}
function decodeCard(str){
  str = str.trim();
  if (!str.startsWith("POPPY1:")) throw new Error("bad");
  let b = str.slice(7).replace(/-/g,"+").replace(/_/g,"/"); while (b.length%4) b+="=";
  const o = JSON.parse(decodeURIComponent(escape(atob(b))));
  if (!BREEDS[o.b]) throw new Error("bad");
  return o;
}
function cardHTML(c){
  const B = BREEDS[c.b];
  const look = {breed:c.b, coat:c.c, ear:c.e, tail:c.t, eye:c.y};
  return `<div class="dogcard"><h3>${esc(c.n)}</h3><div class="meta">${esc(c.o)} · ${B.name} · Cấp ${c.l}</div>
    ${staticDog(look, 300, 140).replace("<svg ", '<svg class="portrait" ')}
    ${statRow("Lại đây", c.s[2], true)}${statRow("Ngồi", c.s[0], true)}${statRow("Đứng", c.s[1], true)}${statRow("Nằm", c.s[3]||0, true)}
    ${statRow("Vui vẻ", c.h)}${statRow("Thân thiết", c.d)}
    <div class="stat"><div class="lbl"><span>Cân nặng</span><span>${weightLabel(c.w)}</span></div></div></div>`;
}

function showScan(){
  const el = $("cardSheet");

async function startCam(){
  const msg = $("camMsg");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof jsQR!=="function"){
    msg.textContent = "Máy này chưa quét được mã QR trong trang. Dùng cách dán mã chữ."; return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v = $("cam"); v.srcObject = camStream; await v.play();
    msg.textContent = "Đưa mã QR vào giữa khung hình";
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently:true});
    const tick = ()=>{
      if (!camStream) return;
      if (v.readyState >= 2){
        cv.width = v.videoWidth; cv.height = v.videoHeight;
        cx.drawImage(v,0,0);
        const img = cx.getImageData(0,0,cv.width,cv.height);
        const r = jsQR(img.data, img.width, img.height);
        if (r && r.data.startsWith("POPPY1:")){
          try { const c = decodeCard(r.data); stopCam(); showCompare(c); return; } catch(e){}
        }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    tick();
  } catch(e){
    msg.textContent = "Không mở được camera (cần cho phép camera, và trang phải mở bằng https). Dùng cách dán mã chữ.";
  }
}
